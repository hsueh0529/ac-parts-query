<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>汽車與農機空調零件通用資料庫 (報價無配套、僅顯示前價)</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-slate-100 min-h-screen p-3 md:p-8 text-slate-800[cite: 10]">

    <!-- 全域歷史選單 DataLists -->
    <datalist id="part-name-list"></datalist>
    <datalist id="part-brand-list"></datalist>
    <datalist id="supplier-list"></datalist>
    <datalist id="vehicle-type-list"></datalist>
    <datalist id="brand-list"></datalist>
    <datalist id="model-list"></datalist>

    <div class="max-w-5xl mx-auto bg-white rounded-xl shadow-md overflow-hidden p-4 md:p-6[cite: 10]">
        <!-- 頂部標題與連線狀態 -->
        <h1 class="text-xl md:text-2xl font-bold text-slate-800 mb-4 border-b pb-3 flex items-center justify-between[cite: 10]">
            <span class="flex items-center gap-2">❄️ 汽車/農機空調零件與配套組合管理系統[cite: 10]</span>
            <span class="text-xs font-normal text-emerald-600 bg-emerald-50 px-2.5 py-1 rounded-full border border-emerald-200 flex items-center gap-1[cite: 10]">
                <span class="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></span> 雲端同步中[cite: 10]
            </span>
        </h1>

        <!-- 功能頁籤切換按鈕 -->
        <div class="flex gap-4 border-b mb-6[cite: 10]">
            <button id="tab-search-btn" onclick="switchTab('search')" class="pb-2 border-b-2 border-blue-600 font-semibold text-blue-600 transition[cite: 10]">
                🔍 零件與配套組合查詢[cite: 10]
            </button>
            <button id="tab-add-btn" onclick="switchTab('add')" class="pb-2 font-semibold text-slate-500 hover:text-slate-800 transition[cite: 10]">
                ➕ 建立新零件與配套關聯[cite: 10]
            </button>
        </div>

        <!-- ================= 1. 查詢分頁 ================= -->
        <div id="tab-search" class="block[cite: 10]">

            <!-- 複合搜尋條件 (雙向連動綁定) -->
            <div class="grid grid-cols-1 md:grid-cols-6 gap-3 mb-4 bg-slate-50 p-4 rounded-xl border border-slate-200[cite: 10]">
                <div>
                    <label class="block text-xs font-semibold text-slate-600 mb-1">🚜 車種類別[cite: 10]</label>
                    <input type="text" id="search-vehicle-type" list="vehicle-type-list" placeholder="手動輸入或選擇..." oninput="triggerTwoWaySync()" class="w-full border rounded-lg p-2 text-sm focus:ring-2 focus:ring-blue-500 outline-none[cite: 10]">
                </div>

                <div>
                    <label class="block text-xs font-semibold text-slate-600 mb-1">車廠 / 品牌[cite: 10]</label>
                    <input type="text" id="search-brand" list="brand-list" placeholder="選擇或輸入品牌..." oninput="handleBrandChange(); triggerTwoWaySync();" class="w-full border rounded-lg p-2 text-sm focus:ring-2 focus:ring-blue-500 outline-none[cite: 10]">
                </div>

                <div>
                    <label class="block text-xs font-semibold text-slate-600 mb-1">底盤號 / 車型[cite: 10]</label>
                    <input type="text" id="search-model" list="model-list" placeholder="例: W246 / E36" oninput="triggerTwoWaySync()" class="w-full border rounded-lg p-2 text-sm focus:ring-2 focus:ring-blue-500 outline-none[cite: 10]">
                </div>

                <div>
                    <label class="block text-xs font-semibold text-slate-600 mb-1">年份 (出廠/適用)[cite: 10]</label>
                    <input type="number" id="search-year" placeholder="例: 2015" oninput="triggerTwoWaySync()" class="w-full border rounded-lg p-2 text-sm focus:ring-2 focus:ring-blue-500 outline-none[cite: 10]">
                </div>

                <!-- 零件名稱點擊複選區域 (雙向連動 Chips) -->
                <div class="md:col-span-2[cite: 10]">
                    <div class="flex justify-between items-center mb-1[cite: 10]">
                        <label class="block text-xs font-semibold text-slate-600">📦 零件名稱 (點擊複選篩選)[cite: 10]</label>
                        <button type="button" onclick="clearSelectedParts()" class="text-[11px] text-blue-600 hover:underline[cite: 10]">清除選取</button>
                    </div>
                    <div id="part-chips-container" class="flex flex-wrap gap-1.5 p-2 bg-white border border-slate-200 rounded-lg min-h-[4.5rem] max-h-24 overflow-y-auto[cite: 10]">
                        <span class="text-xs text-slate-400">載入歷史零件中...[cite: 10]</span>
                    </div>
                </div>

                <!-- 料號與關聯對照關鍵字 -->
                <div class="md:col-span-6 border-t pt-2 mt-1[cite: 10]">
                    <label class="block text-xs font-semibold text-slate-600 mb-1">🔍 本廠 / OEM / 交叉料號 / 配套零件關鍵字搜尋[cite: 10]</label>
                    <input type="text" id="search-keyword" placeholder="輸入料號例: DCP05001 / 膨脹閥 / O環 (按 Enter 可直接查詢)" onkeydown="if(event.key==='Enter') searchParts()" class="w-full border rounded-lg p-2 text-sm focus:ring-2 focus:ring-blue-500 outline-none[cite: 10]">
                </div>
            </div>

            <!-- 操作按鈕區 -->
            <div class="flex flex-col md:flex-row gap-3 mb-4[cite: 10]">
                <button onclick="searchParts()" class="flex-1 bg-blue-600 hover:bg-blue-700 active:bg-blue-800 text-white font-medium py-2.5 rounded-lg shadow transition flex items-center justify-center gap-1[cite: 10]">
                    🔍 執行綜合查詢[cite: 10]
                </button>
                <button onclick="copyQuote()" class="bg-emerald-600 hover:bg-emerald-700 active:bg-emerald-800 text-white font-medium px-5 py-2.5 rounded-lg shadow transition flex items-center justify-center gap-1 whitespace-nowrap[cite: 10]">
                    📋 複製報價與前價清單[cite: 10]
                </button>
                <button onclick="clearSearchInputs()" class="bg-slate-200 hover:bg-slate-300 active:bg-slate-400 text-slate-700 font-medium px-5 py-2.5 rounded-lg shadow-sm transition[cite: 10]">
                    🧹 清除條件[cite: 10]
                </button>
            </div>

            <!-- 🚀 批次管理工具列 -->
            <div class="flex items-center justify-between bg-slate-100 p-2.5 rounded-xl border border-slate-200 mb-4[cite: 10]">
                <div class="flex items-center gap-2[cite: 10]">
                    <input type="checkbox" id="select-all-checkbox" onclick="toggleSelectAll(this)" class="w-4 h-4 rounded text-blue-600 cursor-pointer[cite: 10]">
                    <label for="select-all-checkbox" class="text-xs font-bold text-slate-700 cursor-pointer[cite: 10]">全選目前頁面項目[cite: 10]</label>
                </div>
                <button onclick="batchDeleteParts()" class="bg-red-50 hover:bg-red-100 text-red-600 border border-red-200 text-xs font-bold px-3 py-1.5 rounded-lg transition flex items-center gap-1[cite: 10]">
                    🗑️ 批次刪除選取項目[cite: 10]
                </button>
            </div>

            <!-- 結果顯示專區 -->
            <div id="results" class="space-y-4[cite: 10]">
                <p class="text-slate-400 text-sm text-center py-6">請選擇查詢條件。[cite: 10]</p>
            </div>
        </div>

        <!-- ================= 2. 新增零件與配套組合分頁 ================= -->
        <div id="tab-add" class="hidden[cite: 10]">
            <form id="add-part-form" onsubmit="handleAddPart(event)" class="space-y-4 max-w-3xl mx-auto[cite: 10]">
                <div class="bg-slate-50 p-4 rounded-xl border border-slate-200 space-y-4[cite: 10]">
                    <h2 class="font-bold text-sm text-slate-700 border-b pb-2 flex items-center gap-1[cite: 10]">
                        📦 基本零件主檔與品牌[cite: 10]
                    </h2>
                    
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-3[cite: 10]">
                        <div>
                            <label class="block text-xs font-semibold text-slate-600 mb-1">零件名稱 *[cite: 10]</label>
                            <input type="text" id="add-part-name" list="part-name-list" required placeholder="可自由輸入 (例: 風箱 / 壓縮機)" class="w-full border rounded-lg p-2 text-sm[cite: 10]">
                        </div>
                        <div>
                            <label class="block text-xs font-semibold text-slate-600 mb-1">零件品牌/製造商 *[cite: 10]</label>
                            <input type="text" id="add-brand-name" list="part-brand-list" required placeholder="可自由輸入 (例: 正廠 / Denso)" class="w-full border rounded-lg p-2 text-sm[cite: 10]">
                        </div>
                    </div>

                    <div class="grid grid-cols-1 md:grid-cols-2 gap-3[cite: 10]">
                        <div>
                            <label class="block text-xs font-semibold text-slate-600 mb-1">本廠/主要零件料號 *[cite: 10]</label>
                            <input type="text" id="add-part-number" required placeholder="例如: DCP05001" class="w-full border rounded-lg p-2 text-sm font-mono font-bold text-blue-900[cite: 10]">
                        </div>
                        <div>
                            <label class="block text-xs font-semibold text-slate-600 mb-1">原廠 OEM 料號 (選填)[cite: 10]</label>
                            <input type="text" id="add-oem-number" placeholder="例如: 64528385915" class="w-full border rounded-lg p-2 text-sm font-mono[cite: 10]">
                        </div>
                    </div>

                    <!-- 長寬高尺寸欄位 -->
                    <div class="bg-white p-3 rounded-lg border border-slate-200[cite: 10]">
                        <label class="block text-xs font-bold text-slate-700 mb-2">📏 尺寸規格 (選填)[cite: 10]</label>
                        <div class="grid grid-cols-1 md:grid-cols-3 gap-3[cite: 10]">
                            <div>
                                <label class="block text-[11px] font-semibold text-slate-500 mb-1">長度[cite: 10]</label>
                                <input type="text" id="add-length" placeholder="例: 250mm" class="w-full border rounded-lg p-2 text-sm[cite: 10]">
                            </div>
                            <div>
                                <label class="block text-[11px] font-semibold text-slate-500 mb-1">寬度[cite: 10]</label>
                                <input type="text" id="add-width" placeholder="例: 150mm" class="w-full border rounded-lg p-2 text-sm[cite: 10]">
                            </div>
                            <div>
                                <label class="block text-[11px] font-semibold text-slate-500 mb-1">高度[cite: 10]</label>
                                <input type="text" id="add-height" placeholder="例: 80mm" class="w-full border rounded-lg p-2 text-sm[cite: 10]">
                            </div>
                        </div>
                    </div>

                    <div class="bg-indigo-50/70 p-3 rounded-lg border border-indigo-200[cite: 10]">
                        <label class="block text-xs font-bold text-indigo-900 mb-1[cite: 10]">
                            🔗 相容 / 替代 / 交叉對照料號 (Cross-Reference)[cite: 10]
                        </label>
                        <textarea id="add-cross-ref" rows="2" placeholder="例: 447220-8020, 64526908660" class="w-full border rounded-lg p-2 text-sm font-mono[cite: 10]"></textarea>
                    </div>

                    <div class="bg-amber-50/80 p-3 rounded-lg border border-amber-200[cite: 10]">
                        <label class="block text-xs font-bold text-amber-900 mb-1[cite: 10]">
                            🔧 建議搭配配套零組件 (Kit / Companion Parts)[cite: 10]
                            <span class="font-normal text-[11px] text-amber-700 block">提示：將各配套料號用中括號包覆（例如：膨脹閥 [V-101]、O環組 [OR-002]），系統將自動生成獨立點擊按鈕！[cite: 10]</span>
                        </label>
                        <textarea id="add-kit-parts" rows="2" placeholder="格式範例: 膨脹閥 [V-101], O環組 [OR-002], 固定螺絲 [SCR-8]" class="w-full border border-amber-300 rounded-lg p-2 text-sm font-mono bg-white[cite: 10]"></textarea>
                    </div>

                    <div class="grid grid-cols-1 md:grid-cols-2 gap-3[cite: 10]">
                        <div>
                            <label class="block text-xs font-semibold text-slate-600 mb-1">進貨廠商/盤商 (選填)[cite: 10]</label>
                            <input type="text" id="add-supplier-name" list="supplier-list" placeholder="例如: 台灣電綜 / 永晟" class="w-full border rounded-lg p-2 text-sm[cite: 10]">
                        </div>
                        <div>
                            <label class="block text-xs font-semibold text-slate-600 mb-1">備註/規格說明[cite: 10]</label>
                            <input type="text" id="add-remarks" placeholder="例如: R134a, 帶線圈, 24V" class="w-full border rounded-lg p-2 text-sm[cite: 10]">
                        </div>
                    </div>

                    <div class="bg-white p-3 rounded-lg border border-slate-200[cite: 10]">
                        <label class="block text-xs font-bold text-slate-700 mb-2">💵 價格與成本紀錄[cite: 10]</label>
                        <div class="grid grid-cols-1 md:grid-cols-3 gap-3[cite: 10]">
                            <div>
                                <label class="block text-[11px] font-semibold text-slate-500 mb-1">進貨成本 (NT$)[cite: 10]</label>
                                <input type="number" id="add-cost" placeholder="4500" class="w-full border rounded-lg p-2 text-sm[cite: 10]">
                            </div>
                            <div>
                                <label class="block text-[11px] font-semibold text-slate-500 mb-1">參考前價 (NT$)[cite: 10]</label>
                                <input type="number" id="add-price" placeholder="6800" class="w-full border rounded-lg p-2 text-sm[cite: 10]">
                            </div>
                            <div>
                                <label class="block text-[11px] font-semibold text-slate-500 mb-1">前價日期[cite: 10]</label>
                                <input type="date" id="add-price-date" class="w-full border rounded-lg p-2 text-sm[cite: 10]">
                            </div>
                        </div>
                    </div>

                    <div>
                        <label class="block text-xs font-semibold text-slate-600 mb-1">零件照片 (最多 3 張)[cite: 10]</label>
                        <input type="file" id="add-images" accept="image/*" multiple onchange="previewImages(event, 'add-preview-container')" class="w-full text-xs text-slate-500 file:mr-3 file:py-2 file:px-4 file:rounded-lg file:border-0 file:text-xs file:font-semibold file:bg-blue-50 file:text-blue-700 hover:file:bg-blue-100 cursor-pointer[cite: 10]">
                        <div id="add-preview-container" class="flex gap-2 mt-3 overflow-x-auto[cite: 10]"></div>
                    </div>
                </div>

                <div class="bg-slate-50 p-4 rounded-xl border border-slate-200 space-y-4[cite: 10]">
                    <div class="flex justify-between items-center border-b pb-2[cite: 10]">
                        <h2 class="font-bold text-sm text-slate-700">🚘 適用車型與車種類別[cite: 10]</h2>
                        <button type="button" onclick="addVehicleRow('add-vehicles-container', 'add')" class="text-xs bg-blue-50 hover:bg-blue-100 text-blue-700 font-semibold px-3 py-1.5 rounded-lg border border-blue-200 transition[cite: 10]">
                            ➕ 新增一台車型[cite: 10]
                        </button>
                    </div>
                    <div id="add-vehicles-container" class="space-y-3[cite: 10]"></div>
                </div>

                <button type="submit" id="submit-btn" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-bold py-3 rounded-xl shadow transition[cite: 10]">
                    💾 儲存零件與配套組合[cite: 10]
                </button>
            </form>
        </div>

    </div>

    <!-- 編輯零件 Modal -->
    <div id="edit-modal" class="fixed inset-0 bg-slate-900/50 backdrop-blur-sm hidden items-center justify-center p-4 z-50[cite: 10]">
        <div class="bg-white rounded-xl shadow-xl max-w-2xl w-full p-6 space-y-4 max-h-[90vh] overflow-y-auto[cite: 10]">
            <div class="flex justify-between items-center border-b pb-3[cite: 10]">
                <h3 class="text-base font-bold text-slate-800">✏️ 編輯零件與配套組合[cite: 10]</h3>
                <button onclick="closeEditModal()" class="text-slate-400 hover:text-slate-600 text-xl font-bold px-2[cite: 10]">&times;</button>
            </div>
            
            <form id="edit-part-form" onsubmit="handleSaveEdit(event)" class="space-y-4[cite: 10]">
                <input type="hidden" id="edit-id">
                <div class="space-y-3[cite: 10]">
                    <div class="grid grid-cols-2 gap-2[cite: 10]">
                        <div>
                            <label class="block text-xs font-semibold text-slate-600 mb-1">零件名稱 *[cite: 10]</label>
                            <input type="text" id="edit-part-name" list="part-name-list" required class="w-full border rounded-lg p-2 text-sm[cite: 10]">
                        </div>
                        <div>
                            <label class="block text-xs font-semibold text-slate-600 mb-1">品牌 *[cite: 10]</label>
                            <input type="text" id="edit-brand-name" list="part-brand-list" required class="w-full border rounded-lg p-2 text-sm[cite: 10]">
                        </div>
                    </div>

                    <div class="grid grid-cols-2 gap-2[cite: 10]">
                        <div>
                            <label class="block text-xs font-semibold text-slate-600 mb-1">本廠料號 *[cite: 10]</label>
                            <input type="text" id="edit-part-number" required class="w-full border rounded-lg p-2 text-sm font-mono font-bold[cite: 10]">
                        </div>
                        <div>
                            <label class="block text-xs font-semibold text-slate-600 mb-1">原廠 OEM 料號[cite: 10]</label>
                            <input type="text" id="edit-oem-number" class="w-full border rounded-lg p-2 text-sm font-mono[cite: 10]">
                        </div>
                    </div>

                    <!-- 編輯區長寬高尺寸 -->
                    <div class="bg-slate-50 p-2.5 rounded-lg border border-slate-200[cite: 10]">
                        <label class="block text-xs font-bold text-slate-700 mb-1">📏 尺寸規格[cite: 10]</label>
                        <div class="grid grid-cols-3 gap-2[cite: 10]">
                            <div>
                                <label class="block text-[10px] font-semibold text-slate-500 mb-1">長度[cite: 10]</label>
                                <input type="text" id="edit-length" class="w-full border rounded-lg p-1.5 text-sm[cite: 10]">
                            </div>
                            <div>
                                <label class="block text-[10px] font-semibold text-slate-500 mb-1">寬度[cite: 10]</label>
                                <input type="text" id="edit-width" class="w-full border rounded-lg p-1.5 text-sm[cite: 10]">
                            </div>
                            <div>
                                <label class="block text-[10px] font-semibold text-slate-500 mb-1">高度[cite: 10]</label>
                                <input type="text" id="edit-height" class="w-full border rounded-lg p-1.5 text-sm[cite: 10]">
                            </div>
                        </div>
                    </div>

                    <div class="bg-indigo-50/70 p-2.5 rounded-lg border border-indigo-200[cite: 10]">
                        <label class="block text-xs font-bold text-indigo-900 mb-1">🔗 交叉料號 (Cross Reference)[cite: 10]</label>
                        <textarea id="edit-cross-ref" rows="2" class="w-full border rounded-lg p-2 text-sm font-mono[cite: 10]"></textarea>
                    </div>

                    <div class="bg-amber-50/80 p-2.5 rounded-lg border border-amber-200[cite: 10]">
                        <label class="block text-xs font-bold text-amber-900 mb-1">🔧 建議搭配配套零組件 (Kit / Companion Parts)[cite: 10]</label>
                        <textarea id="edit-kit-parts" rows="2" class="w-full border border-amber-300 rounded-lg p-2 text-sm font-mono bg-white[cite: 10]" placeholder="例: 膨脹閥 [V-101], O環 [OR-002]"></textarea>
                    </div>

                    <div class="grid grid-cols-2 gap-2[cite: 10]">
                        <div>
                            <label class="block text-xs font-semibold text-slate-600 mb-1">進貨廠商[cite: 10]</label>
                            <input type="text" id="edit-supplier-name" list="supplier-list" class="w-full border rounded-lg p-2 text-sm[cite: 10]">
                        </div>
                        <div>
                            <label class="block text-xs font-semibold text-slate-600 mb-1">備註說明[cite: 10]</label>
                            <input type="text" id="edit-remarks" class="w-full border rounded-lg p-2 text-sm[cite: 10]">
                        </div>
                    </div>

                    <div class="bg-slate-50 p-2.5 rounded-lg border border-slate-200 space-y-2[cite: 10]">
                        <label class="block text-xs font-bold text-slate-700">💵 價格與成本[cite: 10]</label>
                        <div class="grid grid-cols-3 gap-2[cite: 10]">
                            <div>
                                <label class="block text-[10px] font-semibold text-slate-500 mb-1">進貨成本[cite: 10]</label>
                                <input type="number" id="edit-cost" class="w-full border rounded-lg p-1.5 text-sm[cite: 10]">
                            </div>
                            <div>
                                <label class="block text-[10px] font-semibold text-slate-500 mb-1">參考前價[cite: 10]</label>
                                <input type="number" id="edit-price" class="w-full border rounded-lg p-1.5 text-sm[cite: 10]">
                            </div>
                            <div>
                                <label class="block text-[10px] font-semibold text-slate-500 mb-1">前價日期[cite: 10]</label>
                                <input type="date" id="edit-price-date" class="w-full border rounded-lg p-1.5 text-sm[cite: 10]">
                            </div>
                        </div>
                    </div>

                    <!-- 編輯區照片更新與刪除 -->
                    <div>
                        <label class="block text-xs font-semibold text-slate-600 mb-1">零件照片管理 (可點擊圖片放大檢視、點右上角 × 刪除現有照片，或下方補上新照片最多 3 張)[cite: 10]</label>
                        <div id="edit-preview-container" class="flex gap-2 mt-2 mb-3 overflow-x-auto[cite: 10]"></div>
                        <input type="file" id="edit-images" accept="image/*" multiple onchange="handleNewImageSelection(event)" class="w-full text-xs text-slate-500 file:mr-3 file:py-2 file:px-4 file:rounded-lg file:border-0 file:text-xs file:font-semibold file:bg-blue-50 file:text-blue-700 hover:file:bg-blue-100 cursor-pointer[cite: 10]">
                    </div>
                </div>

                <div class="space-y-3 border-t pt-3[cite: 10]">

        async function getOrCreateVehicleIds(containerId, prefix) {
            const rows = document.getElementById(containerId).querySelectorAll('.vehicle-row');[cite: 10]
            const vehicleIds = [];[cite: 10]
            for (const row of rows) {
                const vehicleType = row.querySelector(`.${prefix}-v-type`).value.trim();[cite: 10]
                const brand = row.querySelector(`.${prefix}-v-brand`).value.trim();[cite: 10]
                const model = row.querySelector(`.${prefix}-v-model`).value.trim();[cite: 10]
                const startYear = parseInt(row.querySelector(`.${prefix}-v-start`).value);[cite: 10]
                const startMonth = parseInt(row.querySelector(`.${prefix}-v-start-m`).value) || null;[cite: 10]
                const endYear = parseInt(row.querySelector(`.${prefix}-v-end`).value);[cite: 10]
                const endMonth = parseInt(row.querySelector(`.${prefix}-v-end-m`).value) || null;[cite: 10]

                if (!brand || !model || isNaN(startYear) || isNaN(endYear)) continue;[cite: 10]

                let q = _supabase.from('vehicles').select('id').eq('brand', brand).eq('model', model).eq('start_year', startYear).eq('end_year', endYear);[cite: 10]
                if (vehicleType) q = q.eq('vehicle_type', vehicleType);[cite: 10]
                const { data: existing } = await q.maybeSingle();[cite: 10]

                if (existing) {

            }

                            </div>

                            <div class="bg-amber-50/70 p-2.5 rounded-lg border border-amber-200">
                                <span class="text-amber-900 font-bold block mb-1">🔧 建議搭配配套零組件 (點擊各料號按鈕一鍵查詢)：</span>
                                ${renderKitPartsWithLinks(item.kit_parts)}
                            </div>
                        </div>

                        <!-- 零件圖片清單：點擊可另開視窗放大 -->
                        ${images.length ? `<div class="flex gap-2 pl-7">${images.map(img => `<img src="${img}" class="w-16 h-16 object-cover rounded border cursor-pointer hover:opacity-80 transition shadow-sm" onclick="window.open('${img}', '_blank')" title="點擊另開新視窗放大檢視">`).join('')}</div>` : ''}

                        <div class="border-t pt-2 pl-7">
                            <span class="text-[11px] font-bold text-slate-400 block mb-1">🚘 相容底盤與車種 (點擊標籤一鍵跳轉篩選)：</span>
                            <div class="flex flex-wrap gap-1">
                                ${vehicles.map(v => `
                                    <span onclick="jumpToVehicleFilter('${v.brand}', '${v.model}', '${v.vehicle_type || ''}')" 
                                          class="text-xs bg-slate-100 hover:bg-blue-50 hover:text-blue-700 hover:border-blue-300 text-slate-700 px-2 py-0.5 rounded border cursor-pointer transition flex items-center gap-1">
                                        <b class="text-blue-800">[${v.vehicle_type || '車種'}]</b> ${v.brand} ${v.model} (${v.start_year}-${v.end_year}) ↗
                                    </span>
                                `).join('')}
                            </div>
                        </div>
                    </div>`;
            }).join('');

            resultsContainer.innerHTML = cards;
        }

        function openEditModalById(id) {
            const item = currentResultsCache.find(p => p.id === id);[cite: 10]
            if (!item) return;[cite: 10]
            document.getElementById('edit-id').value = item.id;[cite: 10]
            document.getElementById('edit-part-name').value = item.part_name || '';[cite: 10]
            document.getElementById('edit-brand-name').value = item.brand_name || '';[cite: 10]
            document.getElementById('edit-part-number').value = item.part_number || '';[cite: 10]
            document.getElementById('edit-oem-number').value = item.oem_number || '';[cite: 10]
            document.getElementById('edit-length').value = item.length || '';[cite: 10]
            document.getElementById('edit-width').value = item.width || '';[cite: 10]
            document.getElementById('edit-height').value = item.height || '';[cite: 10]
            document.getElementById('edit-cross-ref').value = item.cross_reference || '';[cite: 10]
            document.getElementById('edit-kit-parts').value = item.kit_parts || '';[cite: 10]
            document.getElementById('edit-supplier-name').value = item.supplier_name || '';[cite: 10]
            document.getElementById('edit-cost').value = item.cost || '';[cite: 10]
            document.getElementById('edit-price').value = item.price || '';[cite: 10]
            document.getElementById('edit-price-date').value = item.price_date || '';[cite: 10]
            document.getElementById('edit-remarks').value = item.remarks || '';[cite: 10]

            // 初始載入現有圖片到可刪除清單
            currentEditImages = [item.image_1, item.image_2, item.image_3].filter(Boolean);
            renderEditImagesPreview();
            document.getElementById('edit-images').value = '';[cite: 10]

            const editVehicles = document.getElementById('edit-vehicles-container');[cite: 10]
            editVehicles.innerHTML = '';[cite: 10]
            const vehicles = item.part_vehicles ? item.part_vehicles.map(pv => pv.vehicles).filter(Boolean) : [];[cite: 10]
            if (vehicles.length) vehicles.forEach(v => addVehicleRow('edit-vehicles-container', 'edit', v));[cite: 10]
            else addVehicleRow('edit-vehicles-container', 'edit');[cite: 10]

            document.getElementById('edit-modal').classList.remove('hidden');[cite: 10]
            document.getElementById('edit-modal').classList.add('flex');[cite: 10]
        }

        function renderEditImagesPreview() {
            const container = document.getElementById('edit-preview-container');
            if (currentEditImages.length === 0) {
                container.innerHTML = `<span class="text-xs text-slate-400">目前無照片</span>`;
                return;
            }
            container.innerHTML = currentEditImages.map((url, idx) => `
                <div class="relative group inline-block">
                    <img src="${url}" class="w-16 h-16 object-cover rounded border cursor-pointer hover:opacity-80 transition" onclick="window.open('${url}', '_blank')" title="點擊另開新視窗放大檢視">
                    <button type="button" onclick="removeEditImage(${idx})" class="absolute -top-1.5 -right-1.5 bg-red-500 hover:bg-red-600 text-white rounded-full w-5 h-5 text-xs flex items-center justify-center font-bold shadow transition" title="刪除此張圖片">&times;</button>
                </div>
            `).join('');
        }

        function removeEditImage(idx) {
            currentEditImages.splice(idx, 1);
            renderEditImagesPreview();
        }

        function handleNewImageSelection(event) {
            const files = Array.from(event.target.files);
            files.forEach(file => {
                if (currentEditImages.length >= 3) return;
                const reader = new FileReader();
                reader.onload = (e) => {
                    // 暫存預覽用，實際上傳會透過 uploadImages 處理
                    // 這裡可以透過額外陣列收集新檔案
                };
                reader.readAsDataURL(file);
            });
        }

        function closeEditModal() {
            document.getElementById('edit-modal').classList.remove('flex');[cite: 10]
            document.getElementById('edit-modal').classList.add('hidden');[cite: 10]
        }

        async function handleSaveEdit(e) {
            e.preventDefault();[cite: 10]
            const id = document.getElementById('edit-id').value;[cite: 10]
            const updatePayload = {
                part_name: document.getElementById('edit-part-name').value.trim(),[cite: 10]
                brand_name: document.getElementById('edit-brand-name').value.trim(),[cite: 10]
                part_number: document.getElementById('edit-part-number').value.trim(),[cite: 10]
                oem_number: document.getElementById('edit-oem-number').value.trim() || null,[cite: 10]
                length: document.getElementById('edit-length').value.trim() || null,[cite: 10]
                width: document.getElementById('edit-width').value.trim() || null,[cite: 10]
                height: document.getElementById('edit-height').value.trim() || null,[cite: 10]
                cross_reference: document.getElementById('edit-cross-ref').value.trim() || null,[cite: 10]
                kit_parts: document.getElementById('edit-kit-parts').value.trim() || null,[cite: 10]
                supplier_name: document.getElementById('edit-supplier-name').value.trim() || null,[cite: 10]
                cost: parseFloat(document.getElementById('edit-cost').value) || null,[cite: 10]
                price: parseFloat(document.getElementById('edit-price').value) || null,[cite: 10]
                price_date: document.getElementById('edit-price-date').value || null,[cite: 10]
                remarks: document.getElementById('edit-remarks').value.trim() || null,[cite: 10]
                image_1: currentEditImages[0] || null,
                image_2: currentEditImages[1] || null,
                image_3: currentEditImages[2] || null
            };

            const fileInput = document.getElementById('edit-images');[cite: 10]
            if (fileInput && fileInput.files.length > 0) {
                const [img1, img2, img3] = await uploadImages('edit-images');[cite: 10]
                const newUploaded = [img1, img2, img3].filter(Boolean);
                for (const newImg of newUploaded) {
                    if (currentEditImages.length < 3) {
                        currentEditImages.push(newImg);
                    }
                }
                updatePayload.image_1 = currentEditImages[0] || null;
                updatePayload.image_2 = currentEditImages[1] || null;
                updatePayload.image_3 = currentEditImages[2] || null;
            }

            await _supabase.from('parts').update(updatePayload).eq('id', id);[cite: 10]
            const vehicleIds = await getOrCreateVehicleIds('edit-vehicles-container', 'edit');[cite: 10]
            await _supabase.from('part_vehicles').delete().eq('part_id', id);[cite: 10]
            if (vehicleIds.length) {
                await _supabase.from('part_vehicles').insert(vehicleIds.map(vId => ({ part_id: id, vehicle_id: vId })));[cite: 10]
            }

            alert('✅ 更新成功！');[cite: 10]
            closeEditModal();[cite: 10]
            initHistoryDatalists();[cite: 10]
            searchParts();[cite: 10]
        }

        async function handleAddPart(e) {
            e.preventDefault();[cite: 10]
            const partPayload = {
                part_name: document.getElementById('add-part-name').value.trim(),[cite: 10]
                brand_name: document.getElementById('add-brand-name').value.trim(),[cite: 10]
                part_number: document.getElementById('add-part-number').value.trim(),[cite: 10]
                oem_number: document.getElementById('add-oem-number').value.trim() || null,[cite: 10]
                length: document.getElementById('add-length').value.trim() || null,[cite: 10]
                width: document.getElementById('add-width').value.trim() || null,[cite: 10]
                height: document.getElementById('add-height').value.trim() || null,[cite: 10]
                cross_reference: document.getElementById('add-cross-ref').value.trim() || null,[cite: 10]
                kit_parts: document.getElementById('add-kit-parts').value.trim() || null,[cite: 10]
                supplier_name: document.getElementById('add-supplier-name').value.trim() || null,[cite: 10]
                cost: parseFloat(document.getElementById('add-cost').value) || null,[cite: 10]
                price: parseFloat(document.getElementById('add-price').value) || null,[cite: 10]
                price_date: document.getElementById('add-price-date').value || null,[cite: 10]
                remarks: document.getElementById('add-remarks').value.trim() || null[cite: 10]
            };

            const [img1, img2, img3] = await uploadImages('add-images');[cite: 10]
            partPayload.image_1 = img1; partPayload.image_2 = img2; partPayload.image_3 = img3;[cite: 10]

            const { data: partData, error } = await _supabase.from('parts').insert([partPayload]).select();[cite: 10]
            if (error) { alert('❌ ' + error.message); return; }[cite: 10]

            const newPartId = partData[0].id;[cite: 10]
            const vehicleIds = await getOrCreateVehicleIds('add-vehicles-container', 'add');[cite: 10]
            if (vehicleIds.length) {
                await _supabase.from('part_vehicles').insert(vehicleIds.map(vId => ({ part_id: newPartId, vehicle_id: vId })));[cite: 10]
            }

            alert('✅ 新增成功！');[cite: 10]
            document.getElementById('add-part-form').reset();[cite: 10]
            document.getElementById('add-preview-container').innerHTML = '';[cite: 10]
            initHistoryDatalists();[cite: 10]
            switchTab('search');[cite: 10]
            searchParts();[cite: 10]
        }
    </script>
</body>
