<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>空調零件通用資料庫 (報價無配套、僅顯示前價)</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-slate-100 min-h-screen p-3 md:p-8 text-slate-800">

    <!-- 全域歷史選單 DataLists -->
    <datalist id="part-name-list"></datalist>
    <datalist id="part-brand-list"></datalist>
    <datalist id="supplier-list"></datalist>
    <datalist id="vehicle-type-list"></datalist>
    <datalist id="brand-list"></datalist>
    <datalist id="model-list"></datalist>

    <div class="max-w-5xl mx-auto bg-white rounded-xl shadow-md overflow-hidden p-4 md:p-6">
        <!-- 頂部標題與連線狀態 -->
        <h1 class="text-xl md:text-2xl font-bold text-slate-800 mb-4 border-b pb-3 flex items-center justify-between">
            <span class="flex items-center gap-2">❄️ 汽車/農機空調零件與配套組合管理系統</span>
            <span class="text-xs font-normal text-emerald-600 bg-emerald-50 px-2.5 py-1 rounded-full border border-emerald-200 flex items-center gap-1">
                <span class="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></span> 雲端同步中
            </span>
        </h1>

        <!-- 功能頁籤切換按鈕 -->
        <div class="flex gap-4 border-b mb-6">
            <button id="tab-search-btn" onclick="switchTab('search')" class="pb-2 border-b-2 border-blue-600 font-semibold text-blue-600 transition">
                🔍 零件與配套組合查詢
            </button>
            <button id="tab-add-btn" onclick="switchTab('add')" class="pb-2 font-semibold text-slate-500 hover:text-slate-800 transition">
                ➕ 建立新零件與配套關聯
            </button>
        </div>

        <!-- ================= 1. 查詢分頁 ================= -->
        <div id="tab-search" class="block">

            <!-- 複合搜尋條件 (雙向連動綁定) -->
            <div class="grid grid-cols-1 md:grid-cols-6 gap-3 mb-4 bg-slate-50 p-4 rounded-xl border border-slate-200">
                <div>
                    <label class="block text-xs font-semibold text-slate-600 mb-1">🚜 車種類別</label>
                    <input type="text" id="search-vehicle-type" list="vehicle-type-list" placeholder="手動輸入或選擇..." oninput="triggerTwoWaySync()" class="w-full border rounded-lg p-2 text-sm focus:ring-2 focus:ring-blue-500 outline-none">
                </div>

                <div>
                    <label class="block text-xs font-semibold text-slate-600 mb-1">車廠 / 品牌</label>
                    <input type="text" id="search-brand" list="brand-list" placeholder="選擇或輸入品牌..." oninput="handleBrandChange(); triggerTwoWaySync();" class="w-full border rounded-lg p-2 text-sm focus:ring-2 focus:ring-blue-500 outline-none">
                </div>

                <div>
                    <label class="block text-xs font-semibold text-slate-600 mb-1">底盤號 / 車型</label>
                    <input type="text" id="search-model" list="model-list" placeholder="例: W246 / E36" oninput="triggerTwoWaySync()" class="w-full border rounded-lg p-2 text-sm focus:ring-2 focus:ring-blue-500 outline-none">
                </div>

                <div>
                    <label class="block text-xs font-semibold text-slate-600 mb-1">年份 (出廠/適用)</label>
                    <input type="number" id="search-year" placeholder="例: 2015" oninput="triggerTwoWaySync()" class="w-full border rounded-lg p-2 text-sm focus:ring-2 focus:ring-blue-500 outline-none">
                </div>

                <!-- 零件名稱點擊複選區域 (雙向連動 Chips) -->
                <div class="md:col-span-2">
                    <div class="flex justify-between items-center mb-1">
                        <label class="block text-xs font-semibold text-slate-600">📦 零件名稱 (點擊複選篩選)</label>
                        <button type="button" onclick="clearSelectedParts()" class="text-[11px] text-blue-600 hover:underline">清除選取</button>
                    </div>
                    <div id="part-chips-container" class="flex flex-wrap gap-1.5 p-2 bg-white border border-slate-200 rounded-lg min-h-[4.5rem] max-h-24 overflow-y-auto">
                        <span class="text-xs text-slate-400">載入歷史零件中...</span>
                    </div>
                </div>

                <!-- 料號與關聯對照關鍵字 -->
                <div class="md:col-span-6 border-t pt-2 mt-1">
                    <label class="block text-xs font-semibold text-slate-600 mb-1">🔍 本廠 / OEM / 交叉料號 / 配套零件關鍵字搜尋</label>
                    <input type="text" id="search-keyword" placeholder="輸入料號例: DCP05001 / 膨脹閥 / O環 (按 Enter 可直接查詢)" onkeydown="if(event.key==='Enter') searchParts()" class="w-full border rounded-lg p-2 text-sm focus:ring-2 focus:ring-blue-500 outline-none">
                </div>
            </div>

            <!-- 操作按鈕區 -->
            <div class="flex flex-col md:flex-row gap-3 mb-4">
                <button onclick="searchParts()" class="flex-1 bg-blue-600 hover:bg-blue-700 active:bg-blue-800 text-white font-medium py-2.5 rounded-lg shadow transition flex items-center justify-center gap-1">
                    🔍 執行綜合查詢
                </button>
                <button onclick="copyQuote()" class="bg-emerald-600 hover:bg-emerald-700 active:bg-emerald-800 text-white font-medium px-5 py-2.5 rounded-lg shadow transition flex items-center justify-center gap-1 whitespace-nowrap">
                    📋 複製報價與前價清單 (指定格式)
                </button>
                <button onclick="clearSearchInputs()" class="bg-slate-200 hover:bg-slate-300 active:bg-slate-400 text-slate-700 font-medium px-5 py-2.5 rounded-lg shadow-sm transition">
                    🧹 清除條件
                </button>
            </div>

            <!-- 🚀 批次管理工具列 -->
            <div class="flex items-center justify-between bg-slate-100 p-2.5 rounded-xl border border-slate-200 mb-4">
                <div class="flex items-center gap-2">
                    <input type="checkbox" id="select-all-checkbox" onclick="toggleSelectAll(this)" class="w-4 h-4 rounded text-blue-600 cursor-pointer">
                    <label for="select-all-checkbox" class="text-xs font-bold text-slate-700 cursor-pointer">全選目前頁面項目</label>
                </div>
                <button onclick="batchDeleteParts()" class="bg-red-50 hover:bg-red-100 text-red-600 border border-red-200 text-xs font-bold px-3 py-1.5 rounded-lg transition flex items-center gap-1">
                    🗑️ 批次刪除選取項目
                </button>
            </div>

            <!-- 結果顯示專區 -->
            <div id="results" class="space-y-4">
                <p class="text-slate-400 text-sm text-center py-6">請選擇查詢條件進行查詢。</p>
            </div>
        </div>

        <!-- ================= 2. 新增零件與配套組合分頁 ================= -->
        <div id="tab-add" class="hidden">
            <form id="add-part-form" onsubmit="handleAddPart(event)" class="space-y-4 max-w-3xl mx-auto">
                <div class="bg-slate-50 p-4 rounded-xl border border-slate-200 space-y-4">
                    <h2 class="font-bold text-sm text-slate-700 border-b pb-2 flex items-center gap-1">
                        📦 基本零件主檔與品牌
                    </h2>
                    
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-3">
                        <div>
                            <label class="block text-xs font-semibold text-slate-600 mb-1">零件名稱 *</label>
                            <input type="text" id="add-part-name" list="part-name-list" required placeholder="可自由輸入 (例: 風箱 / 壓縮機)" class="w-full border rounded-lg p-2 text-sm">
                        </div>
                        <div>
                            <label class="block text-xs font-semibold text-slate-600 mb-1">零件品牌/製造商 *</label>
                            <input type="text" id="add-brand-name" list="part-brand-list" required placeholder="可自由輸入 (例: 正廠 / Denso)" class="w-full border rounded-lg p-2 text-sm">
                        </div>
                    </div>

                    <div class="grid grid-cols-1 md:grid-cols-2 gap-3">
                        <div>
                            <label class="block text-xs font-semibold text-slate-600 mb-1">本廠/主要零件料號 *</label>
                            <input type="text" id="add-part-number" required placeholder="例如: DCP05001" class="w-full border rounded-lg p-2 text-sm font-mono font-bold text-blue-900">
                        </div>
                        <div>
                            <label class="block text-xs font-semibold text-slate-600 mb-1">原廠 OEM 料號 (選填)</label>
                            <input type="text" id="add-oem-number" placeholder="例如: 64528385915" class="w-full border rounded-lg p-2 text-sm font-mono">
                        </div>
                    </div>

                    <!-- 長寬高尺寸欄位 -->
                    <div class="bg-white p-3 rounded-lg border border-slate-200">
                        <label class="block text-xs font-bold text-slate-700 mb-2">📏 尺寸規格 (選填)</label>
                        <div class="grid grid-cols-1 md:grid-cols-3 gap-3">
                            <div>
                                <label class="block text-[11px] font-semibold text-slate-500 mb-1">長度</label>
                                <input type="text" id="add-length" placeholder="例: 250mm" class="w-full border rounded-lg p-2 text-sm">
                            </div>
                            <div>
                                <label class="block text-[11px] font-semibold text-slate-500 mb-1">寬度</label>
                                <input type="text" id="add-width" placeholder="例: 150mm" class="w-full border rounded-lg p-2 text-sm">
                            </div>
                            <div>
                                <label class="block text-[11px] font-semibold text-slate-500 mb-1">高度</label>
                                <input type="text" id="add-height" placeholder="例: 80mm" class="w-full border rounded-lg p-2 text-sm">
                            </div>
                        </div>
                    </div>

                    <div class="bg-indigo-50/70 p-3 rounded-lg border border-indigo-200">
                        <label class="block text-xs font-bold text-indigo-900 mb-1">
                            🔗 相容 / 替代 / 交叉對照料號 (Cross-Reference)[cite: 14]
                            <span class="font-normal text-[11px] text-indigo-700 block">提示：輸入 A 零件時輸入 B、C 零件，系統將自動雙向無限連動[cite: 14]。</span>
                        </label>
                        <textarea id="add-cross-ref" rows="2" placeholder="例: 447220-8020, 64526908660" class="w-full border rounded-lg p-2 text-sm font-mono"></textarea>
                    </div>

                    <div class="bg-amber-50/80 p-3 rounded-lg border border-amber-200">
                        <label class="block text-xs font-bold text-amber-900 mb-1">
                            🔧 建議搭配配套零組件 (Kit / Companion Parts)
                            <span class="font-normal text-[11px] text-amber-700 block">提示：將各配套料號用中括號包覆（例如：膨脹閥 [V-101]、O環組 [OR-002]），系統將自動生成獨立點擊按鈕！</span>
                        </label>
                        <textarea id="add-kit-parts" rows="2" placeholder="格式範例: 膨脹閥 [V-101], O環組 [OR-002], 固定螺絲 [SCR-8]" class="w-full border border-amber-300 rounded-lg p-2 text-sm font-mono bg-white"></textarea>
                    </div>

                    <div class="grid grid-cols-1 md:grid-cols-2 gap-3">
                        <div>
                            <label class="block text-xs font-semibold text-slate-600 mb-1">進貨廠商/盤商 (選填)</label>
                            <input type="text" id="add-supplier-name" list="supplier-list" placeholder="例如: 台灣電綜 / 永晟" class="w-full border rounded-lg p-2 text-sm">
                        </div>
                        <div>
                            <label class="block text-xs font-semibold text-slate-600 mb-1">備註/規格說明</label>
                            <input type="text" id="add-remarks" placeholder="例如: R134a, 帶線圈, 24V" class="w-full border rounded-lg p-2 text-sm">
                        </div>
                    </div>

                    <div class="bg-white p-3 rounded-lg border border-slate-200">
                        <label class="block text-xs font-bold text-slate-700 mb-2">💵 價格與成本紀錄</label>
                        <div class="grid grid-cols-1 md:grid-cols-3 gap-3">
                            <div>
                                <label class="block text-[11px] font-semibold text-slate-500 mb-1">進貨成本 (NT$)</label>
                                <input type="number" id="add-cost" placeholder="4500" class="w-full border rounded-lg p-2 text-sm">
                            </div>
                            <div>
                                <label class="block text-[11px] font-semibold text-slate-500 mb-1">參考前價 (NT$)</label>
                                <input type="number" id="add-price" placeholder="6800" class="w-full border rounded-lg p-2 text-sm">
                            </div>
                            <div>
                                <label class="block text-[11px] font-semibold text-slate-500 mb-1">前價日期</label>
                                <input type="date" id="add-price-date" class="w-full border rounded-lg p-2 text-sm">
                            </div>
                        </div>
                    </div>

                    <div>
                        <label class="block text-xs font-semibold text-slate-600 mb-1">零件照片 (最多 3 張)</label>
                        <input type="file" id="add-images" accept="image/*" multiple onchange="previewImages(event, 'add-preview-container')" class="w-full text-xs text-slate-500 file:mr-3 file:py-2 file:px-4 file:rounded-lg file:border-0 file:text-xs file:font-semibold file:bg-blue-50 file:text-blue-700 hover:file:bg-blue-100 cursor-pointer">
                        <div id="add-preview-container" class="flex gap-2 mt-3 overflow-x-auto"></div>
                    </div>
                </div>

                <div class="bg-slate-50 p-4 rounded-xl border border-slate-200 space-y-4">
                    <div class="flex justify-between items-center border-b pb-2">
                        <h2 class="font-bold text-sm text-slate-700">🚘 適用車型與車種類別</h2>
                        <button type="button" onclick="addVehicleRow('add-vehicles-container', 'add')" class="text-xs bg-blue-50 hover:bg-blue-100 text-blue-700 font-semibold px-3 py-1.5 rounded-lg border border-blue-200 transition">
                            ➕ 新增一台車型
                        </button>
                    </div>
                    <div id="add-vehicles-container" class="space-y-3"></div>
                </div>

                <button type="submit" id="submit-btn" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-bold py-3 rounded-xl shadow transition">
                    💾 儲存零件與配套組合
                </button>
            </form>
        </div>

    </div>

    <!-- 編輯零件 Modal -->
    <div id="edit-modal" class="fixed inset-0 bg-slate-900/50 backdrop-blur-sm hidden items-center justify-center p-4 z-50">
        <div class="bg-white rounded-xl shadow-xl max-w-2xl w-full p-6 space-y-4 max-h-[90vh] overflow-y-auto">
            <div class="flex justify-between items-center border-b pb-3">
                <h3 class="text-base font-bold text-slate-800">✏️ 編輯零件與配套組合</h3>
                <button onclick="closeEditModal()" class="text-slate-400 hover:text-slate-600 text-xl font-bold px-2">&times;</button>
            </div>
            
            <form id="edit-part-form" onsubmit="handleSaveEdit(event)" class="space-y-4">
                <input type="hidden" id="edit-id">
                <div class="space-y-3">
                    <div class="grid grid-cols-2 gap-2">
                        <div>
                            <label class="block text-xs font-semibold text-slate-600 mb-1">零件名稱 *</label>
                            <input type="text" id="edit-part-name" list="part-name-list" required class="w-full border rounded-lg p-2 text-sm">
                        </div>
                        <div>
                            <label class="block text-xs font-semibold text-slate-600 mb-1">品牌 *</label>
                            <input type="text" id="edit-brand-name" list="part-brand-list" required class="w-full border rounded-lg p-2 text-sm">
                        </div>
                    </div>

                    <div class="grid grid-cols-2 gap-2">
                        <div>
                            <label class="block text-xs font-semibold text-slate-600 mb-1">本廠料號 *</label>
                            <input type="text" id="edit-part-number" required class="w-full border rounded-lg p-2 text-sm font-mono font-bold">
                        </div>
                        <div>
                            <label class="block text-xs font-semibold text-slate-600 mb-1">原廠 OEM 料號</label>
                            <input type="text" id="edit-oem-number" class="w-full border rounded-lg p-2 text-sm font-mono">
                        </div>
                    </div>

                    <!-- 編輯區長寬高尺寸 -->
                    <div class="bg-slate-50 p-2.5 rounded-lg border border-slate-200">
                        <label class="block text-xs font-bold text-slate-700 mb-1">📏 尺寸規格</label>
                        <div class="grid grid-cols-3 gap-2">
                            <div>
                                <label class="block text-[10px] font-semibold text-slate-500 mb-1">長度</label>
                                <input type="text" id="edit-length" class="w-full border rounded-lg p-1.5 text-sm">
                            </div>
                            <div>
                                <label class="block text-[10px] font-semibold text-slate-500 mb-1">寬度</label>
                                <input type="text" id="edit-width" class="w-full border rounded-lg p-1.5 text-sm">
                            </div>
                            <div>
                                <label class="block text-[10px] font-semibold text-slate-500 mb-1">高度</label>
                                <input type="text" id="edit-height" class="w-full border rounded-lg p-1.5 text-sm">
                            </div>
                        </div>
                    </div>

                    <div class="bg-indigo-50/70 p-2.5 rounded-lg border border-indigo-200">
                        <label class="block text-xs font-bold text-indigo-900 mb-1">🔗 交叉料號 (Cross Reference)[cite: 14]</label>
                        <textarea id="edit-cross-ref" rows="2" class="w-full border rounded-lg p-2 text-sm font-mono"></textarea>
                    </div>

                    <div class="bg-amber-50/80 p-2.5 rounded-lg border border-amber-200">
                        <label class="block text-xs font-bold text-amber-900 mb-1">🔧 建議搭配配套零組件 (Kit / Companion Parts)</label>
                        <textarea id="edit-kit-parts" rows="2" class="w-full border border-amber-300 rounded-lg p-2 text-sm font-mono bg-white" placeholder="例: 膨脹閥 [V-101], O環 [OR-002]"></textarea>
                    </div>

                    <div class="grid grid-cols-2 gap-2">
                        <div>
                            <label class="block text-xs font-semibold text-slate-600 mb-1">進貨廠商</label>
                            <input type="text" id="edit-supplier-name" list="supplier-list" class="w-full border rounded-lg p-2 text-sm">
                        </div>
                        <div>
                            <label class="block text-xs font-semibold text-slate-600 mb-1">備註說明</label>
                            <input type="text" id="edit-remarks" class="w-full border rounded-lg p-2 text-sm">
                        </div>
                    </div>

                    <div class="bg-slate-50 p-2.5 rounded-lg border border-slate-200 space-y-2">
                        <label class="block text-xs font-bold text-slate-700">💵 價格與成本</label>
                        <div class="grid grid-cols-3 gap-2">
                            <div>
                                <label class="block text-[10px] font-semibold text-slate-500 mb-1">進貨成本</label>
                                <input type="number" id="edit-cost" class="w-full border rounded-lg p-1.5 text-sm">
                            </div>
                            <div>
                                <label class="block text-[10px] font-semibold text-slate-500 mb-1">參考前價</label>
                                <input type="number" id="edit-price" class="w-full border rounded-lg p-1.5 text-sm">
                            </div>
                            <div>
                                <label class="block text-[10px] font-semibold text-slate-500 mb-1">前價日期</label>
                                <input type="date" id="edit-price-date" class="w-full border rounded-lg p-1.5 text-sm">
                            </div>
                        </div>
                    </div>

                    <!-- 編輯區照片更新與刪除 -->
                    <div>
                        <label class="block text-xs font-semibold text-slate-600 mb-1">管理零件照片 (可點擊圖片放大，或點右上角刪除現有照片；或上傳新照片)</label>
                        <div id="edit-preview-container" class="flex gap-2 mb-3 overflow-x-auto items-center"></div>
                        <input type="file" id="edit-images" accept="image/*" multiple onchange="previewNewEditImages(event)" class="w-full text-xs text-slate-500 file:mr-3 file:py-2 file:px-4 file:rounded-lg file:border-0 file:text-xs file:font-semibold file:bg-blue-50 file:text-blue-700 hover:file:bg-blue-100 cursor-pointer">
                    </div>
                </div>

                <div class="space-y-3 border-t pt-3">
                    <div class="flex justify-between items-center">
                        <h4 class="text-xs font-bold text-slate-500 uppercase tracking-wider">🚘 適用車型與底盤號</h4>
                        <button type="button" onclick="addVehicleRow('edit-vehicles-container', 'edit')" class="text-xs bg-blue-50 hover:bg-blue-100 text-blue-700 font-semibold px-2.5 py-1 rounded border border-blue-200 transition">
                            ➕ 新增車型
                        </button>
                    </div>
                    <div id="edit-vehicles-container" class="space-y-3"></div>
                </div>

                <div class="flex justify-end gap-2 pt-3 border-t">
                    <button type="button" onclick="closeEditModal()" class="px-4 py-2 rounded-lg text-sm text-slate-600 hover:bg-slate-100">取消</button>
                    <button type="submit" id="edit-submit-btn" class="px-4 py-2 bg-blue-600 hover:bg-blue-700 text-white rounded-lg text-sm font-medium shadow">💾 儲存修改</button>
                </div>
            </form>
        </div>
    </div>

    <!-- JS 邏輯區 -->
    <script>
        const SUPABASE_URL = 'https://zudcigogppwberpsdoiw.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_CFja31od0wDX-PEUBOGhcg_BEX8cTbo';
        const STORAGE_BUCKET = 'part-images';

        const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        let currentResultsCache = [];
        let allVehiclesCache = [];
        let selectedPartNamesSet = new Set();
        let allPartNamesCache = [];
        let isSyncing = false;
        let editCurrentImages = [];

        document.addEventListener('DOMContentLoaded', () => {
            initHistoryDatalists();
            addVehicleRow('add-vehicles-container', 'add');
        });

        async function initHistoryDatalists() {
            try {
                const { data: parts } = await _supabase.from('parts').select('part_name, brand_name, supplier_name');
                if (parts) {
                    allPartNamesCache = [...new Set(parts.map(p => p.part_name ? p.part_name.trim() : '').filter(Boolean))];

        // 🚀 複製報價與前價清單（指定格式：品牌+車型+年份，零件名底下條列各品牌與前價）
        async function copyQuote() {
            if (!currentResultsCache || currentResultsCache.length === 0) { 
                alert('⚠️ 無查詢結果可複製！'); 
                return; 
            }
            
            const sBrand = document.getElementById('search-brand').value.trim();
            const sModel = document.getElementById('search-model').value.trim();
            const sYear = document.getElementById('search-year').value.trim();
            
            let vehicleHeader = '';
            if (sBrand || sModel || sYear) {
                vehicleHeader = `${sBrand} ${sModel} ${sYear}`.trim();
            } else {
                const firstItem = currentResultsCache[0];
                const vehicles = firstItem.part_vehicles ? firstItem.part_vehicles.map(pv => pv.vehicles).filter(Boolean) : [];
                if (vehicles.length > 0) {
                    vehicleHeader = `${vehicles[0].brand || ''} ${vehicles[0].model || ''} ${vehicles[0].start_year || ''}`.trim();
                }
            }

            let textLines = [];
            if (vehicleHeader) {
                textLines.push(vehicleHeader);
                textLines.push('');
            }

            const groupedByPartName = {};
            currentResultsCache.forEach(item => {
                const pName = item.part_name || '未命名零件';
                if (!groupedByPartName[pName]) {
                    groupedByPartName[pName] = [];
                }
                groupedByPartName[pName].push(item);
            });

            Object.keys(groupedByPartName).forEach(pName => {
                textLines.push(`【${pName}】`);
                groupedByPartName[pName].forEach(item => {
                    const brandName = item.brand_name || '一般';
                    const priceStr = item.price ? `$${Number(item.price).toLocaleString()}` : '$請洽詢';
                    textLines.push(`${brandName} ${priceStr}`);
                });
                textLines.push('');
            });

            const copyText = textLines.join('\n').trim();
            
            try {
                await navigator.clipboard.writeText(copyText);
                alert('📋 指定格式報價已成功複製至剪貼簿！\n\n' + copyText);
            } catch (err) {
                const textArea = document.createElement("textarea");
                textArea.value = copyText;
                document.body.appendChild(textArea);
                textArea.select();
                document.execCommand('copy');
                document.body.removeChild(textArea);
                alert('📋 報價格式已複製！');
            }
        }

        // 🔗 跨料號無限雙向連動輔助工具
        function parseCrossRefCount(str) {
            if (!str) return [];
            return str.split(/[,，\s]+/).map(s => s.trim().toUpperCase()).filter(Boolean);
        }

        async function syncCrossReferences(partNumber, crossRefText) {
            if (!partNumber) return;
            const currentPN = partNumber.trim().toUpperCase();
            const refs = parseCrossRefCount(crossRefText);
            const allInGroup = [...new Set([currentPN, ...refs])];

            const { data: allParts } = await _supabase.from('parts').select('id, part_number, cross_reference');
            if (!allParts) return;

            const partMap = new Map();
            allParts.forEach(p => {
                if (p.part_number) {
                    partMap.set(p.part_number.trim().toUpperCase(), p);
                }
            });

            for (const pn of allInGroup) {
                const targetPart = partMap.get(pn);
                if (targetPart) {
                    const existingRefs = parseCrossRefCount(targetPart.cross_reference);
                    const mergedRefs = [...new Set([...existingRefs, ...allInGroup.filter(r => r !== pn)])];
                    const newCrossRefStr = mergedRefs.join(', ');
                    if (newCrossRefStr !== (targetPart.cross_reference || '')) {
                        await _supabase.from('parts').update({ cross_reference: newCrossRefStr }).eq('id', targetPart.id);
                    }
                }
            }
        }

        async function searchParts() {
            const searchVType = document.getElementById('search-vehicle-type').value.trim().toLowerCase();
            const searchBrand = document.getElementById('search-brand').value.trim().toLowerCase();
            const searchModel = document.getElementById('search-model').value.trim().toLowerCase();
            const year = parseInt(document.getElementById('search-year').value);
            const selectedPartNames = Array.from(selectedPartNamesSet);
            const keyword = document.getElementById('search-keyword').value.trim();

            const resultsContainer = document.getElementById('results');
            resultsContainer.innerHTML = '<p class="text-slate-500 text-sm text-center py-6">🔍 正在進行綜合比對...</p>';
            document.getElementById('select-all-checkbox').checked = false;

            // 取得所有零件以建立圖譜與聯集擴展
            const { data: allData, error } = await _supabase.from('parts').select(`
                id, part_name, brand_name, part_number, oem_number, cross_reference, kit_parts, price, price_date, cost, supplier_name, remarks, length, width, height, image_1, image_2, image_3,
                part_vehicles ( vehicles ( vehicle_type, brand, model, start_year, start_month, end_year, end_month ) )
            `);

            if (error) { resultsContainer.innerHTML = `<p class="text-red-500 text-sm text-center">❌ ${error.message}</p>`; return; }

            // 1. 建立交叉料號連通圖 (Graph Component Mapping)
            const adj = new Map();
            allData.forEach(item => {
                const pNum = item.part_number ? item.part_number.trim().toUpperCase() : '';
                if (!pNum) return;
                const refs = parseCrossRefCount(item.cross_reference);
                refs.forEach(ref => {
                    if (ref) {
                        if (!adj.has(pNum)) adj.set(pNum, new Set());
                        if (!adj.has(ref)) adj.set(ref, new Set());
                        adj.get(pNum).add(ref);
                        adj.get(ref).add(pNum);
                    }
                });
            });

            // 計算連通群組
            const visited = new Set();
            const partGroupMap = new Map(); // part_number -> Set of connected part_numbers
            allData.forEach(item => {
                const pNum = item.part_number ? item.part_number.trim().toUpperCase() : '';
                if (!pNum || visited.has(pNum)) return;
                const group = new Set();
                const queue = [pNum];
                visited.add(pNum);
                while (queue.length > 0) {
                    const curr = queue.shift();
                    group.add(curr);
                    const neighbors = adj.get(curr);
                    if (neighbors) {
                        neighbors.forEach(n => {
                            if (!visited.has(n)) {
                                visited.add(n);
                                queue.push(n);
                            }
                        });
                    }
                }
                group.forEach(node => partGroupMap.set(node, group));
            });

            // 2. 初步條件篩選符合的零件
            const matchedInitialIds = new Set();
            allData.forEach(item => {
                const vehicleList = item.part_vehicles ? item.part_vehicles.map(pv => pv.vehicles).filter(Boolean) : [];
                
                // 檢查零件名稱 Chip 條件
                const matchName = selectedPartNames.length === 0 || selectedPartNames.some(name => item.part_name && item.part_name.toLowerCase().includes(name.toLowerCase()));
                
                // 檢查關鍵字條件
                let matchKeyword = true;
                if (keyword) {
                    const kw = keyword.toLowerCase();
                    const fields = [item.part_name, item.part_number, item.oem_number, item.cross_reference, item.kit_parts, item.remarks, item.length, item.width, item.height];
                    matchKeyword = fields.some(f => f && String(f).toLowerCase().includes(kw));
                }

                // 檢查車型條件
                let matchVehicle = true;
                if (searchVType || searchBrand || searchModel || !isNaN(year)) {
                    matchVehicle = vehicleList.some(v => {
                        return (!searchVType || (v.vehicle_type && v.vehicle_type.toLowerCase().includes(searchVType))) &&
                               (!searchBrand || (v.brand && v.brand.toLowerCase().includes(searchBrand))) &&
                               (!searchModel || (v.model && v.model.toLowerCase().includes(searchModel))) &&
                               (isNaN(year) || (year >= v.start_year && year <= v.end_year));
                    });
                }

                if (matchName && matchKeyword && matchVehicle) {
                    matchedInitialIds.add(item.id);
                }
            });

            // 3. 透過交叉料號連通群組進行無限擴展聯集 (A帶出B, B帶出C...)[cite: 14]
            const finalAllowedIds = new Set(matchedInitialIds);
            const partNumToIdMap = new Map();
            allData.forEach(item => {
                if (item.part_number) partNumToIdMap.set(item.part_number.trim().toUpperCase(), item.id);
            });

            matchedInitialIds.forEach(id => {
                const item = allData.find(p => p.id === id);
                if (item && item.part_number) {
                    const pNum = item.part_number.trim().toUpperCase();
                    const group = partGroupMap.get(pNum);
                    if (group) {
                        group.forEach(memberNum => {
                            const memberId = partNumToIdMap.get(memberNum);
                            if (memberId) finalAllowedIds.add(memberId);
                        });
                    }
                }
            });

            const filteredData = allData.filter(item => finalAllowedIds.has(item.id));
            renderResults(filteredData);
        }

        function renderResults(list) {

            const cards = list.map(item => {

                const images = [item.image_1, item.image_2, item.image_3].filter(Boolean);

                return `

                        <!-- 批次勾選框 -->

                        <div class="flex justify-between items-start pl-7">

                            <div class="text-right">
                                <span class="text-base font-extrabold text-emerald-600 block">${item.price ? 'NT$ ' + Number(item.price).toLocaleString() : '未報價'}</span>
                                ${item.price_date ? `<span class="text-[11px] text-slate-500 block">📅 前價日期：${item.price_date}</span>` : ''}
                                ${item.cost ? `<span class="text-[11px] text-slate-600 block">💵 成本：NT$ ${Number(item.cost).toLocaleString()}</span>` : ''}
                                ${item.supplier_name ? `<span class="text-[11px] text-indigo-700 block">🏭 廠商：${item.supplier_name}</span>` : ''}
                                <div class="flex gap-1 justify-end mt-2">
                                    <button onclick="openEditModalById(${item.id})" class="text-xs bg-slate-100 text-blue-600 px-2 py-1 rounded border">✏️ 編輯</button>
                                    <button onclick="deletePartById(${item.id}, '${item.part_name}')" class="text-xs bg-red-50 text-red-600 px-2 py-1 rounded border">🗑️ 刪除</button>
                                </div>
                            </div>
                        </div>

                        <div class="grid grid-cols-1 md:grid-cols-2 gap-2 text-xs pl-7">
                            <div class="bg-slate-50 p-2.5 rounded-lg border space-y-1">
                                <div>本廠料號：<strong class="font-mono text-blue-900 bg-white px-1.5 py-0.5 rounded border">${item.part_number}</strong></div>
                                ${(item.length || item.width || item.height) ? `
                                    <div class="text-slate-600 pt-1">
                                        📏 尺寸規格：${item.length ? `長: ${item.length} ` : ''}${item.width ? `寬: ${item.width} ` : ''}${item.height ? `高: ${item.height}` : ''}
                                    </div>` : ''}
                                ${item.cross_reference ? `
                                    <div class="mt-1.5 pt-1.5 border-t">
                                        <span class="text-indigo-800 font-bold">🔗 交叉對照料號：[cite: 14]</span>
                                        <span onclick="jumpToKeywordSearch('${item.cross_reference.trim() || ''}')" class="font-mono text-indigo-700 bg-indigo-50 px-1.5 py-0.5 rounded border border-indigo-200 cursor-pointer hover:bg-indigo-100 transition">${item.cross_reference}</span>
                                    </div>` : ''}
                                ${item.remarks ? `
                                    <div class="mt-1.5 pt-1.5 border-t text-slate-700">
                                        <span class="font-bold text-slate-800">📝 備註說明：</span>${item.remarks}
                                    </div>` : ''}
                            </div>

                            <div class="bg-amber-50/70 p-2.5 rounded-lg border border-amber-200">
                                <span class="text-amber-900 font-bold block mb-1">🔧 建議搭配配套零組件 (點擊各料號按鈕一鍵查詢)：</span>
                                ${renderKitPartsWithLinks(item.kit_parts)}
                            </div>
                        </div>

                        ${images.length ? `<div class="flex gap-2 pl-7">${images.map(img => `<img src="${img}" class="w-16 h-16 object-cover rounded border cursor-pointer hover:opacity-80 transition" onclick="window.open('${img}', '_blank')" title="點擊另開視窗放大">`).join('')}</div>` : ''}

                        <div class="border-t pt-2 pl-7">
                            <span class="text-[11px] font-bold text-slate-400 block mb-1">🚘 相容底盤與車種 (點擊標籤一鍵跳轉篩選)：</span>
                            <div class="flex flex-wrap gap-1">
                                ${vehicles.map(v => `
                                    <span onclick="jumpToVehicleFilter('${v.brand}', '${v.model}', '${v.vehicle_type || ''}')" 
                                          class="text-xs bg-slate-100 hover:bg-blue-50 hover:text-blue-700 hover:border-blue-300 text-slate-700 px-2 py-0.5 rounded border cursor-pointer transition flex items-center gap-1">
                                        <b class="text-blue-800">[${v.vehicle_type || '車種'}]</b> ${v.brand} ${v.model} (${v.start_year}-${v.end_year}) ↗
                                    </span>
                                `).join('')}
                            </div>
                        </div>
                    </div>`;
            }).join('');

            resultsContainer.innerHTML = cards;
        }

        function openEditModalById(id) {
            const item = currentResultsCache.find(p => p.id === id);
            if (!item) return;
            document.getElementById('edit-id').value = item.id;
            document.getElementById('edit-part-name').value = item.part_name || '';
            document.getElementById('edit-brand-name').value = item.brand_name || '';
            document.getElementById('edit-part-number').value = item.part_number || '';
            document.getElementById('edit-oem-number').value = item.oem_number || '';
            document.getElementById('edit-length').value = item.length || '';
            document.getElementById('edit-width').value = item.width || '';
            document.getElementById('edit-height').value = item.height || '';
            document.getElementById('edit-cross-ref').value = item.cross_reference || '';
            document.getElementById('edit-kit-parts').value = item.kit_parts || '';
            document.getElementById('edit-supplier-name').value = item.supplier_name || '';
            document.getElementById('edit-cost').value = item.cost || '';
            document.getElementById('edit-price').value = item.price || '';
            document.getElementById('edit-price-date').value = item.price_date || '';
            document.getElementById('edit-remarks').value = item.remarks || '';

            editCurrentImages = [item.image_1, item.image_2, item.image_3].filter(Boolean);
            renderEditImagesPreview();
            document.getElementById('edit-images').value = '';

            const editVehicles = document.getElementById('edit-vehicles-container');
            editVehicles.innerHTML = '';
            const vehicles = item.part_vehicles ? item.part_vehicles.map(pv => pv.vehicles).filter(Boolean) : [];
            if (vehicles.length) vehicles.forEach(v => addVehicleRow('edit-vehicles-container', 'edit', v));
            else addVehicleRow('edit-vehicles-container', 'edit');

            document.getElementById('edit-modal').classList.remove('hidden');
            document.getElementById('edit-modal').classList.add('flex');
        }

        function closeEditModal() {
            document.getElementById('edit-modal').classList.remove('flex');
            document.getElementById('edit-modal').classList.add('hidden');
        }

        async function handleSaveEdit(e) {
            e.preventDefault();
            const id = document.getElementById('edit-id').value;
            const partNum = document.getElementById('edit-part-number').value.trim();
            const crossRefText = document.getElementById('edit-cross-ref').value.trim();

            const updatePayload = {
                part_name: document.getElementById('edit-part-name').value.trim(),
                brand_name: document.getElementById('edit-brand-name').value.trim(),
                part_number: partNum,
                oem_number: document.getElementById('edit-oem-number').value.trim() || null,
                length: document.getElementById('edit-length').value.trim() || null,
                width: document.getElementById('edit-width').value.trim() || null,
                height: document.getElementById('edit-height').value.trim() || null,
                cross_reference: crossRefText || null,
                kit_parts: document.getElementById('edit-kit-parts').value.trim() || null,
                supplier_name: document.getElementById('edit-supplier-name').value.trim() || null,
                cost: parseFloat(document.getElementById('edit-cost').value) || null,
                price: parseFloat(document.getElementById('edit-price').value) || null,
                price_date: document.getElementById('edit-price-date').value || null,
                remarks: document.getElementById('edit-remarks').value.trim() || null,
                image_1: editCurrentImages[0] || null,
                image_2: editCurrentImages[1] || null,
                image_3: editCurrentImages[2] || null
            };

            const fileInput = document.getElementById('edit-images');
            if (fileInput && fileInput.files.length > 0) {
                const [img1, img2, img3] = await uploadImages('edit-images');
                [img1, img2, img3].forEach(imgUrl => {
                    if (imgUrl && editCurrentImages.length < 3) {
                        editCurrentImages.push(imgUrl);
                    }
                });
                updatePayload.image_1 = editCurrentImages[0] || null;
                updatePayload.image_2 = editCurrentImages[1] || null;
                updatePayload.image_3 = editCurrentImages[2] || null;
            }

            await _supabase.from('parts').update(updatePayload).eq('id', id);
            
            // 執行雙向無限連動同步更新
            await syncCrossReferences(partNum, crossRefText);

            const vehicleIds = await getOrCreateVehicleIds('edit-vehicles-container', 'edit');
            await _supabase.from('part_vehicles').delete().eq('part_id', id);
            if (vehicleIds.length) {
                await _supabase.from('part_vehicles').insert(vehicleIds.map(vId => ({ part_id: id, vehicle_id: vId })));
            }

            alert('✅ 更新成功！');
            closeEditModal();
            initHistoryDatalists();
            searchParts();
        }

        async function handleAddPart(e) {
            e.preventDefault();
            const partNum = document.getElementById('add-part-number').value.trim();
            const crossRefText = document.getElementById('add-cross-ref').value.trim();

            const partPayload = {
                part_name: document.getElementById('add-part-name').value.trim(),
                brand_name: document.getElementById('add-brand-name').value.trim(),
                part_number: partNum,
                oem_number: document.getElementById('add-oem-number').value.trim() || null,
                length: document.getElementById('add-length').value.trim() || null,
                width: document.getElementById('add-width').value.trim() || null,
                height: document.getElementById('add-height').value.trim() || null,
                cross_reference: crossRefText || null,
                kit_parts: document.getElementById('add-kit-parts').value.trim() || null,
                supplier_name: document.getElementById('add-supplier-name').value.trim() || null,
                cost: parseFloat(document.getElementById('add-cost').value) || null,
                price: parseFloat(document.getElementById('add-price').value) || null,
                price_date: document.getElementById('add-price-date').value || null,
                remarks: document.getElementById('add-remarks').value.trim() || null
            };

            const [img1, img2, img3] = await uploadImages('add-images');
            partPayload.image_1 = img1; partPayload.image_2 = img2; partPayload.image_3 = img3;

            const { data: partData, error } = await _supabase.from('parts').insert([partPayload]).select();
            if (error) { alert('❌ ' + error.message); return; }

            // 執行雙向無限連動同步更新
            await syncCrossReferences(partNum, crossRefText);

            const newPartId = partData[0].id;
            const vehicleIds = await getOrCreateVehicleIds('add-vehicles-container', 'add');
            if (vehicleIds.length) {
                await _supabase.from('part_vehicles').insert(vehicleIds.map(vId => ({ part_id: newPartId, vehicle_id: vId })));
            }

            alert('✅ 新增成功！');
            document.getElementById('add-part-form').reset();
            document.getElementById('add-preview-container').innerHTML = '';
            initHistoryDatalists();
            switchTab('search');
            searchParts();
        }
    </script>
</body>
</html>
