    <script>
        const SUPABASE_URL = 'https://zudcigogppwberpsdoiw.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_CFja31od0wDX-PEUBOGhcg_BEX8cTbo';
        const STORAGE_BUCKET = 'part-images';
        
        const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        let currentResultsCache = [];
        let allVehiclesCache = [];

        document.addEventListener('DOMContentLoaded', () => {
            initVehicleDropdowns();
            addVehicleRow('add-vehicles-container', 'add');
        });

        /* ================= ⚡ 精準底盤號 (Chassis Code) 解碼引擎 ================= */
        function parseVINLocally(vin) {
            if (!vin || vin.length !== 17) return { brand: '', model: '', year: '' };

            const wmi = vin.substring(0, 3);
            const yearChar = vin.charAt(9);

            // 1. 年份對照表 (修正重複 Key 覆蓋 Bug)
            const yearMap = {
                'A': 2010, 'B': 2011, 'C': 2012, 'D': 2013, 'E': 2014, 'F': 2015, 'G': 2016, 'H': 2017, 'J': 2018, 'K': 2019, 'L': 2020, 'M': 2021, 'N': 2022, 'P': 2023, 'R': 2024, 'S': 2025, 'T': 2026,
                'V': 1997, 'W': 1998, 'X': 1999, 'Y': 2000, '1': 2001, '2': 2002, '3': 2003, '4': 2004, '5': 2005, '6': 2006, '7': 2007, '8': 2008, '9': 2009
            };
            const year = yearMap[yearChar] || '';

            // 2. 品牌對照表 (WMI)
            let brand = '';
            if (wmi.startsWith('WB') || wmi.startsWith('4US') || wmi.startsWith('5UX')) brand = 'BMW';
            else if (wmi.startsWith('WD') || wmi.startsWith('4JG') || wmi.startsWith('VNE')) brand = 'Mercedes-Benz';
            else if (wmi.startsWith('JT') || wmi.startsWith('4T') || wmi.startsWith('MR0')) brand = 'Toyota';
            else if (wmi.startsWith('WV') || wmi.startsWith('WAU')) brand = 'Volkswagen';
            else if (wmi.startsWith('JH') || wmi.startsWith('1HG')) brand = 'Honda';

            // 3. 底盤代碼精準解析
            let model = '';
            
            if (brand === 'Mercedes-Benz') {
                const chassis3 = vin.substring(3, 6);
                if (/^\d{3}$/.test(chassis3)) {
                    const prefixMap = {
                        '117': 'C117', '118': 'C118', '218': 'C218', '257': 'C257',
                        '156': 'X156', '247': 'H247', '253': 'X253', '166': 'W166',
                        '164': 'W164', '204': 'W204', '205': 'W205', '206': 'W206',
                        '211': 'W211', '212': 'W212', '213': 'W213', '214': 'W214',
                        '221': 'W221', '222': 'W222', '223': 'W223', '245': 'W245',
                        '246': 'W246', '169': 'W169', '176': 'W176', '177': 'W177',
                        '202': 'W202', '203': 'W203', '210': 'W210'
                    };
                    model = prefixMap[chassis3] || `W${chassis3}`;
                }
            } else if (brand === 'BMW') {
                const vds = vin.substring(3, 8);
                if (vin.includes('E36') || vds.includes('CA') || vds.includes('CB') || vds.includes('CG')) model = 'E36';
                else if (vin.includes('E46') || vds.includes('AL') || vds.includes('AM') || vds.includes('AV')) model = 'E46';
                else if (vin.includes('E90') || vds.includes('VA') || vds.includes('VB')) model = 'E90';
                else if (vin.includes('F30') || vds.includes('3A') || vds.includes('3B')) model = 'F30';
                else if (vin.includes('G20')) model = 'G20';
                else if (vin.includes('E39') || vds.includes('DD') || vds.includes('DM')) model = 'E39';
                else if (vin.includes('E60') || vds.includes('NA') || vds.includes('NE')) model = 'E60';
                else if (vin.includes('F10')) model = 'F10';
                else if (vin.includes('G30')) model = 'G30';
            }

            return { brand, model, year };
        }

        async function parseAndSearchVIN() {
            const vinInput = document.getElementById('search-vin').value.trim().toUpperCase();
            const vinStatus = document.getElementById('vin-status');

            if (!vinInput || vinInput.length !== 17) {
                alert('⚠️ 請輸入正確的 17 位 VIN 車身碼！');
                return;
            }

            vinStatus.classList.remove('hidden');
            vinStatus.className = 'block text-xs text-blue-200 bg-blue-950/80 p-3 rounded-lg border border-blue-700/80 mt-3 font-medium animate-pulse';
            vinStatus.innerHTML = '⏳ 正在分析 VIN 車身結構與識別底盤碼...';

            let decoded = parseVINLocally(vinInput) || { brand: '', model: '', year: '' };
            
            // 備用 API 連線 (屏障 Series / Class 等籠統名稱)
            if (!decoded.model) {
                try {
                    const res = await fetch(`https://vpic.nhtsa.dot.gov/api/vehicles/decodevinvalues/${vinInput}?format=json`);
                    if (res.ok) {
                        const data = await res.json();
                        if (data && data.Results && data.Results.length > 0) {
                            const apiRes = data.Results[0];
                            if (!decoded.brand) decoded.brand = apiRes.Make || '';
                            if (!decoded.year) decoded.year = apiRes.ModelYear || '';
                            const rawModel = apiRes.Model || apiRes.Series || '';
                            if (rawModel && !/series|class|級/i.test(rawModel)) {
                                decoded.model = rawModel;
                            }
                        }
                    }
                } catch (e) {
                    console.warn('API 備用連線失敗');
                }
            }

            if (decoded.brand) document.getElementById('search-brand').value = decoded.brand;
            handleBrandChange();
            if (decoded.model) document.getElementById('search-model').value = decoded.model;
            if (decoded.year) document.getElementById('search-year').value = decoded.year;

            vinStatus.classList.remove('animate-pulse');
            vinStatus.className = 'block text-xs text-emerald-200 bg-emerald-950/80 p-3 rounded-lg border border-emerald-700/80 mt-3 font-medium';
            vinStatus.innerHTML = `✅ <b>VIN 精準底盤解碼：</b> ${decoded.year || ''} ${decoded.brand || ''} <b>${decoded.model || '全底盤'}</b> (已自動帶入下欄並查詢)`;

            searchParts();
        }

        /* ================= 📋 複製報價文字功能 ================= */
        async function copyQuote() {
            if (!currentResultsCache || currentResultsCache.length === 0) {
                alert('⚠️ 目前沒有可複製的查詢結果！請先執行查詢。');
                return;
            }

            const grouped = {};
            currentResultsCache.forEach(item => {
                const pName = item.part_name ? item.part_name.trim() : '未命名零件';
                if (!grouped[pName]) grouped[pName] = [];
                grouped[pName].push(item);
            });

            let textLines = [];
            for (const [partName, items] of Object.entries(grouped)) {
                textLines.push(`【${partName}】`);
                items.forEach(item => {
                    const brand = item.brand_name || '通用';
                    const pNo = item.part_number ? `(${item.part_number})` : '';
                    const priceVal = (item.price !== null && item.price !== undefined && item.price !== '') ? `$${Number(item.price).toLocaleString()}` : '請洽詢';
                    textLines.push(`▪ ${brand} ${pNo} : ${priceVal}`);
                });
                textLines.push('');
            }

            const copyText = textLines.join('\n').trim();

            try {
                await navigator.clipboard.writeText(copyText);
                alert('📋 報價文字已成功複製至剪貼簿！\n\n' + copyText);
            } catch (err) {
                const textarea = document.createElement('textarea');
                textarea.value = copyText;
                document.body.appendChild(textarea);
                textarea.select();
                document.execCommand('copy');
                document.body.removeChild(textarea);
                alert('📋 報價文字已成功複製至剪貼簿！\n\n' + copyText);
            }
        }

        function clearSearchInputs() {
            document.getElementById('search-vin').value = '';
            document.getElementById('search-brand').value = '';
            document.getElementById('search-model').value = '';
            document.getElementById('search-year').value = '';
            document.getElementById('search-part').value = '';
            document.getElementById('vin-status').classList.add('hidden');
            updateModelDatalist('');
            document.getElementById('results').innerHTML = '<p class="text-slate-400 text-sm text-center py-6">請輸入條件或 VIN 碼。</p>';
            currentResultsCache = [];
        }

        function createVehicleRowHTML(prefix, v = {}) {
            return `
                <div class="vehicle-row bg-white p-3 rounded-xl border border-slate-200 relative space-y-2 shadow-sm">
                    <button type="button" onclick="removeVehicleRow(this)" class="absolute top-2 right-2 text-red-500 hover:text-red-700 hover:bg-red-50 text-xs font-bold px-2 py-1 rounded border border-transparent hover:border-red-200 transition">
                        🗑️ 刪除
                    </button>
                    
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-3 pr-14">
                        <div>
                            <label class="block text-xs font-semibold text-slate-600 mb-1">車廠 *</label>
                            <input type="text" class="${prefix}-v-brand w-full border rounded-lg p-2 text-sm" required placeholder="例: Mercedes-Benz" value="${v.brand || ''}">
                        </div>
                        <div>
                            <label class="block text-xs font-semibold text-slate-600 mb-1">底盤/車型 *</label>
                            <input type="text" class="${prefix}-v-model w-full border rounded-lg p-2 text-sm" required placeholder="例: W246 / E36" value="${v.model || ''}">
                        </div>
                    </div>

                    <div class="grid grid-cols-2 md:grid-cols-4 gap-2">
                        <div>
                            <label class="block text-xs font-semibold text-slate-600 mb-1">起始年份 *</label>
                            <input type="number" class="${prefix}-v-start w-full border rounded-lg p-2 text-sm" required placeholder="例: 2011" value="${v.start_year || ''}">
                        </div>
                        <div>
                            <label class="block text-xs font-semibold text-slate-600 mb-1">起始月份</label>
                            <input type="number" min="1" max="12" class="${prefix}-v-start-m w-full border rounded-lg p-2 text-sm" placeholder="1-12" value="${v.start_month || ''}">
                        </div>
                        <div>
                            <label class="block text-xs font-semibold text-slate-600 mb-1">結束年份 *</label>
                            <input type="number" class="${prefix}-v-end w-full border rounded-lg p-2 text-sm" required placeholder="例: 2018" value="${v.end_year || ''}">
                        </div>
                        <div>
                            <label class="block text-xs font-semibold text-slate-600 mb-1">結束月份</label>
                            <input type="number" min="1" max="12" class="${prefix}-v-end-m w-full border rounded-lg p-2 text-sm" placeholder="1-12" value="${v.end_month || ''}">
                        </div>
                    </div>
                </div>
            `;
        }

        function addVehicleRow(containerId, prefix, vData = {}) {
            const container = document.getElementById(containerId);
            const wrapper = document.createElement('div');
            wrapper.innerHTML = createVehicleRowHTML(prefix, vData);
            container.appendChild(wrapper.firstElementChild);
        }

        function removeVehicleRow(btn) {
            const container = btn.closest('.vehicle-row').parentElement;
            if (container.querySelectorAll('.vehicle-row').length <= 1) {
                alert('⚠️ 至少需要保留一組車型資料！');
                return;
            }
            btn.closest('.vehicle-row').remove();
        }

        async function getOrCreateVehicleIds(containerId, prefix) {
            const container = document.getElementById(containerId);
            const rows = container.querySelectorAll('.vehicle-row');
            const vehicleIds = [];

            for (const row of rows) {
                const brand = row.querySelector(`.${prefix}-v-brand`).value.trim();
                const model = row.querySelector(`.${prefix}-v-model`).value.trim();
                const startYear = parseInt(row.querySelector(`.${prefix}-v-start`).value);
                const startMonth = parseInt(row.querySelector(`.${prefix}-v-start-m`).value) || null;
                const endYear = parseInt(row.querySelector(`.${prefix}-v-end`).value);
                const endMonth = parseInt(row.querySelector(`.${prefix}-v-end-m`).value) || null;

                if (!brand || !model || isNaN(startYear) || isNaN(endYear)) continue;

                const { data: existingVehicle } = await _supabase
                    .from('vehicles')
                    .select('id')
                    .eq('brand', brand)
                    .eq('model', model)
                    .eq('start_year', startYear)
                    .eq('end_year', endYear)
                    .maybeSingle();

                if (existingVehicle) {
                    vehicleIds.push(existingVehicle.id);
                } else {
                    const { data: newVehicle, error: vError } = await _supabase
                        .from('vehicles')
                        .insert([{ brand, model, start_year: startYear, start_month: startMonth, end_year: endYear, end_month: endMonth }])
                        .select();

                    if (vError) throw vError;
                    if (newVehicle && newVehicle.length > 0) {
                        vehicleIds.push(newVehicle[0].id);
                    }
                }
            }
            return [...new Set(vehicleIds)];
        }

        function previewImages(event, containerId) {
            const container = document.getElementById(containerId);
            container.innerHTML = '';
            const files = Array.from(event.target.files).slice(0, 3);

            files.forEach((file) => {
                const reader = new FileReader();
                reader.onload = (e) => {
                    const wrapper = document.createElement('div');
                    wrapper.className = 'relative shrink-0';
                    wrapper.innerHTML = `<img src="${e.target.result}" class="w-16 h-16 object-cover rounded border">`;
                    container.appendChild(wrapper);
                };
                reader.readAsDataURL(file);
            });
        }

        async function uploadImages(fileInputId) {
            const fileInput = document.getElementById(fileInputId);
            if (!fileInput || !fileInput.files || fileInput.files.length === 0) return [null, null, null];

            const files = Array.from(fileInput.files).slice(0, 3);
            const uploadedUrls = [null, null, null];

            for (let i = 0; i < files.length; i++) {
                const file = files[i];
                const filePath = `parts/${Date.now()}_${Math.random().toString(36).substring(2, 7)}.${file.name.split('.').pop()}`;
                const { error } = await _supabase.storage.from(STORAGE_BUCKET).upload(filePath, file);
                if (!error) {
                    const { data } = _supabase.storage.from(STORAGE_BUCKET).getPublicUrl(filePath);
                    uploadedUrls[i] = data.publicUrl;
                }
            }
            return uploadedUrls;
        }

        async function initVehicleDropdowns() {
            try {
                const { data } = await _supabase.from('vehicles').select('brand, model');
                allVehiclesCache = data || [];
                const uniqueBrands = [...new Set(allVehiclesCache.map(v => v.brand).filter(Boolean))];
                document.getElementById('brand-list').innerHTML = uniqueBrands.map(b => `<option value="${b}">`).join('');
                updateModelDatalist();
            } catch (err) { console.error(err); }
        }

        function handleBrandChange() {
            const selectedBrand = document.getElementById('search-brand').value.trim().toLowerCase();
            updateModelDatalist(selectedBrand);
        }

        function updateModelDatalist(filterBrand = '') {
            let filtered = allVehiclesCache;
            if (filterBrand) filtered = allVehiclesCache.filter(v => v.brand.toLowerCase().includes(filterBrand));
            const uniqueModels = [...new Set(filtered.map(v => v.model).filter(Boolean))];
            document.getElementById('model-list').innerHTML = uniqueModels.map(m => `<option value="${m}">`).join('');
        }

        function switchTab(tab) {
            document.getElementById('tab-search').className = tab === 'search' ? 'block' : 'hidden';
            document.getElementById('tab-add').className = tab === 'add' ? 'block' : 'hidden';
            document.getElementById('tab-search-btn').className = tab === 'search' ? 'pb-2 border-b-2 border-blue-600 font-semibold text-blue-600' : 'pb-2 font-semibold text-slate-500';
            document.getElementById('tab-add-btn').className = tab === 'add' ? 'pb-2 border-b-2 border-blue-600 font-semibold text-blue-600' : 'pb-2 font-semibold text-slate-500';
        }

        /* 🔍 綜合查詢零件 */
        async function searchParts() {
            const searchBrand = document.getElementById('search-brand').value.trim().toLowerCase();
            const searchModel = document.getElementById('search-model').value.trim().toLowerCase();
            const year = parseInt(document.getElementById('search-year').value);
            const rawPartInput = document.getElementById('search-part').value.trim();
            const resultsContainer = document.getElementById('results');

            resultsContainer.innerHTML = '<p class="text-slate-500 text-sm text-center py-6">🔍 正在比對零件與關聯料號...</p>';

            const keywords = rawPartInput.split(/[,，\s\n、]+/).map(k => k.trim()).filter(k => k.length > 0);

            let query = _supabase.from('parts').select(`
                id, part_name, brand_name, part_number, oem_number, cross_reference, price, price_date, cost, supplier_name, remarks, length, width, height, image_1, image_2, image_3,
                part_vehicles ( vehicles ( brand, model, start_year, start_month, end_year, end_month ) )
            `);

            if (keywords.length > 0) {
                const conditions = [];
                keywords.forEach(k => {
                    conditions.push(`part_name.ilike.%${k}%`);
                    conditions.push(`part_number.ilike.%${k}%`);
                    conditions.push(`oem_number.ilike.%${k}%`);
                    conditions.push(`cross_reference.ilike.%${k}%`);
                    conditions.push(`remarks.ilike.%${k}%`);
                });
                query = query.or(conditions.join(','));
            }

            const { data, error } = await query;
            if (error) {
                resultsContainer.innerHTML = `<p class="text-red-500 text-sm text-center py-4">❌ 查詢失敗：${error.message}</p>`;
                return;
            }

            const filteredData = data.filter(item => {
                const vehicleList = item.part_vehicles ? item.part_vehicles.map(pv => pv.vehicles).filter(Boolean) : [];
                if (!searchBrand && !searchModel && !year) return true;

                return vehicleList.some(v => {
                    const matchBrand = !searchBrand || (v.brand && v.brand.toLowerCase().includes(searchBrand));
                    const matchModel = !searchModel || (v.model && v.model.toLowerCase().includes(searchModel));
                    const matchYear = !year || (year >= v.start_year && year <= v.end_year);
                    return matchBrand && matchModel && matchYear;
                });
            });

            renderResults(filteredData);
        }

        function renderResults(list) {
            currentResultsCache = list;
            const resultsContainer = document.getElementById('results');

            if (list.length === 0) {
                resultsContainer.innerHTML = `<p class="text-amber-600 text-sm text-center py-6 bg-amber-50 rounded-xl border border-amber-200">查無符合條件的零件。</p>`;
                return;
            }

            resultsContainer.innerHTML = list.map(item => {
                const allVehicles = item.part_vehicles ? item.part_vehicles.map(pv => pv.vehicles).filter(Boolean) : [];
                const images = [item.image_1, item.image_2, item.image_3].filter(Boolean);

                return `
                    <div class="border border-slate-200 rounded-xl p-4 bg-white shadow-sm hover:border-blue-400 transition">
                        <div class="flex justify-between items-start gap-2 mb-2">
                            <div>
                                <span class="inline-block px-2.5 py-0.5 text-xs font-bold rounded-full bg-blue-100 text-blue-800">
                                    ${item.brand_name || '通用品牌'}
                                </span>
                                <h3 class="text-base font-bold text-slate-800 mt-1">${item.part_name}</h3>
                            </div>
                            <div class="text-right whitespace-nowrap">
                                <span class="text-base font-extrabold text-emerald-600 block">${item.price ? 'NT$ ' + Number(item.price).toLocaleString() : '未報價'}</span>
                                <button onclick="openEditModalById(${item.id})" class="text-xs bg-slate-100 hover:bg-blue-50 text-blue-600 px-2 py-1 rounded border mt-1">✏️ 編輯零件</button>
                            </div>
                        </div>

                        <!-- 關鍵料號與尺寸 -->
                        <div class="bg-slate-50 p-2.5 rounded-lg border border-slate-200 text-xs space-y-1 my-2">
                            <div class="flex flex-wrap gap-3">
                                <span>本廠料號：<strong class="font-mono text-blue-900 bg-white px-1.5 py-0.5 rounded border">${item.part_number}</strong></span>
                                ${item.oem_number ? `<span>OEM 原廠號：<strong class="font-mono text-slate-700 bg-white px-1.5 py-0.5 rounded border">${item.oem_number}</strong></span>` : ''}
                                ${(item.length || item.width || item.height) ? `<span>尺寸 (mm)：<strong class="font-mono text-slate-700">${item.length || '-'} × ${item.width || '-'} × ${item.height || '-'}</strong></span>` : ''}
                            </div>
                            
                            ${item.cross_reference ? `
                                <div class="mt-1 pt-1 border-t border-slate-200/60">
                                    <span class="text-indigo-800 font-bold">🔗 交叉對照料號：</span>
                                    <span class="font-mono text-indigo-900 bg-indigo-50/80 px-1.5 py-0.5 rounded border border-indigo-200">${item.cross_reference}</span>
                                </div>
                            ` : ''}
                        </div>

                        ${images.length > 0 ? `
                            <div class="flex gap-2 my-2">
                                ${images.map(img => `<img src="${img}" class="w-16 h-16 object-cover rounded border">`).join('')}
                            </div>
                        ` : ''}

                        <div class="text-xs text-slate-500 mb-2">
                            ${item.remarks ? `備註：${item.remarks}` : ''}
                        </div>

                        <div class="border-t pt-2">
                            <span class="text-[11px] font-bold text-slate-400 block mb-1">🚘 相容底盤與車型 (${allVehicles.length} 台)：</span>
                            <div class="flex flex-wrap gap-1">
                                ${allVehicles.map(v => `<span class="text-xs bg-slate-100 text-slate-700 px-2 py-0.5 rounded border">${v.brand} ${v.model} (${v.start_year}-${v.end_year})</span>`).join('')}
                            </div>
                        </div>
                    </div>
                `;
            }).join('');
        }

        function openEditModalById(id) {
            const item = currentResultsCache.find(p => p.id === id);
            if (!item) return;

            document.getElementById('edit-id').value = item.id;
            document.getElementById('edit-part-name').value = item.part_name || '';
            document.getElementById('edit-brand-name').value = item.brand_name || '';
            document.getElementById('edit-part-number').value = item.part_number || '';
            document.getElementById('edit-oem-number').value = item.oem_number || '';
            document.getElementById('edit-cross-ref').value = item.cross_reference || '';
            document.getElementById('edit-supplier-name').value = item.supplier_name || '';
            document.getElementById('edit-cost').value = item.cost !== null ? item.cost : '';
            document.getElementById('edit-price').value = item.price !== null ? item.price : '';
            document.getElementById('edit-price-date').value = item.price_date || '';
            document.getElementById('edit-remarks').value = item.remarks || '';
            
            // 還原尺寸數據
            document.getElementById('edit-length').value = item.length !== null ? item.length : '';
            document.getElementById('edit-width').value = item.width !== null ? item.width : '';
            document.getElementById('edit-height').value = item.height !== null ? item.height : '';

            // 預覽既有圖片
            const previewContainer = document.getElementById('edit-preview-container');
            previewContainer.innerHTML = '';
            [item.image_1, item.image_2, item.image_3].filter(Boolean).forEach(url => {
                const img = document.createElement('img');
                img.src = url;
                img.className = 'w-16 h-16 object-cover rounded border';
                previewContainer.appendChild(img);
            });

            const editVehiclesContainer = document.getElementById('edit-vehicles-container');
            editVehiclesContainer.innerHTML = '';
            const vehicles = item.part_vehicles ? item.part_vehicles.map(pv => pv.vehicles).filter(Boolean) : [];
            if (vehicles.length > 0) vehicles.forEach(v => addVehicleRow('edit-vehicles-container', 'edit', v));
            else addVehicleRow('edit-vehicles-container', 'edit');

            document.getElementById('edit-modal').classList.remove('hidden');
            document.getElementById('edit-modal').classList.add('flex');
        }

        function closeEditModal() {
            document.getElementById('edit-modal').classList.remove('flex');
            document.getElementById('edit-modal').classList.add('hidden');
        }

        async function handleSaveEdit(e) {
            e.preventDefault();
            const id = document.getElementById('edit-id').value;
            const currentPart = currentResultsCache.find(p => p.id == id);

            const updatePayload = {
                part_name: document.getElementById('edit-part-name').value.trim(),
                brand_name: document.getElementById('edit-brand-name').value.trim(),
                part_number: document.getElementById('edit-part-number').value.trim(),
                oem_number: document.getElementById('edit-oem-number').value.trim() || null,
                cross_reference: document.getElementById('edit-cross-ref').value.trim() || null,
                supplier_name: document.getElementById('edit-supplier-name').value.trim() || null,
                cost: parseFloat(document.getElementById('edit-cost').value) || null,
                price: parseFloat(document.getElementById('edit-price').value) || null,
                price_date: document.getElementById('edit-price-date').value || null,
                remarks: document.getElementById('edit-remarks').value.trim() || null,
                length: parseFloat(document.getElementById('edit-length').value) || null,
                width: parseFloat(document.getElementById('edit-width').value) || null,
                height: parseFloat(document.getElementById('edit-height').value) || null
            };

            // 處理圖片更新
            const [newImg1, newImg2, newImg3] = await uploadImages('edit-images');
            if (newImg1) updatePayload.image_1 = newImg1;
            if (newImg2) updatePayload.image_2 = newImg2;
            if (newImg3) updatePayload.image_3 = newImg3;

            await _supabase.from('parts').update(updatePayload).eq('id', id);
            const vehicleIds = await getOrCreateVehicleIds('edit-vehicles-container', 'edit');
            await _supabase.from('part_vehicles').delete().eq('part_id', id);

            if (vehicleIds.length > 0) {
                const mappings = vehicleIds.map(vId => ({ part_id: id, vehicle_id: vId }));
                await _supabase.from('part_vehicles').insert(mappings);
            }

            alert('✅ 零件資料與適用車型更新成功！');
            closeEditModal();
            searchParts();
        }

        async function handleAddPart(e) {
            e.preventDefault();
            const partPayload = {
                part_name: document.getElementById('add-part-name').value.trim(),
                brand_name: document.getElementById('add-brand-name').value.trim(),
                part_number: document.getElementById('add-part-number').value.trim(),
                oem_number: document.getElementById('add-oem-number').value.trim() || null,
                cross_reference: document.getElementById('add-cross-ref').value.trim() || null,
                supplier_name: document.getElementById('add-supplier-name').value.trim() || null,
                cost: parseFloat(document.getElementById('add-cost').value) || null,
                price: parseFloat(document.getElementById('add-price').value) || null,
                price_date: document.getElementById('add-price-date').value || null,
                remarks: document.getElementById('add-remarks').value.trim() || null,
                length: parseFloat(document.getElementById('add-length').value) || null,
                width: parseFloat(document.getElementById('add-width').value) || null,
                height: parseFloat(document.getElementById('add-height').value) || null
            };

            const [img1, img2, img3] = await uploadImages('add-images');
            partPayload.image_1 = img1; partPayload.image_2 = img2; partPayload.image_3 = img3;

            const { data: partData, error } = await _supabase.from('parts').insert([partPayload]).select();
            if (error) { alert('❌ 儲存失敗：' + error.message); return; }

            const newPartId = partData[0].id;
            const vehicleIds = await getOrCreateVehicleIds('add-vehicles-container', 'add');

            if (vehicleIds.length > 0) {
                const mappings = vehicleIds.map(vId => ({ part_id: newPartId, vehicle_id: vId }));
                await _supabase.from('part_vehicles').insert(mappings);
            }

            alert('✅ 零件與關聯對照新增成功！');
            document.getElementById('add-part-form').reset();
            document.getElementById('add-preview-container').innerHTML = '';
            switchTab('search');
            searchParts();
        }
    </script>
</body>
