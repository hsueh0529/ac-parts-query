<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>汽車空調零件查詢系統</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Supabase JS SDK -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-slate-100 min-h-screen p-6">
    <div class="max-w-4xl mx-auto space-y-6">
        <!-- 標題與搜尋區 -->
        <div class="bg-white p-6 rounded-xl shadow-sm space-y-4">
            <h1 class="text-2xl font-bold text-slate-800">汽車空調零件資料庫</h1>
            <div class="flex gap-2">
                <input 
                    type="text" 
                    id="searchInput" 
                    placeholder="請輸入料號、零件名稱或車型..." 
                    class="flex-1 px-4 py-2 border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500"
                    oninput="searchParts()"
                >
            </div>
        </div>

        <!-- 結果顯示區 -->
        <div id="resultsContainer" class="grid grid-cols-1 md:grid-cols-2 gap-4">
            <!-- 動態渲染的卡片會在這裡顯示 -->
        </div>
    </div>

    <script>
        // 初始化 Supabase 客戶端（請替換為您實際的 Supabase URL 與 Anon Key）
        const SUPABASE_URL = 'YOUR_SUPABASE_URL';
        const SUPABASE_ANON_KEY = 'YOUR_SUPABASE_ANON_KEY';
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        // 搜尋零件函式
        async function searchParts() {
            const keyword = document.getElementById('searchInput').value.trim();
            
            let query = supabaseClient
                .from('parts') // 請依實際情況替換資料表名稱
                .select('id, part_no, part_name, car_model, supplier_name, cost, price_date, price');

            if (keyword) {
                query = query.or(`part_no.ilike.%${keyword}%,part_name.ilike.%${keyword}%,car_model.ilike.%${keyword}%`);
            }

            const { data, error } = await query.limit(20);

            if (error) {
                console.error('查詢錯誤:', error);
                return;
            }

            renderResults(data || []);
        }

        // 渲染結果函式（包含進貨廠商、進貨成本與前價日期）
        function renderResults(items) {
            const container = document.getElementById('resultsContainer');
            
            if (items.length === 0) {
                container.innerHTML = `<div class="col-span-2 text-center text-slate-500 py-8 bg-white rounded-xl shadow-sm">查無相關零件資料</div>`;
                return;
            }

            container.innerHTML = items.map(item => `
                <div class="bg-white p-4 rounded-xl shadow-sm border border-slate-200 flex flex-col justify-between space-y-3">
                    <div>
                        <div class="flex justify-between items-start">
                            <h3 class="font-bold text-lg text-slate-800">${item.part_name || '未命名零件'}</h3>
                            <span class="text-xs bg-blue-50 text-blue-600 px-2 py-1 rounded font-medium">料號: ${item.part_no || 'N/A'}</span>
                        </div>
                        <p class="text-sm text-slate-600 mt-1">適用車型：${item.car_model || '未填寫'}</p>
                    </div>

                    <!-- 進貨、成本與價格資訊欄位 -->
                    <div class="text-xs text-slate-600 space-y-1 bg-slate-50 p-3 rounded-lg border border-slate-100">
                        <div class="flex justify-between">
                            <span>進貨廠商：</span>
                            <strong class="text-slate-800">${item.supplier_name || '未填寫'}</strong>
                        </div>
                        <div class="flex justify-between">
                            <span>進貨成本：</span>
                            <strong class="text-slate-800">${item.cost ? 'NT$ ' + Number(item.cost).toLocaleString() : '未填寫'}</strong>
                        </div>
                        <div class="flex justify-between">
                            <span>前價日期：</span>
                            <strong class="text-slate-800">${item.price_date || '未填寫'}</strong>
                        </div>
                        <div class="flex justify-between pt-1 border-t border-slate-200 mt-1">
                            <span>銷售售價：</span>
                            <strong class="text-blue-600">${item.price ? 'NT$ ' + Number(item.price).toLocaleString() : '未填寫'}</strong>
                        </div>
                    </div>
                </div>
            `).join('');
        }
    </script>
</body>
</html>
