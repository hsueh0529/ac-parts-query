<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>汽車空調零件通用資料庫</title>
    <!-- 引入 Tailwind CSS 進行視覺排版 -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- 引入 Supabase 官方 SDK -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-slate-100 min-h-screen p-3 md:p-8 text-slate-800">

    <div class="max-w-4xl mx-auto bg-white rounded-xl shadow-md overflow-hidden p-4 md:p-6">
        <!-- 頂部標題與連線狀態 -->
        <h1 class="text-xl md:text-2xl font-bold text-slate-800 mb-4 border-b pb-3 flex items-center justify-between">
            <span>🚗 汽車空調零件通用資料庫</span>
            <span class="text-xs font-normal text-emerald-600 bg-emerald-50 px-2.5 py-1 rounded-full border border-emerald-200">雲端同步中</span>
        </h1>

        <!-- 功能頁籤切換按鈕 -->
        <div class="flex gap-4 border-b mb-6">
            <button id="tab-search-btn" onclick="switchTab('search')" class="pb-2 border-b-2 border-blue-600 font-semibold text-blue-600 transition">
                🔍 零件與價格查詢
            </button>
            <button id="tab-add-btn" onclick="switchTab('add')" class="pb-2 font-semibold text-slate-500 hover:text-slate-800 transition">
                ➕ 建立新零件資料
            </button>
        </div>

        <!-- ================= 1. 查詢分頁 ================= -->
        <div id="tab-search" class="block">
            <div class="grid grid-cols-1 md:grid-cols-4 gap-3 mb-4 bg-slate-50 p-4 rounded-xl border border-slate-200">
                <!-- 品牌模糊搜尋選單 -->
                <div>
                    <label class="block text-xs font-semibold text-slate-600 mb-1">車廠 / 品牌</label>
                    <input type="text" id="search-brand" list="brand-list" placeholder="選擇或輸入品牌..." oninput="handleBrandChange()" class="w-full border rounded-lg p-2 text-sm focus:ring-2 focus:ring-blue-500 outline-none">
                    <datalist id="brand-list"></datalist>
                </div>

                <!-- 車型 (根據品牌連動縮小範圍) -->
                <div>
                    <label class="block text-xs font-semibold text-slate-600 mb-1">車型 / 底盤號</label>
                    <input type="text" id="search-model" list="model-list" placeholder="請先選擇品牌..." class="w-full border rounded-lg p-2 text-sm focus:ring-2 focus:ring-blue-500 outline-none">
                    <datalist id="model-list"></datalist>
                </div>

                <!-- 年份 -->
                <div>
                    <label class="block text-xs font-semibold text-slate-600 mb-1">年份</label>
                    <input type="number" id="search-year" placeholder="例如: 1995" class="w-full border rounded-lg p-2 text-sm focus:ring-2 focus:ring-blue-500 outline-none">
                </div>

                <!-- 零件名稱 -->
                <div>
                    <label class="block text-xs font-semibold text-slate-600 mb-1">零件名稱 (多關鍵字以逗號隔開)</label>
                    <input type="text" id="search-part" placeholder="例如: 壓縮機, 蒸發器" class="w-full border rounded-lg p-2 text-sm focus:ring-2 focus:ring-blue-500 outline-none">
                </div>
            </div>

            <!-- 操作按鈕列 -->
            <div class="flex flex-col md:flex-row gap-3 mb-6">
                <button onclick="searchParts()" class="flex-1 bg-blue-600 hover:bg-blue-700 active:bg-blue-800 text-white font-medium py-2.5 rounded-lg shadow transition">
                    🔍 執行批次查詢
                </button>
                <button onclick="clearSearchInputs()" class="bg-slate-200 hover:bg-slate-300 active:bg-slate-400 text-slate-700 font-medium px-5 py-2.5 rounded-lg shadow-sm transition">
                    🧹 清除條件
                </button>
            </div>

            <!-- 查詢結果顯示區域 -->
            <div id="results" class="space-y-4">
                <p class="text-slate-400 text-sm text-center py-6">請輸入條件並點擊上方按鈕。</p>
            </div>
        </div>

        <!-- ================= 2. 新增資料分頁 ================= -->
        <div id="tab-add" class="hidden">
            <form id="add-part-form" onsubmit="handleAddPart(event)" class="space-y-4 max-w-2xl mx-auto">
                
                <!-- 零件主檔資訊 -->
                <div class="bg-slate-50 p-4 rounded-xl border border-slate-200 space-y-4">
                    <h2 class="font-bold text-sm text-slate-700 border-b pb-2">基本零件資訊</h2>
                    
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-3">
                        <div>
                            <label class="block text-xs font-semibold text-slate-600 mb-1">零件名稱 *</label>
                            <input type="text" id="add-part-name" required placeholder="例如: 汽車空調壓縮機 5SER12C" class="w-full border rounded-lg p-2 text-sm">
                        </div>
                        <div>
                            <label class="block text-xs font-semibold text-slate-600 mb-1">品牌 *</label>
                            <input type="text" id="add-brand-name" required placeholder="品牌 (例如: Denso, 原廠, Sanden)" class="w-full border rounded-lg p-2 text-sm">
                        </div>
                    </div>

                    <div class="grid grid-cols-1 md:grid-cols-2 gap-3">
                        <div>
                            <label class="block text-xs font-semibold text-slate-600 mb-1">零件料號 (選填)</label>
                            <input type="text" id="add-part-number" placeholder="例如: DCP05001" class="w-full border rounded-lg p-2 text-sm font-mono">
                        </div>
                        <div>
                            <label class="block text-xs font-semibold text-slate-600 mb-1">前次進貨廠商 (選填)</label>
                            <input type="text" id="add-supplier-name" placeholder="例如: 台灣電綜, 永晟" class="w-full border rounded-lg p-2 text-sm">
                        </div>
                    </div>

                    <!-- 價格與日期區塊 -->
                    <div class="bg-white p-3 rounded-lg border border-slate-200">
                        <label class="block text-xs font-bold text-slate-700 mb-2">💵 價格與成本紀錄 (選填)</label>
                        <div class="grid grid-cols-1 md:grid-cols-3 gap-3">
                            <div>
                                <label class="block text-[11px] font-semibold text-slate-500 mb-1">進貨成本 (NT$)</label>
                                <input type="number" id="add-cost" placeholder="例如: 4500" class="w-full border rounded-lg p-2 text-sm">
                            </div>
                            <div>
                                <label class="block text-[11px] font-semibold text-slate-500 mb-1">參考前價 (NT$)</label>
                                <input type="number" id="add-price" placeholder="例如: 6800" class="w-full border rounded-lg p-2 text-sm">
                            </div>
                            <div>
                                <label class="block text-[11px] font-semibold text-slate-500 mb-1">前價日期</label>
                                <input type="date" id="add-price-date" class="w-full border rounded-lg p-2 text-sm">
                            </div>
                        </div>
                    </div>

                    <!-- 外觀尺寸 -->
                    <div class="bg-white p-3 rounded-lg border border-slate-200">
                        <label class="block text-xs font-bold text-slate-700 mb-2">📐 外觀尺寸 (選填，單位：mm)</label>
                        <div class="grid grid-cols-3 gap-2">
                            <div>
                                <label class="block text-[11px] font-semibold text-slate-500 mb-1">長 (Length)</label>
                                <input type="number" id="add-length" step="0.1" placeholder="例: 150" class="w-full border rounded-lg p-2 text-sm">
                            </div>
                            <div>
                                <label class="block text-[11px] font-semibold text-slate-500 mb-1">寬 (Width)</label>
                                <input type="number" id="add-width" step="0.1" placeholder="例: 100" class="w-full border rounded-lg p-2 text-sm">
                            </div>
                            <div>
                                <label class="block text-[11px] font-semibold text-slate-500 mb-1">高 (Height)</label>
                                <input type="number" id="add-height" step="0.1" placeholder="例: 50" class="w-full border rounded-lg p-2 text-sm">
                            </div>
                        </div>
                    </div>

                    <div>
                        <label class="block text-xs font-semibold text-slate-600 mb-1">備註說明</label>
                        <input type="text" id="add-remarks" placeholder="例如: 附帶腳架、需搭配指定冷媒" class="w-full border rounded-lg p-2 text-sm">
                    </div>

                    <!-- 新增零件照片 -->
                    <div>
                        <label class="block text-xs font-semibold text-slate-600 mb-1">零件照片 (最多 3 張照片)</label>
                        <input type="file" id="add-images" accept="image/*" multiple onchange="previewImages(event, 'add-preview-container')" class="w-full text-xs text-slate-500 file:mr-3 file:py-2 file:px-4 file:rounded-lg file:border-0 file:text-xs file:font-semibold file:bg-blue-50 file:text-blue-700 hover:file:bg-blue-100 cursor-pointer">
                        <div id="add-preview-container" class="flex gap-2 mt-3 overflow-x-auto"></div>
                    </div>
                </div>

                <!-- 通用車型資訊 (可動態新增多組) -->
                <div class="bg-slate-50 p-4 rounded-xl border border-slate-200 space-y-4">
                    <div class="flex justify-between items-center border-b pb-2">
                        <h2 class="font-bold text-sm text-slate-700">🚘 綁定通用車型 (可填寫多台)</h2>
                        <button type="button" onclick="addVehicleRow('add-vehicles-container', 'add')" class="text-xs bg-blue-50 hover:bg-blue-100 text-blue-700 font-semibold px-3 py-1.5 rounded-lg border border-blue-200 transition">
                            ➕ 新增一台車型
                        </button>
                    </div>
                    
                    <!-- 動態車型列表容器 -->
                    <div id="add-vehicles-container" class="space-y-3">
                        <!-- 由 JavaScript 自動生成 -->
                    </div>
                </div>

                <button type="submit" id="submit-btn" class="w-full bg-emerald-600 hover:bg-emerald-700 active:bg-emerald-800 text-white font-medium py-3 rounded-xl shadow transition">
                    💾 儲存並同步至雲端資料庫
                </button>
            </form>
        </div>

    </div>

    <!-- ================= 3. 編輯零件彈出視窗 (Modal) ================= -->
    <div id="edit-modal" class="fixed inset-0 bg-slate-900/50 backdrop-blur-sm hidden items-center justify-center p-4 z-50">
        <div class="bg-white rounded-xl shadow-xl max-w-xl w-full p-6 space-y-4 max-h-[90vh] overflow-y-auto">
            <div class="flex justify-between items-center border-b pb-3">
                <h3 class="text-base font-bold text-slate-800">✏️ 編輯零件與通用車型資料</h3>
                <button onclick="closeEditModal()" class="text-slate-400 hover:text-slate-600 text-xl font-bold px-2">&times;</button>
            </div>
            
            <form id="edit-part-form" onsubmit="handleSaveEdit(event)" class="space-y-4">
                <input type="hidden" id="edit-id">
                
                <!-- 零件資訊區塊 -->
                <div class="space-y-3">
                    <h4 class="text-xs font-bold text-slate-500 uppercase tracking-wider">零件資訊</h4>
                    <div>
                        <label class="block text-xs font-semibold text-slate-600 mb-1">零件名稱 *</label>
                        <input type="text" id="edit-part-name" required class="w-full border rounded-lg p-2 text-sm">
                    </div>

                    <div class="grid grid-cols-2 gap-2">
                        <div>
                            <label class="block text-xs font-semibold text-slate-600 mb-1">品牌 *</label>
                            <input type="text" id="edit-brand-name" required class="w-full border rounded-lg p-2 text-sm">
                        </div>
                        <div>
                            <label class="block text-xs font-semibold text-slate-600 mb-1">零件料號 (選填)</label>
                            <input type="text" id="edit-part-number" class="w-full border rounded-lg p-2 text-sm font-mono">
                        </div>
                    </div>

                    <div>
                        <label class="block text-xs font-semibold text-slate-600 mb-1">前次進貨廠商 (選填)</label>
                        <input type="text" id="edit-supplier-name" class="w-full border rounded-lg p-2 text-sm">
                    </div>

                    <!-- 編輯價格與日期 -->
                    <div class="bg-slate-50 p-2.5 rounded-lg border border-slate-200 space-y-2">
                        <label class="block text-xs font-bold text-slate-700">💵 價格與成本紀錄</label>
                        <div class="grid grid-cols-3 gap-2">
                            <div>
                                <label class="block text-[10px] font-semibold text-slate-500 mb-1">進貨成本</label>
                                <input type="number" id="edit-cost" class="w-full border rounded-lg p-1.5 text-sm">
                            </div>
                            <div>
                                <label class="block text-[10px] font-semibold text-slate-500 mb-1">參考前價</label>
                                <input type="number" id="edit-price" class="w-full border rounded-lg p-1.5 text-sm">
                            </div>
                            <div>
                                <label class="block text-[10px] font-semibold text-slate-500 mb-1">前價日期</label>
                                <input type="date" id="edit-price-date" class="w-full border rounded-lg p-1.5 text-sm">
                            </div>
                        </div>
                    </div>

                    <!-- 編輯外觀尺寸 -->
                    <div class="bg-slate-50 p-2.5 rounded-lg border border-slate-200">
                        <label class="block text-xs font-bold text-slate-700 mb-1.5">📐 外觀尺寸 (mm)</label>
                        <div class="grid grid-cols-3 gap-2">
                            <div>
                                <label class="block text-[10px] font-semibold text-slate-500 mb-1">長</label>
                                <input type="number" id="edit-length" step="0.1" class="w-full border rounded-lg p-1.5 text-sm">
                            </div>
                            <div>
                                <label class="block text-[10px] font-semibold text-slate-500 mb-1">寬</label>
                                <input type="number" id="edit-width" step="0.1" class="w-full border rounded-lg p-1.5 text-sm">
                            </div>
                            <div>
                                <label class="block text-[10px] font-semibold text-slate-500 mb-1">高</label>
                                <input type="number" id="edit-height" step="0.1" class="w-full border rounded-lg p-1.5 text-sm">
                            </div>
                        </div>
                    </div>

                    <div>
                        <label class="block text-xs font-semibold text-slate-600 mb-1">備註說明</label>
                        <input type="text" id="edit-remarks" class="w-full border rounded-lg p-2 text-sm">
                    </div>

                    <!-- 編輯圖片區塊 -->
                    <div>
                        <label class="block text-xs font-semibold text-slate-600 mb-1">更新零件照片 (重新選擇會覆蓋舊照片)</label>
                        <input type="file" id="edit-images" accept="image/*" multiple onchange="previewImages(event, 'edit-preview-container')" class="w-full text-xs text-slate-500 file:mr-3 file:py-2 file:px-4 file:rounded-lg file:border-0 file:text-xs file:font-semibold file:bg-blue-50 file:text-blue-700 hover:file:bg-blue-100 cursor-pointer">
                        <div id="edit-preview-container" class="flex gap-2 mt-3 overflow-x-auto"></div>
                    </div>
                </div>

                <!-- 適用車型動態區塊 -->
                <div class="space-y-3 border-t pt-3">
                    <div class="flex justify-between items-center">
                        <h4 class="text-xs font-bold text-slate-500 uppercase tracking-wider">🚘 適用車型資料 (多台車)</h4>
                        <button type="button" onclick="addVehicleRow('edit-vehicles-container', 'edit')" class="text-xs bg-blue-50 hover:bg-blue-100 text-blue-700 font-semibold px-2.5 py-1 rounded border border-blue-200 transition">
                            ➕ 新增一台車型
                        </button>
                    </div>

                    <!-- 編輯頁面的動態車型列表容器 -->
                    <div id="edit-vehicles-container" class="space-y-3"></div>
                </div>

                <div class="flex justify-end gap-2 pt-3 border-t">
                    <button type="button" onclick="closeEditModal()" class="px-4 py-2 rounded-lg text-sm text-slate-600 hover:bg-slate-100 transition">取消</button>
                    <button type="submit" id="edit-submit-btn" class="px-4 py-2 bg-blue-600 hover:bg-blue-700 text-white rounded-lg text-sm font-medium shadow transition">💾 儲存修改</button>
                </div>
            </form>
        </div>
    </div>

    <!-- 圖片 Gallery Modal -->
    <div id="gallery-modal" class="fixed inset-0 bg-slate-900/80 backdrop-blur-sm hidden items-center justify-center p-4 z-50">
        <div class="bg-white rounded-xl shadow-xl max-w-2xl w-full p-4 space-y-4">
            <div class="flex justify-between items-center border-b pb-2">
                <h3 id="gallery-title" class="text-sm font-bold text-slate-800">🖼️ 零件照片</h3>
                <button onclick="closeGalleryModal()" class="text-slate-400 hover:text-slate-600 text-xl font-bold px-2">&times;</button>
            </div>
            <div id="gallery-container" class="grid grid-cols-1 md:grid-cols-3 gap-3 max-h-[75vh] overflow-y-auto p-2"></div>
        </div>
    </div>

    <!-- 大圖放大檢視 Modal -->
    <div id="image-modal" class="fixed inset-0 bg-slate-900/90 hidden items-center justify-center p-4 z-[60]" onclick="closeImageModal()">
        <img id="image-modal-img" src="" class="max-w-full max-h-[90vh] rounded-lg shadow-2xl object-contain">
    </div>

    <!-- ================= 4. JavaScript 邏輯程式碼 ================= -->
    <script>
        const SUPABASE_URL = 'https://zudcigogppwberpsdoiw.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_CFja31od0wDX-PEUBOGhcg_BEX8cTbo';
        const STORAGE_BUCKET = 'part-images';
        
        const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        let currentResultsCache = [];
        let allVehiclesCache = [];

        document.addEventListener('DOMContentLoaded', () => {
            initVehicleDropdowns();
            initEnterKeyNavigation();
            addVehicleRow('add-vehicles-container', 'add');
        });

        function createVehicleRowHTML(prefix, v = {}) {
            return `
                <div class="vehicle-row bg-white p-3 rounded-xl border border-slate-200 relative space-y-2 shadow-sm">
                    <button type="button" onclick="removeVehicleRow(this)" class="absolute top-2 right-2 text-red-500 hover:text-red-700 hover:bg-red-50 text-xs font-bold px-2 py-1 rounded border border-transparent hover:border-red-200 transition">
                        🗑️ 刪除
                    </button>
                    
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-3 pr-14">
                        <div>
                            <label class="block text-xs font-semibold text-slate-600 mb-1">車廠 *</label>
                            <input type="text" class="${prefix}-v-brand w-full border rounded-lg p-2 text-sm" required placeholder="例: BMW" value="${v.brand || ''}">
                        </div>
                        <div>
                            <label class="block text-xs font-semibold text-slate-600 mb-1">底盤/車型 *</label>
                            <input type="text" class="${prefix}-v-model w-full border rounded-lg p-2 text-sm" required placeholder="例: E36" value="${v.model || ''}">
                        </div>
                    </div>

                    <div class="grid grid-cols-2 md:grid-cols-4 gap-2">
                        <div>
                            <label class="block text-xs font-semibold text-slate-600 mb-1">起始年份 *</label>
                            <input type="number" class="${prefix}-v-start w-full border rounded-lg p-2 text-sm" required placeholder="例: 1992" value="${v.start_year || ''}">
                        </div>
                        <div>
                            <label class="block text-xs font-semibold text-slate-600 mb-1">起始月份</label>
                            <input type="number" min="1" max="12" class="${prefix}-v-start-m w-full border rounded-lg p-2 text-sm" placeholder="1-12" value="${v.start_month || ''}">
                        </div>
                        <div>
                            <label class="block text-xs font-semibold text-slate-600 mb-1">結束年份 *</label>
                            <input type="number" class="${prefix}-v-end w-full border rounded-lg p-2 text-sm" required placeholder="例: 1998" value="${v.end_year || ''}">
                        </div>
                        <div>
                            <label class="block text-xs font-semibold text-slate-600 mb-1">結束月份</label>
                            <input type="number" min="1" max="12" class="${prefix}-v-end-m w-full border rounded-lg p-2 text-sm" placeholder="1-12" value="${v.end_month || ''}">
                        </div>
                    </div>
                </div>
            `;
        }

        function addVehicleRow(containerId, prefix, vData = {}) {
            const container = document.getElementById(containerId);
            const wrapper = document.createElement('div');
            wrapper.innerHTML = createVehicleRowHTML(prefix, vData);
            container.appendChild(wrapper.firstElementChild);
        }

        function removeVehicleRow(btn) {
            const container = btn.closest('.vehicle-row').parentElement;
            if (container.querySelectorAll('.vehicle-row').length <= 1) {
                alert('⚠️ 至少需要保留一組通用車型資料！');
                return;
            }
            btn.closest('.vehicle-row').remove();
        }

        async function getOrCreateVehicleIds(containerId, prefix) {
            const container = document.getElementById(containerId);
            const rows = container.querySelectorAll('.vehicle-row');
            const vehicleIds = [];

            for (const row of rows) {
                const brand = row.querySelector(`.${prefix}-v-brand`).value.trim();
                const model = row.querySelector(`.${prefix}-v-model`).value.trim();
                const startYear = parseInt(row.querySelector(`.${prefix}-v-start`).value);
                const startMonth = parseInt(row.querySelector(`.${prefix}-v-start-m`).value) || null;
                const endYear = parseInt(row.querySelector(`.${prefix}-v-end`).value);
                const endMonth = parseInt(row.querySelector(`.${prefix}-v-end-m`).value) || null;

                if (!brand || !model || isNaN(startYear) || isNaN(endYear)) continue;

                const { data: existingVehicle } = await _supabase
                    .from('vehicles')
                    .select('id')
                    .eq('brand', brand)
                    .eq('model', model)
                    .eq('start_year', startYear)
                    .eq('end_year', endYear)
                    .maybeSingle();

                if (existingVehicle) {
                    vehicleIds.push(existingVehicle.id);
                } else {
                    const { data: newVehicle, error: vError } = await _supabase
                        .from('vehicles')
                        .insert([{
                            brand: brand,
                            model: model,
                            start_year: startYear,
                            start_month: startMonth,
                            end_year: endYear,
                            end_month: endMonth
                        }])
                        .select();

                    if (vError) throw vError;
                    vehicleIds.push(newVehicle[0].id);
                }
            }

            return [...new Set(vehicleIds)];
        }

        function initEnterKeyNavigation() {
            document.addEventListener('keydown', (e) => {
                if (e.key === 'Enter') {
                    const activeEl = document.activeElement;
                    if (activeEl && activeEl.tagName === 'INPUT' && activeEl.type !== 'button' && activeEl.type !== 'submit' && activeEl.type !== 'file') {
                        e.preventDefault();
                        const container = activeEl.closest('form') || activeEl.closest('#tab-search');
                        if (!container) return;

                        const focusables = Array.from(
                            container.querySelectorAll('input:not([type="hidden"]):not([disabled]), button:not([disabled])')
                        ).filter(el => el.offsetWidth > 0 || el.offsetHeight > 0);

                        const currentIndex = focusables.indexOf(activeEl);
                        if (currentIndex > -1 && currentIndex < focusables.length - 1) {
                            const nextEl = focusables[currentIndex + 1];
                            nextEl.focus();
                            if (nextEl.tagName === 'INPUT' && typeof nextEl.select === 'function') {
                                nextEl.select();
                            }
                        }
                    }
                }
            });
        }

        function clearSearchInputs() {
            document.getElementById('search-brand').value = '';
            document.getElementById('search-model').value = '';
            document.getElementById('search-year').value = '';
            document.getElementById('search-part').value = '';
            updateModelDatalist('');
            document.getElementById('results').innerHTML = '<p class="text-slate-400 text-sm text-center py-6">請輸入條件並點擊上方按鈕。</p>';
            currentResultsCache = [];
        }

        function previewImages(event, containerId) {
            const container = document.getElementById(containerId);
            container.innerHTML = '';
            const files = Array.from(event.target.files).slice(0, 3);

            files.forEach(file => {
                const reader = new FileReader();
                reader.onload = (e) => {
                    const img = document.createElement('img');
                    img.src = e.target.result;
                    img.className = 'w-20 h-20 object-cover rounded-lg border border-slate-200 shadow-sm cursor-pointer';
                    img.onclick = () => openImageModal(e.target.result);
                    container.appendChild(img);
                };
                reader.readAsDataURL(file);
            });
        }

        async function uploadImages(fileInputId) {
            const fileInput = document.getElementById(fileInputId);
            const files = Array.from(fileInput.files).slice(0, 3);
            if (files.length === 0) return [null, null, null];

            const uploadedUrls = [null, null, null];

            for (let i = 0; i < files.length; i++) {
                const file = files[i];
                const fileExt = file.name.split('.').pop();
                const fileName = `${Date.now()}_${Math.random().toString(36).substring(2, 7)}.${fileExt}`;
                const filePath = `parts/${fileName}`;

                const { error: uploadError } = await _supabase.storage
                    .from(STORAGE_BUCKET)
                    .upload(filePath, file);

                if (uploadError) {
                    console.error('圖片上傳失敗:', uploadError);
                    continue;
                }

                const { data } = _supabase.storage
                    .from(STORAGE_BUCKET)
                    .getPublicUrl(filePath);

                uploadedUrls[i] = data.publicUrl;
            }

            return uploadedUrls;
        }

        async function initVehicleDropdowns() {
            try {
                const { data, error } = await _supabase
                    .from('vehicles')
                    .select('brand, model');

                if (error) throw error;

                allVehiclesCache = data || [];
                const uniqueBrands = [...new Set(allVehiclesCache.map(v => v.brand).filter(Boolean))];
                document.getElementById('brand-list').innerHTML = uniqueBrands.map(b => `<option value="${b}">`).join('');
                updateModelDatalist();
            } catch (err) {
                console.error('初始化車型選單失敗:', err);
            }
        }

        function handleBrandChange() {
            const selectedBrand = document.getElementById('search-brand').value.trim().toLowerCase();
            document.getElementById('search-model').value = '';
            updateModelDatalist(selectedBrand);
        }

        function updateModelDatalist(filterBrand = '') {
            let filtered = allVehiclesCache;
            if (filterBrand) {
                filtered = allVehiclesCache.filter(v => v.brand.toLowerCase() === filterBrand);
            }
            const uniqueModels = [...new Set(filtered.map(v => v.model).filter(Boolean))];
            document.getElementById('model-list').innerHTML = uniqueModels.map(m => `<option value="${m}">`).join('');
        }

        function switchTab(tab) {
            document.getElementById('tab-search').className = tab === 'search' ? 'block' : 'hidden';
            document.getElementById('tab-add').className = tab === 'add' ? 'block' : 'hidden';
            
            document.getElementById('tab-search-btn').className = tab === 'search' 
                ? 'pb-2 border-b-2 border-blue-600 font-semibold text-blue-600 transition' 
                : 'pb-2 font-semibold text-slate-500 hover:text-slate-800 transition';
            document.getElementById('tab-add-btn').className = tab === 'add' 
                ? 'pb-2 border-b-2 border-blue-600 font-semibold text-blue-600 transition' 
                : 'pb-2 font-semibold text-slate-500 hover:text-slate-800 transition';
        }

        function formatYearMonth(year, month) {
            if (!year) return '';
            if (!month) return `${year}`;
            return `${year}/${String(month).padStart(2, '0')}`;
        }

        function formatDimensions(l, w, h) {
            if (l !== null && l !== undefined && w !== null && w !== undefined && h !== null && h !== undefined) {
                return `${l} × ${w} × ${h} mm`;
            }
            const parts = [];
            if (l !== null && l !== undefined) parts.push(`長:${l}`);
            if (w !== null && w !== undefined) parts.push(`寬:${w}`);
            if (h !== null && h !== undefined) parts.push(`高:${h}`);
            return parts.length > 0 ? parts.join(' / ') + ' mm' : null;
        }

        async function searchParts() {
            const searchBrand = document.getElementById('search-brand').value.trim().toLowerCase();
            const searchModel = document.getElementById('search-model').value.trim().toLowerCase();
            const year = parseInt(document.getElementById('search-year').value);
            const rawPartInput = document.getElementById('search-part').value.trim();
            const resultsContainer = document.getElementById('results');

            resultsContainer.innerHTML = '<p class="text-slate-500 text-sm text-center py-6">🔍 正在向 Supabase 檢索資料...</p>';

            const keywords = rawPartInput.split(/[,，\s\n、]+/).map(k => k.trim()).filter(k => k.length > 0);

            let query = _supabase.from('parts').select(`
                id, part_name, brand_name, part_number, price, price_date, cost, supplier_name, remarks, length, width, height, image_1, image_2, image_3,
                part_vehicles (
                    vehicles ( brand, model, start_year, start_month, end_year, end_month )
                )
            `);

            if (keywords.length > 0) {
                const orConditions = keywords.map(k => `part_name.ilike.%${k}%`).join(',');
                query = query.or(orConditions);
            }

            const { data, error } = await query;

            if (error) {
                resultsContainer.innerHTML = `<p class="text-red-500 text-sm text-center py-4">❌ 查詢失敗：${error.message}</p>`;
                return;
            }

            const filteredData = data.filter(item => {
                const vehicleList = item.part_vehicles.map(pv => pv.vehicles).filter(Boolean);
                if (!searchBrand && !searchModel && !year) return true;

                return vehicleList.some(v => {
                    const matchBrand = !searchBrand || v.brand.toLowerCase().includes(searchBrand);
                    const matchModel = !searchModel || v.model.toLowerCase().includes(searchModel);
                    const matchYear = !year || (year >= v.start_year && year <= v.end_year);
                    return matchBrand && matchModel && matchYear;
                });
            });

            renderResults(filteredData);
        }

        function renderResults(list) {
            currentResultsCache = list;
            const resultsContainer = document.getElementById('results');

            if (list.length === 0) {
                resultsContainer.innerHTML = `<p class="text-amber-600 text-sm text-center py-6 bg-amber-50 rounded-xl border border-amber-200">查無符合條件的零件資料。</p>`;
                return;
            }

            resultsContainer.innerHTML = list.map(item => {
                const allVehicles = item.part_vehicles.map(pv => pv.vehicles).filter(Boolean);
                const images = [item.image_1, item.image_2, item.image_3].filter(Boolean);
                const dimText = formatDimensions(item.length, item.width, item.height);
                
                return `
                    <div class="border border-slate-200 rounded-xl p-4 bg-white shadow-sm hover:border-blue-300 transition">
                        <div class="flex justify-between items-start gap-2 mb-2">
                            <div>
                                <span class="inline-block px-2.5 py-0.5 text-xs font-bold rounded-full bg-blue-100 text-blue-800">
                                    ${item.brand_name}
                                </span>
                                <h3 class="text-base font-bold text-slate-800 mt-1.5">${item.part_name}</h3>
                            </div>
                            <div class="text-right whitespace-nowrap space-y-1">
                                <span class="text-[10px] text-slate-400 block">參考前價</span>
                                <span class="text-base font-extrabold text-emerald-600 block">${item.price ? 'NT$ ' + Number(item.price).toLocaleString() : '未填寫'}</span>
                                ${item.price_date ? `<span class="text-[10px] text-slate-400 block">🗓️ ${item.price_date}</span>` : ''}
                                
                                <div class="flex gap-1.5 justify-end pt-1">
                                    ${images.length > 0 ? `
                                        <button onclick="openGalleryModal(${item.id})" class="inline-flex items-center gap-1 text-xs bg-emerald-50 hover:bg-emerald-100 text-emerald-700 px-2 py-1 rounded border border-emerald-200 transition font-medium">
                                            🖼️ 照片 (${images.length})
                                        </button>
                                    ` : ''}
                                    <button onclick="openEditModalById(${item.id})" class="inline-flex items-center gap-1 text-xs bg-slate-100 hover:bg-blue-50 text-blue-600 hover:text-blue-700 px-2 py-1 rounded border border-slate-200 transition font-medium">
                                        ✏️ 編輯
                                    </button>
                                    <button onclick="deletePart(${item.id})" class="inline-flex items-center gap-1 text-xs bg-red-50 hover:bg-red-100 text-red-600 hover:text-red-700 px-2 py-1 rounded border border-red-200 transition font-medium">
                                        🗑️ 刪除
                                    </button>
                                </div>
                            </div>
                        </div>

                        <div class="text-xs text-slate-600 mb-2 flex flex-wrap gap-2 items-center">
                            <span>料號：<span class="font-mono bg-slate-100 px-2 py-0.5 rounded font-bold text-slate-800 border">${item.part_number ? item.part_number : '未提供'}</span></span>
                            ${item.cost ? `<span class="bg-amber-50 text-amber-800 px-2 py-0.5 rounded border border-amber-200 text-[11px] font-semibold">💰 成本: NT$ ${Number(item.cost).toLocaleString()}</span>` : ''}
                            ${item.supplier_name ? `<span class="bg-purple-50 text-purple-700 px-2 py-0.5 rounded border border-purple-200 text-[11px] font-semibold">🏭 廠商: ${item.supplier_name}</span>` : ''}
                            ${dimText ? `<span class="bg-blue-50 text-blue-700 px-2 py-0.5 rounded border border-blue-200 font-mono text-[11px] font-semibold">📐 ${dimText}</span>` : ''}
                        </div>

                        ${item.remarks ? `
                            <div class="text-xs text-slate-600 mb-3 bg-slate-50 p-2 rounded-md border border-slate-100">
                                <span class="font-bold text-slate-500">📝 備註：</span>${item.remarks}
                            </div>
                        ` : ''}

                        <div class="border-t border-slate-100 pt-2.5">
                            <span class="text-[11px] font-bold text-slate-400 block mb-1.5">🔗 通用車型清單 (${allVehicles.length} 台)：</span>
                            <div class="flex flex-wrap gap-1.5">
                                ${allVehicles.map(v => `
                                    <span class="text-xs bg-slate-100 text-slate-700 px-2 py-0.5 rounded-md border border-slate-200">
                                        ${v.brand} ${v.model} (${formatYearMonth(v.start_year, v.start_month)} - ${formatYearMonth(v.end_year, v.end_month)})
                                    </span>
                                `).join('')}
                            </div>
                        </div>
                    </div>
                `;
            }).join('');
        }

        // 刪除零件功能
        async function deletePart(id) {
            const item = currentResultsCache.find(p => p.id === id);
            const partName = item ? item.part_name : '該零件';

            if (!confirm(`⚠️ 確定要刪除「${partName}」嗎？\n這將會移除此零件的所有通用車型綁定，此動作無法復原！`)) {
                return;
            }

            try {
                // 1. 刪除關聯車型對應
                await _supabase.from('part_vehicles').delete().eq('part_id', id);

                // 2. 刪除零件主檔
                const { error } = await _supabase.from('parts').delete().eq('id', id);

                if (error) throw error;

                alert('✅ 零件資料已成功刪除！');
                initVehicleDropdowns();
                searchParts();
            } catch (err) {
                alert('❌ 刪除失敗：' + err.message);
            }
        }

        function openGalleryModal(id) {
            const item = currentResultsCache.find(p => p.id === id);
            if (!item) return;

            const images = [item.image_1, item.image_2, item.image_3].filter(Boolean);
            const container = document.getElementById('gallery-container');
            document.getElementById('gallery-title').innerText = `🖼️ ${item.part_name} - 零件照片 (${images.length} 張)`;

            container.innerHTML = images.map(url => `
                <div class="border rounded-lg p-1 bg-slate-50 flex items-center justify-center">
                    <img src="${url}" onclick="openImageModal('${url}')" class="max-h-52 w-full object-contain rounded cursor-pointer hover:opacity-90 transition">
                </div>
            `).join('');

            const modal = document.getElementById('gallery-modal');
            modal.classList.remove('hidden');
            modal.classList.add('flex');
        }

        function closeGalleryModal() {
            const modal = document.getElementById('gallery-modal');
            modal.classList.remove('flex');
            modal.classList.add('hidden');
        }

        function openImageModal(url) {
            document.getElementById('image-modal-img').src = url;
            const modal = document.getElementById('image-modal');
            modal.classList.remove('hidden');
            modal.classList.add('flex');
        }

        function closeImageModal() {
            const modal = document.getElementById('image-modal');
            modal.classList.remove('flex');
            modal.classList.add('hidden');
        }

        function openEditModalById(id) {
            const item = currentResultsCache.find(p => p.id === id);
            if (!item) return;

            document.getElementById('edit-id').value = item.id;
            document.getElementById('edit-part-name').value = item.part_name || '';
            document.getElementById('edit-brand-name').value = item.brand_name || '';
            document.getElementById('edit-part-number').value = item.part_number || '';
            document.getElementById('edit-supplier-name').value = item.supplier_name || '';
            
            document.getElementById('edit-cost').value = item.cost !== null ? item.cost : '';
            document.getElementById('edit-price').value = item.price !== null ? item.price : '';
            document.getElementById('edit-price-date').value = item.price_date || '';
            document.getElementById('edit-remarks').value = item.remarks || '';

            document.getElementById('edit-length').value = item.length !== null && item.length !== undefined ? item.length : '';
            document.getElementById('edit-width').value = item.width !== null && item.width !== undefined ? item.width : '';
            document.getElementById('edit-height').value = item.height !== null && item.height !== undefined ? item.height : '';

            const previewContainer = document.getElementById('edit-preview-container');
            previewContainer.innerHTML = '';
            const existingImages = [item.image_1, item.image_2, item.image_3].filter(Boolean);
            existingImages.forEach(url => {
                const img = document.createElement('img');
                img.src = url;
                img.className = 'w-20 h-20 object-cover rounded-lg border border-slate-200 shadow-sm cursor-pointer';
                img.onclick = () => openImageModal(url);
                previewContainer.appendChild(img);
            });

            const editVehiclesContainer = document.getElementById('edit-vehicles-container');
            editVehiclesContainer.innerHTML = '';
            const vehicles = item.part_vehicles.map(pv => pv.vehicles).filter(Boolean);

            if (vehicles.length > 0) {
                vehicles.forEach(v => addVehicleRow('edit-vehicles-container', 'edit', v));
            } else {
                addVehicleRow('edit-vehicles-container', 'edit');
            }

            const modal = document.getElementById('edit-modal');
            modal.classList.remove('hidden');
            modal.classList.add('flex');
        }

        function closeEditModal() {
            const modal = document.getElementById('edit-modal');
            modal.classList.remove('flex');
            modal.classList.add('hidden');
        }

        async function handleSaveEdit(e) {
            e.preventDefault();

            const submitBtn = document.getElementById('edit-submit-btn');
            submitBtn.disabled = true;
            submitBtn.innerText = '⏳ 正在更新與同步車型...';

            const id = document.getElementById('edit-id').value;
            const partName = document.getElementById('edit-part-name').value.trim();
            const brandName = document.getElementById('edit-brand-name').value.trim();
            const partNumber = document.getElementById('edit-part-number').value.trim() || null;
            const supplierName = document.getElementById('edit-supplier-name').value.trim() || null;
            
            const cost = parseFloat(document.getElementById('edit-cost').value) || null;
            const price = parseFloat(document.getElementById('edit-price').value) || null;
            const priceDate = document.getElementById('edit-price-date').value || null;
            const remarks = document.getElementById('edit-remarks').value.trim() || null;

            const length = document.getElementById('edit-length').value ? parseFloat(document.getElementById('edit-length').value) : null;
            const width = document.getElementById('edit-width').value ? parseFloat(document.getElementById('edit-width').value) : null;
            const height = document.getElementById('edit-height').value ? parseFloat(document.getElementById('edit-height').value) : null;

            try {
                const [img1, img2, img3] = await uploadImages('edit-images');

                const updatePayload = {
                    part_name: partName,
                    brand_name: brandName,
                    part_number: partNumber,
                    supplier_name: supplierName,
                    cost: cost,
                    price: price,
                    price_date: priceDate,
                    remarks: remarks,
                    length: length,
                    width: width,
                    height: height
                };

                if (img1 || img2 || img3) {
                    updatePayload.image_1 = img1;
                    updatePayload.image_2 = img2;
                    updatePayload.image_3 = img3;
                }

                const { error: partError } = await _supabase.from('parts').update(updatePayload).eq('id', id);
                if (partError) throw partError;

                const vehicleIds = await getOrCreateVehicleIds('edit-vehicles-container', 'edit');
                await _supabase.from('part_vehicles').delete().eq('part_id', id);

                if (vehicleIds.length > 0) {
                    const mappings = vehicleIds.map(vId => ({ part_id: id, vehicle_id: vId }));
                    const { error: mapError } = await _supabase.from('part_vehicles').insert(mappings);
                    if (mapError) throw mapError;
                }

                alert('✅ 零件與多台通用車型資料更新成功！');
                closeEditModal();
                initVehicleDropdowns();
                searchParts();
            } catch (err) {
                alert('❌ 更新失敗：' + err.message);
            } finally {
                submitBtn.disabled = false;
                submitBtn.innerText = '💾 儲存修改';
            }
        }

        async function handleAddPart(e) {
            e.preventDefault();

            const submitBtn = document.getElementById('submit-btn');
            submitBtn.disabled = true;
            submitBtn.innerText = '⏳ 正在建立零件與關聯車型...';

            const partName = document.getElementById('add-part-name').value.trim();
            const brandName = document.getElementById('add-brand-name').value.trim();
            const partNumber = document.getElementById('add-part-number').value.trim() || null;
            const supplierName = document.getElementById('add-supplier-name').value.trim() || null;

            const cost = parseFloat(document.getElementById('add-cost').value) || null;
            const price = parseFloat(document.getElementById('add-price').value) || null;
            const priceDate = document.getElementById('add-price-date').value || null;
            const remarks = document.getElementById('add-remarks').value.trim() || null;

            const length = document.getElementById('add-length').value ? parseFloat(document.getElementById('add-length').value) : null;
            const width = document.getElementById('add-width').value ? parseFloat(document.getElementById('add-width').value) : null;
            const height = document.getElementById('add-height').value ? parseFloat(document.getElementById('add-height').value) : null;

            try {
                const [img1, img2, img3] = await uploadImages('add-images');

                const { data: partData, error: partError } = await _supabase
                    .from('parts')
                    .insert([{
                        part_name: partName,
                        brand_name: brandName,
                        part_number: partNumber,
                        supplier_name: supplierName,
                        cost: cost,
                        price: price,
                        price_date: priceDate,
                        remarks: remarks,
                        length: length,
                        width: width,
                        height: height,
                        image_1: img1,
                        image_2: img2,
                        image_3: img3
                    }])
                    .select();

                if (partError) throw partError;
                const newPartId = partData[0].id;

                const vehicleIds = await getOrCreateVehicleIds('add-vehicles-container', 'add');

                if (vehicleIds.length > 0) {
                    const mappings = vehicleIds.map(vId => ({ part_id: newPartId, vehicle_id: vId }));
                    const { error: mapError } = await _supabase.from('part_vehicles').insert(mappings);
                    if (mapError) throw mapError;
                }

                alert('✅ 零件與通用車型資料儲存成功！');
                document.getElementById('add-part-form').reset();
                document.getElementById('add-preview-container').innerHTML = '';
                document.getElementById('add-vehicles-container').innerHTML = '';
                addVehicleRow('add-vehicles-container', 'add');
                
                initVehicleDropdowns();
                switchTab('search');
                document.getElementById('search-part').value = partName;
                searchParts();

            } catch (err) {
                alert('❌ 儲存失敗：' + err.message);
            } finally {
                submitBtn.disabled = false;
                submitBtn.innerText = '💾 儲存並同步至雲端資料庫';
            }
        }
    </script>
</body>
