<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HW零件資料庫</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        /* 自訂浮動建議清單樣式，確保手機網頁版能完美下拉與點擊 */
        .suggestions-dropdown {
            position: absolute;
            z-index: 50;
            background: white;
            border: 1px solid #cbd5e1;
            border-radius: 0.5rem;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
            max-height: 12rem;
            overflow-y: auto;
            width: 100%;
            left: 0;
            margin-top: 2px;
        }
        .suggestion-item {
            padding: 0.5rem 0.75rem;
            font-size: 0.875rem;
            color: #334155;
            cursor: pointer;
        }
        .suggestion-item:hover {
            background-color: #f1f5f9;
            color: #2563eb;
        }
    </style>
</head>
<body class="bg-slate-100 min-h-screen p-3 md:p-8 text-slate-800">

    <!-- 全域歷史選單 DataLists -->
    <datalist id="part-name-list"></datalist>
    <datalist id="part-brand-list"></datalist>
    <datalist id="supplier-list"></datalist>
    <datalist id="vehicle-type-list"></datalist>
    <datalist id="brand-list"></datalist>
    <datalist id="model-list"></datalist>
    <datalist id="add-model-list"></datalist>

    <div class="max-w-5xl mx-auto bg-white rounded-xl shadow-md overflow-hidden p-4 md:p-6">
        <!-- 頂部標題與連線狀態 -->
        <h1 class="text-xl md:text-2xl font-bold text-slate-800 mb-4 border-b pb-3 flex items-center justify-between">
            <span class="flex items-center gap-2">❄️HW零件管理系統</span>
            <span class="text-xs font-normal text-emerald-600 bg-emerald-50 px-2.5 py-1 rounded-full border border-emerald-200 flex items-center gap-1">
                <span class="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></span> 雲端同步中
            </span>
        </h1>

        <!-- 功能頁籤切換按鈕 -->
        <div class="flex gap-4 border-b mb-6">
            <button id="tab-search-btn" onclick="switchTab('search')" class="pb-2 border-b-2 border-blue-600 font-semibold text-blue-600 transition">
                🔍 零件與配套組合查詢
            </button>
            <button id="tab-add-btn" onclick="switchTab('add')" class="pb-2 font-semibold text-slate-500 hover:text-slate-800 transition">
                ➕ 建立新零件與配套關聯
            </button>
        </div>

        <!-- ================= 1. 查詢分頁 ================= -->
        <div id="tab-search" class="block">

            <!-- 複合搜尋條件 (雙向連動綁定) -->
            <div class="grid grid-cols-1 md:grid-cols-6 gap-3 mb-4 bg-slate-50 p-4 rounded-xl border border-slate-200">
                
                <!-- 車種類別 -->
                <div class="relative">
                    <label class="block text-xs font-semibold text-slate-600 mb-1">🚜 車種類別</label>
                    <input type="text" id="search-vehicle-type" list="vehicle-type-list" placeholder="手動輸入或選擇..." 
                           oninput="triggerTwoWaySync(); showSuggestions('search-vehicle-type', 'vehicle-type-list', 'search-vtype-suggestions')" 
                           onfocus="showSuggestions('search-vehicle-type', 'vehicle-type-list', 'search-vtype-suggestions')"
                           class="w-full border rounded-lg p-2 text-sm focus:ring-2 focus:ring-blue-500 outline-none bg-white">
                    <div id="search-vtype-suggestions" class="suggestions-dropdown hidden"></div>
                </div>

                <!-- 車廠 / 品牌 -->
                <div class="relative">
                    <label class="block text-xs font-semibold text-slate-600 mb-1">車廠 / 品牌</label>
                    <input type="text" id="search-brand" list="brand-list" placeholder="選擇或輸入品牌..." 
                           oninput="handleBrandChange(); triggerTwoWaySync(); showSuggestions('search-brand', 'brand-list', 'search-brand-suggestions')" 
                           onfocus="showSuggestions('search-brand', 'brand-list', 'search-brand-suggestions')"
                           class="w-full border rounded-lg p-2 text-sm focus:ring-2 focus:ring-blue-500 outline-none bg-white">
                    <div id="search-brand-suggestions" class="suggestions-dropdown hidden"></div>
                </div>

                <!-- 底盤號 / 車型 -->
                <div class="relative">
                    <label class="block text-xs font-semibold text-slate-600 mb-1">底盤號 / 車型</label>
                    <input type="text" id="search-model" list="model-list" placeholder="例: W246 / E36" 
                           oninput="triggerTwoWaySync(); showSuggestions('search-model', 'model-list', 'search-model-suggestions')" 
                           onfocus="showSuggestions('search-model', 'model-list', 'search-model-suggestions')"
                           class="w-full border rounded-lg p-2 text-sm focus:ring-2 focus:ring-blue-500 outline-none bg-white">
                    <div id="search-model-suggestions" class="suggestions-dropdown hidden"></div>
                </div>

                <div>
                    <label class="block text-xs font-semibold text-slate-600 mb-1">年份 (出廠/適用)</label>
                    <input type="number" id="search-year" placeholder="例: 2015" oninput="triggerTwoWaySync()" class="w-full border rounded-lg p-2 text-sm focus:ring-2 focus:ring-blue-500 outline-none bg-white">
                </div>

                <!-- 零件名稱點擊複選區域 (雙向連動 Chips) -->
                <div class="md:col-span-2">
                    <div class="flex justify-between items-center mb-1">
                        <label class="block text-xs font-semibold text-slate-600">📦 零件名稱 (點擊複選篩選)</label>
                        <button type="button" onclick="clearSelectedParts()" class="text-[11px] text-blue-600 hover:underline">清除選取</button>
                    </div>
                    <div id="part-chips-container" class="flex flex-wrap gap-1.5 p-2 bg-white border border-slate-200 rounded-lg min-h-[4.5rem] max-h-24 overflow-y-auto">
                        <span class="text-xs text-slate-400">載入歷史零件中...</span>
                    </div>
                </div>

                <!-- 料號與關聯對照關鍵字 -->
                <div class="md:col-span-6 border-t pt-2 mt-1">
                    <label class="block text-xs font-semibold text-slate-600 mb-1">🔍 本廠 / OEM / 廠商料號 / 可替料號 / 配套零件關鍵字搜尋</label>
                    <input type="text" id="search-keyword" placeholder="輸入料號例: DCP05001 / 2477 / 膨脹閥 (按 Enter 可直接查詢)" onkeydown="if(event.key==='Enter') searchParts()" class="w-full border rounded-lg p-2 text-sm focus:ring-2 focus:ring-blue-500 outline-none bg-white">
                </div>
            </div>

            <!-- 操作按鈕區 -->
            <div class="flex flex-col md:flex-row gap-3 mb-4">
                <button onclick="searchParts()" class="flex-1 bg-blue-600 hover:bg-blue-700 active:bg-blue-800 text-white font-medium py-2.5 rounded-lg shadow transition flex items-center justify-center gap-1">
                    🔍 執行綜合查詢
                </button>
                <button onclick="copyQuote()" class="bg-emerald-600 hover:bg-emerald-700 active:bg-emerald-800 text-white font-medium px-5 py-2.5 rounded-lg shadow transition flex items-center justify-center gap-1 whitespace-nowrap">
                    📋 複製報價與前價清單 (指定格式)
                </button>
                <button onclick="clearSearchInputs()" class="bg-slate-200 hover:bg-slate-300 active:bg-slate-400 text-slate-700 font-medium px-5 py-2.5 rounded-lg shadow-sm transition">
                    🧹 清除條件
                </button>
            </div>

            <!-- 🚀 批次管理工具列 -->
            <div class="flex items-center justify-between bg-slate-100 p-2.5 rounded-xl border border-slate-200 mb-4">
                <div class="flex items-center gap-2">
                    <input type="checkbox" id="select-all-checkbox" onclick="toggleSelectAll(this)" class="w-4 h-4 rounded text-blue-600 cursor-pointer">
                    <label for="select-all-checkbox" class="text-xs font-bold text-slate-700 cursor-pointer">全選目前頁面項目</label>
                </div>
                <button onclick="batchDeleteParts()" class="bg-red-50 hover:bg-red-100 text-red-600 border border-red-200 text-xs font-bold px-3 py-1.5 rounded-lg transition flex items-center gap-1">
                    🗑️ 批次刪除選取項目
                </button>
            </div>

            <!-- 結果顯示專區 -->
            <div id="results" class="space-y-4">
                <p class="text-slate-400 text-sm text-center py-6">請選擇查詢條件進行查詢。</p>
            </div>
        </div>

        <!-- ================= 2. 新增零件與配套組合分頁 ================= -->
        <div id="tab-add" class="hidden">
            <form id="add-part-form" onsubmit="handleAddPart(event)" class="space-y-4 max-w-3xl mx-auto">
                <div class="bg-slate-50 p-4 rounded-xl border border-slate-200 space-y-4">
                    <h2 class="font-bold text-sm text-slate-700 border-b pb-2 flex items-center gap-1">
                        📦 基本零件主檔與品牌
                    </h2>
                    
                    <div class="grid grid-cols-1 md:grid-cols-3 gap-3">
                        <div class="relative">
                            <label class="block text-xs font-semibold text-slate-600 mb-1">零件名稱 *</label>
                            <input type="text" id="add-part-name" list="part-name-list" required placeholder="可自由輸入 (例: 風箱 / 壓縮機)" 
                                   oninput="showSuggestions('add-part-name', 'part-name-list', 'add-pname-suggestions')"
                                   onfocus="showSuggestions('add-part-name', 'part-name-list', 'add-pname-suggestions')"
                                   class="w-full border rounded-lg p-2 text-sm bg-white">
                            <div id="add-pname-suggestions" class="suggestions-dropdown hidden"></div>
                        </div>
                        <div class="relative">
                            <label class="block text-xs font-semibold text-slate-600 mb-1">零件品牌/製造商 *</label>
                            <input type="text" id="add-brand-name" list="part-brand-list" required placeholder="可自由輸入 (例: 正廠 / Denso)" 
                                   oninput="showSuggestions('add-brand-name', 'part-brand-list', 'add-pbrand-suggestions')"
                                   onfocus="showSuggestions('add-brand-name', 'part-brand-list', 'add-pbrand-suggestions')"
                                   class="w-full border rounded-lg p-2 text-sm bg-white">
                            <div id="add-pbrand-suggestions" class="suggestions-dropdown hidden"></div>
                        </div>
                        <div>
                            <label class="block text-xs font-semibold text-slate-600 mb-1">產品產地 (選填)</label>
                            <input type="text" id="add-origin" placeholder="例: 台灣 / 日本 / 中國" class="w-full border rounded-lg p-2 text-sm bg-white">
                        </div>
                    </div>

                    <div class="grid grid-cols-1 md:grid-cols-2 gap-3">
                        <div>
                            <label class="block text-xs font-semibold text-slate-600 mb-1">本廠/主要零件料號 *</label>
                            <input type="text" id="add-part-number" required placeholder="例如: DCP05001" class="w-full border rounded-lg p-2 text-sm font-mono font-bold text-blue-900 bg-white">
                        </div>
                        <div>
                            <label class="block text-xs font-semibold text-slate-600 mb-1">原廠 OEM 料號 (選填)</label>
                            <input type="text" id="add-oem-number" placeholder="例如: 64528385915" class="w-full border rounded-lg p-2 text-sm font-mono bg-white">
                        </div>
                    </div>

                    <!-- 長寬高尺寸欄位 -->
                    <div class="bg-white p-3 rounded-lg border border-slate-200">
                        <label class="block text-xs font-bold text-slate-700 mb-2">📏 尺寸規格 (選填)</label>
                        <div class="grid grid-cols-1 md:grid-cols-3 gap-3">
                            <div>
                                <label class="block text-[11px] font-semibold text-slate-500 mb-1">長度</label>
                                <input type="text" id="add-length" placeholder="例: 250mm" class="w-full border rounded-lg p-2 text-sm bg-white">
                            </div>
                            <div>
                                <label class="block text-[11px] font-semibold text-slate-500 mb-1">寬度</label>
                                <input type="text" id="add-width" placeholder="例: 150mm" class="w-full border rounded-lg p-2 text-sm bg-white">
                            </div>
                            <div>
                                <label class="block text-[11px] font-semibold text-slate-500 mb-1">高度</label>
                                <input type="text" id="add-height" placeholder="例: 80mm" class="w-full border rounded-lg p-2 text-sm bg-white">
                            </div>
                        </div>
                    </div>

                    <!-- 冷氣系統容量規範 (冷凍油量與冷媒量) -->
                    <div class="bg-blue-50/70 p-3 rounded-lg border border-blue-200">
                        <label class="block text-xs font-bold text-blue-900 mb-2">❄️ 冷氣系統容量規範 (選填)</label>
                        <div class="grid grid-cols-1 md:grid-cols-2 gap-3">
                            <div>
                                <label class="block text-[11px] font-semibold text-slate-600 mb-1">冷凍油量</label>
                                <input type="text" id="add-oil-capacity" placeholder="例: PAG46 150ml" class="w-full border rounded-lg p-2 text-sm bg-white">
                            </div>
                            <div>
                                <label class="block text-[11px] font-semibold text-slate-600 mb-1">冷媒量</label>
                                <input type="text" id="add-refrigerant-capacity" placeholder="例: R134a 500g" class="w-full border rounded-lg p-2 text-sm bg-white">
                            </div>
                        </div>
                    </div>

                    <div class="bg-indigo-50/70 p-3 rounded-lg border border-indigo-200">
                        <label class="block text-xs font-bold text-indigo-900 mb-1">
                            🔗 相容 / 替代 / 交叉對照料號 (Cross-Reference)
                            <span class="font-normal text-[11px] text-indigo-700 block">提示：可輸入多筆（如 A, B, C），系統將自動雙向無限連動。</span>
                        </label>
                        <textarea id="add-cross-ref" rows="2" placeholder="例: 447220-8020, 64526908660" class="w-full border rounded-lg p-2 text-sm font-mono bg-white"></textarea>
                    </div>

                    <div class="bg-amber-50/80 p-3 rounded-lg border border-amber-200">
                        <label class="block text-xs font-bold text-amber-900 mb-1">
                            🔧 建議搭配配套零組件 (Kit / Companion Parts)
                            <span class="font-normal text-[11px] text-amber-700 block">提示：將各配套料號用中括號包覆（例如：膨脹閥 [V-101]、墊片 [GASKET-01]），系統將自動雙向對應。</span>
                        </label>
                        <textarea id="add-kit-parts" rows="2" placeholder="格式範例: 膨脹閥 [V-101], 墊片 [GASKET-01]" class="w-full border border-amber-300 rounded-lg p-2 text-sm font-mono bg-white"></textarea>
                    </div>

                    <!-- 零件本身的備註框 (獨立保留) -->
                    <div>
                        <label class="block text-xs font-semibold text-slate-600 mb-1">零件主檔備註/規格說明 (獨立)</label>
                        <input type="text" id="add-remarks" placeholder="例如: R134a, 帶線圈, 24V" class="w-full border rounded-lg p-2 text-sm bg-white">
                    </div>

                    <div class="bg-white p-3 rounded-lg border border-slate-200">
                        <label class="block text-xs font-bold text-slate-700 mb-2">💵 參考前價與日期</label>
                        <div class="grid grid-cols-1 md:grid-cols-2 gap-3">
                            <div>
                                <label class="block text-[11px] font-semibold text-slate-500 mb-1">參考前價 (NT$)</label>
                                <input type="number" id="add-price" placeholder="6800" class="w-full border rounded-lg p-2 text-sm bg-white">
                            </div>
                            <div>
                                <label class="block text-[11px] font-semibold text-slate-500 mb-1">前價日期</label>
                                <input type="date" id="add-price-date" class="w-full border rounded-lg p-2 text-sm bg-white">
                            </div>
                        </div>
                    </div>

                    <div>
                        <label class="block text-xs font-semibold text-slate-600 mb-1">零件照片 (最多 3 張)</label>
                        <input type="file" id="add-images" accept="image/*" multiple onchange="previewImages(event, 'add-preview-container')" class="w-full text-xs text-slate-500 file:mr-3 file:py-2 file:px-4 file:rounded-lg file:border-0 file:text-xs file:font-semibold file:bg-blue-50 file:text-blue-700 hover:file:bg-blue-100 cursor-pointer">
                        <div id="add-preview-container" class="flex gap-2 mt-3 overflow-x-auto"></div>
                    </div>
                </div>

                <!-- 獨立多廠商資料區 (非必填、含廠商料號) -->
                <div class="bg-slate-50 p-4 rounded-xl border border-slate-200 space-y-4">
                    <div class="flex justify-between items-center border-b pb-2">
                        <h2 class="font-bold text-sm text-slate-700">🏭 進貨廠商、廠商料號與成本 (可新增多家，皆非必填)</h2>
                        <button type="button" onclick="addSupplierRow('add-suppliers-container', 'add')" class="text-xs bg-blue-50 hover:bg-blue-100 text-blue-700 font-semibold px-3 py-1.5 rounded-lg border border-blue-200 transition">
                            ➕ 新增進貨廠商
                        </button>
                    </div>
                    <div id="add-suppliers-container" class="space-y-3"></div>
                </div>

                <div class="bg-slate-50 p-4 rounded-xl border border-slate-200 space-y-4">
                    <div class="flex justify-between items-center border-b pb-2">
                        <h2 class="font-bold text-sm text-slate-700">🚘 適用車型與車種類別</h2>
                        <button type="button" onclick="addVehicleRow('add-vehicles-container', 'add')" class="text-xs bg-blue-50 hover:bg-blue-100 text-blue-700 font-semibold px-3 py-1.5 rounded-lg border border-blue-200 transition">
                            ➕ 新增一台車型
                        </button>
                    </div>
                    <div id="add-vehicles-container" class="space-y-3"></div>
                </div>

                <button type="submit" id="submit-btn" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-bold py-3 rounded-xl shadow transition">
                    💾 儲存零件與配套組合
                </button>
            </form>
        </div>

    </div>

    <!-- 編輯零件 Modal -->
    <div id="edit-modal" class="fixed inset-0 bg-slate-900/50 backdrop-blur-sm hidden items-center justify-center p-4 z-50">
        <div class="bg-white rounded-xl shadow-xl max-w-2xl w-full p-6 space-y-4 max-h-[90vh] overflow-y-auto">
            <div class="flex justify-between items-center border-b pb-3">
                <h3 class="text-base font-bold text-slate-800">✏️ 編輯零件與配套組合</h3>
                <button onclick="closeEditModal()" class="text-slate-400 hover:text-slate-600 text-xl font-bold px-2">&times;</button>
            </div>
            
            <form id="edit-part-form" onsubmit="handleSaveEdit(event)" class="space-y-4">
                <input type="hidden" id="edit-id">
                <div class="space-y-3">
                    <div class="grid grid-cols-3 gap-2">
                        <div class="relative">
                            <label class="block text-xs font-semibold text-slate-600 mb-1">零件名稱 *</label>
                            <input type="text" id="edit-part-name" list="part-name-list" required 
                                   oninput="showSuggestions('edit-part-name', 'part-name-list', 'edit-pname-suggestions')"
                                   onfocus="showSuggestions('edit-part-name', 'part-name-list', 'edit-pname-suggestions')"
                                   class="w-full border rounded-lg p-2 text-sm bg-white">
                            <div id="edit-pname-suggestions" class="suggestions-dropdown hidden"></div>
                        </div>
                        <div class="relative">
                            <label class="block text-xs font-semibold text-slate-600 mb-1">品牌 *</label>
                            <input type="text" id="edit-brand-name" list="part-brand-list" required 
                                   oninput="showSuggestions('edit-brand-name', 'part-brand-list', 'edit-pbrand-suggestions')"
                                   onfocus="showSuggestions('edit-brand-name', 'part-brand-list', 'edit-pbrand-suggestions')"
                                   class="w-full border rounded-lg p-2 text-sm bg-white">
                            <div id="edit-pbrand-suggestions" class="suggestions-dropdown hidden"></div>
                        </div>
                        <div>
                            <label class="block text-xs font-semibold text-slate-600 mb-1">產地</label>
                            <input type="text" id="edit-origin" class="w-full border rounded-lg p-2 text-sm bg-white">
                        </div>
                    </div>

                    <div class="grid grid-cols-2 gap-2">
                        <div>
                            <label class="block text-xs font-semibold text-slate-600 mb-1">本廠料號 *</label>
                            <input type="text" id="edit-part-number" required class="w-full border rounded-lg p-2 text-sm font-mono font-bold bg-white">
                        </div>
                        <div>
                            <label class="block text-xs font-semibold text-slate-600 mb-1">原廠 OEM 料號</label>
                            <input type="text" id="edit-oem-number" class="w-full border rounded-lg p-2 text-sm font-mono bg-white">
                        </div>
                    </div>

                    <!-- 編輯區長寬高尺寸 -->
                    <div class="bg-slate-50 p-2.5 rounded-lg border border-slate-200">
                        <label class="block text-xs font-bold text-slate-700 mb-1">📏 尺寸規格</label>
                        <div class="grid grid-cols-3 gap-2">
                            <div>
                                <label class="block text-[10px] font-semibold text-slate-500 mb-1">長度</label>
                                <input type="text" id="edit-length" class="w-full border rounded-lg p-1.5 text-sm bg-white">
                            </div>
                            <div>
                                <label class="block text-[10px] font-semibold text-slate-500 mb-1">寬度</label>
                                <input type="text" id="edit-width" class="w-full border rounded-lg p-1.5 text-sm bg-white">
                            </div>
                            <div>
                                <label class="block text-[10px] font-semibold text-slate-500 mb-1">高度</label>
                                <input type="text" id="edit-height" class="w-full border rounded-lg p-1.5 text-sm bg-white">
                            </div>
                        </div>
                    </div>

                    <!-- 編輯區冷氣容量規範 -->
                    <div class="bg-blue-50/70 p-2.5 rounded-lg border border-blue-200">
                        <label class="block text-xs font-bold text-blue-900 mb-1">❄️ 冷氣系統容量規範</label>
                        <div class="grid grid-cols-2 gap-2">
                            <div>

        // 🚀 行動版通用的自訂懸浮建議選單機制
        function showSuggestions(inputId, datalistId, dropdownId) {
            const input = document.getElementById(inputId);
            const datalist = document.getElementById(datalistId);
            const dropdown = document.getElementById(dropdownId);
            if (!input || !datalist || !dropdown) return;

            const val = input.value.trim().toLowerCase();
            const options = Array.from(datalist.querySelectorAll('option')).map(opt => opt.value);
            const filtered = options.filter(opt => opt.toLowerCase().includes(val));

            if (filtered.length === 0) {
                dropdown.classList.add('hidden');
                return;
            }

            dropdown.innerHTML = filtered.map(item => `
                <div class="suggestion-item" onclick="selectSuggestion('${inputId}', '${dropdownId}', '${item.replace(/'/g, "\\'")}')">
                    ${item}
                </div>
            `).join('');
            dropdown.classList.remove('hidden');
        }

        function selectSuggestion(inputId, dropdownId, value) {
            const input = document.getElementById(inputId);
            if (input) {
                input.value = value;
                const event = new Event('input', { bubbles: true });
                input.dispatchEvent(event);
            }
            const dropdown = document.getElementById(dropdownId);
            if (dropdown) {
                dropdown.classList.add('hidden');
            }
        }

            if (!kitPartsText) return '<span class="text-slate-400 text-[11px]">尚未設定搭配配套零件</span>';
            
            const matches = kitPartsText.match(/\[(.*?)\]/g);
            if (!matches || matches.length === 0) {
                let formattedHtml = kitPartsText.replace(/\[(.*?)\]/g, (match, partNumber) => {
                    const cleanNum = partNumber.trim();
                    return `<span class="font-mono text-xs bg-slate-100 text-blue-700 font-bold px-1.5 py-0.5 rounded border border-slate-200 mx-0.5 inline-flex items-center gap-0.5">${cleanNum}</span>`;
                });
                return `<div class="text-[11px] leading-relaxed">${formattedHtml}</div>`;
            }

            let cardsHtml = '<div class="space-y-1.5 mt-2">';
            matches.forEach(m => {
                const cleanNum = m.replace(/[\[\]]/g, '').trim().toUpperCase();
                const matchedParts = allPartsList.filter(p => p.part_number && p.part_number.trim().toUpperCase() === cleanNum);

                if (matchedParts.length > 0) {
                    matchedParts.forEach(matchedPart => {
                        const img = matchedPart.image_1 || matchedPart.image_2 || matchedPart.image_3;
                        const priceStr = matchedPart.price ? `NT$ ${Number(matchedPart.price).toLocaleString()}` : '未報價';
                        cardsHtml += `
                            <div class="bg-white p-2 rounded-lg border border-amber-200 flex items-center justify-between gap-2 shadow-xs">
                                <div class="flex items-center gap-2">
                                    ${img ? `<img src="${img}" class="w-10 h-10 object-cover rounded border cursor-pointer" onclick="window.open('${img}', '_blank')" title="點擊放大">` : '<div class="w-10 h-10 bg-slate-100 rounded border flex items-center justify-center text-[10px] text-slate-400">無圖</div>'}
                                    <div>
                                        <div class="flex items-center gap-1">
                                            <span class="text-[10px] font-bold px-1.5 py-0.2 rounded bg-amber-100 text-amber-800">${matchedPart.brand_name || '通用'}</span>
                                            <span class="text-xs font-bold text-slate-800">${matchedPart.part_name}</span>
                                        </div>
                                        <span class="font-mono text-xs font-bold text-blue-900 bg-slate-50 px-1 rounded border block mt-1">${matchedPart.part_number}</span>
                                    </div>
                                </div>
                                <div class="text-right flex flex-col items-end justify-center gap-1">
                                    <span class="text-xs font-extrabold text-emerald-600 block">${priceStr}</span>
                                    ${matchedPart.price_date ? `<span class="text-[10px] text-slate-400 block">${matchedPart.price_date}</span>` : ''}
                                </div>
                            </div>

                        </div>
                    `;
                }
            });
            cardsHtml += '</div>';
            return cardsHtml;
        }

        async function copyQuote() {
            if (!currentResultsCache || currentResultsCache.length === 0) { 
                alert('⚠️ 無查詢結果可複製！'); 
                return; 
            }
            
            const sBrand = document.getElementById('search-brand').value.trim();
            const sModel = document.getElementById('search-model').value.trim();
            const sYear = document.getElementById('search-year').value.trim();
            
            let vehicleHeader = '';
            if (sBrand || sModel || sYear) {
                vehicleHeader = `${sBrand} ${sModel} ${sYear}`.trim();
            } else {
                const firstItem = currentResultsCache[0];
                const vehicles = firstItem.part_vehicles ? firstItem.part_vehicles.map(pv => pv.vehicles).filter(Boolean) : [];
                if (vehicles.length > 0) {
                    const v = vehicles[0];
                    const ccText = v.cc ? ` (${v.cc})` : '';
                    vehicleHeader = `${v.brand || ''} ${v.model || ''}${ccText} ${v.start_year || ''}`.trim();
                }
            }

            let textLines = [];
            if (vehicleHeader) {
                textLines.push(vehicleHeader);
                textLines.push('');
            }

            const groupedByPartName = {};
            currentResultsCache.forEach(item => {
                const pName = item.part_name || '未命名零件';
                if (!groupedByPartName[pName]) {
                    groupedByPartName[pName] = [];
                }
                groupedByPartName[pName].push(item);
            });

            Object.keys(groupedByPartName).forEach(pName => {
                textLines.push(`【${pName}】`);
                groupedByPartName[pName].forEach(item => {
                    const brandName = item.brand_name || '一般';
                    const priceStr = item.price ? `$${Number(item.price).toLocaleString()}` : '$請洽詢';
                    textLines.push(`${brandName} ${priceStr}`);
                });
                textLines.push('');
            });

            const copyText = textLines.join('\n').trim();
            
            try {
                await navigator.clipboard.writeText(copyText);
                alert('📋 指定格式報價已成功複製至剪貼簿！\n\n' + copyText);
            } catch (err) {
                const textArea = document.createElement("textarea");
                textArea.value = copyText;
                document.body.appendChild(textArea);
                textArea.select();
                document.execCommand('copy');
                document.body.removeChild(textArea);
                alert('📋 報價格式已複製！');
            }
        }

        async function saveSuppliers(partId, containerId, prefix) {
            const rows = document.getElementById(containerId).querySelectorAll('.supplier-row');
            const supplierPayloads = [];
            for (const row of rows) {
                const supplier_name = row.querySelector(`.${prefix}-sup-name`).value.trim();
                const supplier_part_number = row.querySelector(`.${prefix}-sup-partnum`).value.trim();
                const costStr = row.querySelector(`.${prefix}-sup-cost`).value;
                const remarks = row.querySelector(`.${prefix}-sup-remarks`).value.trim();

                if (!supplier_name && !supplier_part_number && !costStr && !remarks) continue;

                const cost = costStr !== '' ? parseFloat(costStr) : null;

                supplierPayloads.push({
                    part_id: partId,
                    supplier_name: supplier_name || null,
                    supplier_part_number: supplier_part_number || null,
                    cost,
                    remarks: remarks || null
                });
            }
            await _supabase.from('part_suppliers').delete().eq('part_id', partId);
            if (supplierPayloads.length > 0) {
                await _supabase.from('part_suppliers').insert(supplierPayloads);
            }
        }

        async function getOrCreateVehicleIds(containerId, prefix) {
            const rows = document.getElementById(containerId).querySelectorAll('.vehicle-row');
            const vehicleIds = [];
            
            const { data: allVehicles } = await _supabase.from('vehicles').select('*');
            const vehiclesList = allVehicles || [];

            for (const row of rows) {
                const vehicleType = row.querySelector(`.${prefix}-v-type`).value.trim() || null;
                const brand = row.querySelector(`.${prefix}-v-brand`).value.trim();
                const model = row.querySelector(`.${prefix}-v-model`).value.trim();
                const cc = row.querySelector(`.${prefix}-v-cc`).value.trim() || null;
                const startYear = parseInt(row.querySelector(`.${prefix}-v-start`).value);
                const startMonth = parseInt(row.querySelector(`.${prefix}-v-start-m`).value) || null;
                const endYearStr = row.querySelector(`.${prefix}-v-end`).value;
                const endYear = endYearStr !== '' ? parseInt(endYearStr) : null;
                const endMonth = parseInt(row.querySelector(`.${prefix}-v-end-m`).value) || null;

                if (!brand || !model || isNaN(startYear)) continue;

                const existing = vehiclesList.find(v => 
                    v.brand === brand &&
                    v.model === model &&
                    v.start_year === startYear &&
                    (v.vehicle_type || null) === vehicleType &&
                    (v.cc || null) === cc &&
                    (v.start_month || null) === startMonth &&
                    (v.end_year || null) === endYear &&
                    (v.end_month || null) === endMonth
                );

                if (existing) {
                    vehicleIds.push(existing.id);
                } else {
                    const { data: newV, error } = await _supabase.from('vehicles').insert([{ 
                        vehicle_type: vehicleType, 
                        brand, 
                        model, 
                        cc, 
                        start_year: startYear, 
                        start_month: startMonth, 
                        end_year: endYear, 
                        end_month: endMonth 
                    }]).select();

                    if (!error && newV && newV.length > 0) {
                        vehicleIds.push(newV[0].id);
                        vehiclesList.push(newV[0]);
                    }
                }
            }
            return [...new Set(vehicleIds)];
        }

            const fileInput = document.getElementById(fileInputId);
            if (!fileInput || !fileInput.files.length) return [null, null, null];
            let urls = [null, null, null];
            for (let i = 0; i < Math.min(fileInput.files.length, 3); i++) {
                const file = fileInput.files[i];
                const filePath = `parts/${Date.now()}_${i}.${file.name.split('.').pop()}`;
                const { error } = await _supabase.storage.from(STORAGE_BUCKET).upload(filePath, file);
                if (!error) {
                    const { data } = _supabase.storage.from(STORAGE_BUCKET).getPublicUrl(filePath);
                    urls[i] = data.publicUrl;
                }
            }
            return urls;

        function parseCrossRefCount(str) {
            if (!str) return [];
            return str.split(/[,，\s]+/).map(s => s.trim().toUpperCase()).filter(Boolean);
        }

        async function syncCrossReferences(partNumber, crossRefText) {
            if (!partNumber) return;
            const currentPN = partNumber.trim().toUpperCase();
            const refs = parseCrossRefCount(crossRefText);
            const allInGroup = [...new Set([currentPN, ...refs])];

            const { data: allParts } = await _supabase.from('parts').select('id, part_number, cross_reference');
            if (!allParts) return;

            const partMap = new Map();
            allParts.forEach(p => {
                if (p.part_number) {
                    partMap.set(p.part_number.trim().toUpperCase(), p);
                }
            });

            for (const pn of allInGroup) {
                const targetPart = partMap.get(pn);
                if (targetPart) {
                    const existingRefs = parseCrossRefCount(targetPart.cross_reference);
                    const mergedRefs = [...new Set([...existingRefs, ...allInGroup.filter(r => r !== pn)])];
                    const newCrossRefStr = mergedRefs.join(', ');
                    if (newCrossRefStr !== (targetPart.cross_reference || '')) {
                        await _supabase.from('parts').update({ cross_reference: newCrossRefStr }).eq('id', targetPart.id);
                    }
                }
            }
        }

            const searchModel = document.getElementById('search-model').value.trim().toLowerCase();

                part_vehicles ( vehicles ( vehicle_type, brand, model, cc, start_year, start_month, end_year, end_month ) ),
                part_suppliers ( id, supplier_name, supplier_part_number, cost, remarks )
            `);

            if (error) { resultsContainer.innerHTML = `<p class="text-red-500 text-sm text-center">❌ ${error.message}</p>`; return; }

            const matchedInitialIds = new Set();
            allData.forEach(item => {
                const vehicleList = item.part_vehicles ? item.part_vehicles.map(pv => pv.vehicles).filter(Boolean) : [];
                
                const matchName = selectedPartNames.length === 0 || selectedPartNames.some(name => item.part_name && item.part_name.toLowerCase() === name.toLowerCase());
                
                let matchKeyword = true;
                if (keyword) {
                    const kw = keyword.toLowerCase();
                    const pNum = item.part_number ? item.part_number.toLowerCase() : '';
                    const oemNum = item.oem_number ? item.oem_number.toLowerCase() : '';
                    const crossRef = item.cross_reference ? item.cross_reference.toLowerCase() : '';
                    const pName = item.part_name ? item.part_name.toLowerCase() : '';
                    const remarks = item.remarks ? item.remarks.toLowerCase() : '';
                    const origin = item.origin ? item.origin.toLowerCase() : '';
                    
                    const supPartNums = item.part_suppliers ? item.part_suppliers.map(s => s.supplier_part_number ? s.supplier_part_number.toLowerCase() : '').join(' ') : '';

                    const isPartNumberMatch = pNum.includes(kw) || oemNum.includes(kw) || crossRef.includes(kw) || supPartNums.includes(kw);
                    const isTextMatch = pName.includes(kw) || remarks.includes(kw) || origin.includes(kw);

                    matchKeyword = isPartNumberMatch || isTextMatch;
                }

                let matchVehicle = true;
                if (searchVType || searchBrand || searchModel || !isNaN(year)) {
                    matchVehicle = vehicleList.some(v => {
                        return (!searchVType || (v.vehicle_type && v.vehicle_type.toLowerCase().includes(searchVType))) &&
                               (!searchBrand || (v.brand && v.brand.toLowerCase().includes(searchBrand))) &&
                               (!searchModel || (v.model && v.model.toLowerCase().includes(searchModel))) &&
                               (isNaN(year) || (year >= v.start_year && (!v.end_year || year <= v.end_year)));
                    });
                }

                if (matchName && matchKeyword && matchVehicle) {
                    matchedInitialIds.add(item.id);
                }
            });

            const filteredData = allData.filter(item => matchedInitialIds.has(item.id));
            renderResults(filteredData, allData);
        }

                                    </div>` : ''}
                            </div>

                            <div class="bg-amber-50/70 p-3 rounded-lg border border-amber-200 space-y-2 text-xs">
                                <div>
                                    <span class="text-amber-900 font-bold block mb-1">🔧 建議搭配配套零組件：</span>
                                    ${renderAssociatedKitCards(item.kit_parts, allData)}
                                </div>

                                ${reverseLinkedParts.length > 0 ? `
                                    <div class="border-t border-amber-200 pt-2">
                                        <span class="text-amber-900 font-bold block mb-1">🔗 須對應此零件的品項 (自動對應)：</span>
                                        <div class="space-y-1.5">
                                            ${reverseLinkedParts.map(rp => {
                                                const rpImg = rp.image_1 || rp.image_2 || rp.image_3;
                                                const rpPrice = rp.price ? `NT$ ${Number(rp.price).toLocaleString()}` : '未報價';
                                                return `
                                                    <div class="bg-white p-1.5 rounded border border-amber-300 flex items-center justify-between gap-2 shadow-sm">
                                                        <div class="flex items-center gap-2">
                                                            ${rpImg ? `<img src="${rpImg}" class="w-8 h-8 object-cover rounded border cursor-pointer" onclick="window.open('${rpImg}', '_blank')">` : ''}
                                                            <div>
                                                                <div class="text-[11px] font-bold text-slate-800">${rp.part_name} <span class="font-mono text-blue-800">[${rp.part_number}]</span></div>
                                                                <span class="text-[10px] text-slate-500">${rp.brand_name || ''}</span>
                                                            </div>
                                                        </div>
                                                        <div class="text-right">
                                                            <span class="text-[11px] font-extrabold text-emerald-600 block">${rpPrice}</span>
                                                        </div>
                                                    </div>
                                                `;
                                            }).join('')}
                                        </div>
                                    </div>
                                ` : ''}
                            </div>
                        </div>

                        ${images.length ? `<div class="flex gap-2 pl-7">${images.map(img => `<img src="${img}" class="w-16 h-16 object-cover rounded border cursor-pointer hover:opacity-80 transition" onclick="window.open('${img}', '_blank')" title="點擊另開視窗放大">`).join('')}</div>` : ''}

                        <div class="border-t pt-2 pl-7">
                            <span class="text-[11px] font-bold text-slate-400 block mb-1">🚘 相容底盤與車種 (點擊標籤一鍵跳轉篩選)：</span>
                            <div class="flex flex-wrap gap-1">
                                ${vehicles.map(v => {
                                    const startStr = v.start_month ? `${v.start_year}/${v.start_month}` : `${v.start_year}`;
                                    const endStr = v.end_year ? (v.end_month ? `${v.end_year}/${v.end_month}` : `${v.end_year}`) : '現今';
                                    // 💡 將 CC 數移至車名（車型/底盤）右側顯示
                                    const ccStr = v.cc ? ` (${v.cc})` : '';
                                    return `
                                        <span onclick="jumpToVehicleFilter('${v.brand}', '${v.model}', '${v.vehicle_type || ''}')" 
                                              class="text-xs bg-slate-100 hover:bg-blue-50 hover:text-blue-700 hover:border-blue-300 text-slate-700 px-2 py-0.5 rounded border cursor-pointer transition flex items-center gap-1">
                                            <b class="text-blue-800">[${v.vehicle_type || '車種'}]</b> ${v.brand} ${v.model}${ccStr} (${startStr} - ${endStr}) ↗
                                        </span>
                                    `;
                                }).join('')}
                            </div>
                        </div>
                    </div>`;
            }).join('');

            resultsContainer.innerHTML = cards;
        }

        async function openEditModalById(id) {
            const item = currentResultsCache.find(p => p.id === id);
            if (!item) return;
            document.getElementById('edit-id').value = item.id;
            document.getElementById('edit-part-name').value = item.part_name || '';
            document.getElementById('edit-brand-name').value = item.brand_name || '';
            document.getElementById('edit-origin').value = item.origin || '';
            document.getElementById('edit-part-number').value = item.part_number || '';
            document.getElementById('edit-oem-number').value = item.oem_number || '';
            document.getElementById('edit-length').value = item.length || '';
            document.getElementById('edit-width').value = item.width || '';
            document.getElementById('edit-height').value = item.height || '';
            document.getElementById('edit-oil-capacity').value = item.oil_capacity || '';
            document.getElementById('edit-refrigerant-capacity').value = item.refrigerant_capacity || '';
            document.getElementById('edit-cross-ref').value = item.cross_reference || '';
            document.getElementById('edit-kit-parts').value = item.kit_parts || '';
            document.getElementById('edit-price').value = item.price || '';
            document.getElementById('edit-price-date').value = item.price_date || '';
            document.getElementById('edit-remarks').value = item.remarks || '';

            editCurrentImages = [item.image_1, item.image_2, item.image_3].filter(Boolean);
            editNewFiles = [];
            renderEditImagesPreview();
            document.getElementById('edit-images').value = '';

            const editSuppliersContainer = document.getElementById('edit-suppliers-container');
            editSuppliersContainer.innerHTML = '';
            const suppliers = item.part_suppliers || [];
            if (suppliers.length) {
                suppliers.forEach(s => addSupplierRow('edit-suppliers-container', 'edit', s));
            } else {
                addSupplierRow('edit-suppliers-container', 'edit');
            }

            const editVehicles = document.getElementById('edit-vehicles-container');
            editVehicles.innerHTML = '';
            const vehicles = item.part_vehicles ? item.part_vehicles.map(pv => pv.vehicles).filter(Boolean) : [];
            if (vehicles.length) vehicles.forEach(v => addVehicleRow('edit-vehicles-container', 'edit', v));
            else addVehicleRow('edit-vehicles-container', 'edit');

            document.getElementById('edit-modal').classList.remove('hidden');
            document.getElementById('edit-modal').classList.add('flex');
        }

        function closeEditModal() {
            document.getElementById('edit-modal').classList.remove('flex');
            document.getElementById('edit-modal').classList.add('hidden');
        }

        async function handleSaveEdit(e) {
            e.preventDefault();
            const id = document.getElementById('edit-id').value;
            const partNum = document.getElementById('edit-part-number').value.trim();
            const crossRefText = document.getElementById('edit-cross-ref').value.trim();

            const newlyUploadedUrls = await uploadNewEditImages();
            const finalImages = [...editCurrentImages, ...newlyUploadedUrls].slice(0, 3);

            const updatePayload = {
                part_name: document.getElementById('edit-part-name').value.trim(),
                brand_name: document.getElementById('edit-brand-name').value.trim(),
                origin: document.getElementById('edit-origin').value.trim() || null,
                part_number: partNum,
                oem_number: document.getElementById('edit-oem-number').value.trim() || null,
                length: document.getElementById('edit-length').value.trim() || null,
                width: document.getElementById('edit-width').value.trim() || null,
                height: document.getElementById('edit-height').value.trim() || null,
                oil_capacity: document.getElementById('edit-oil-capacity').value.trim() || null,
                refrigerant_capacity: document.getElementById('edit-refrigerant-capacity').value.trim() || null,
                cross_reference: crossRefText || null,
                kit_parts: document.getElementById('edit-kit-parts').value.trim() || null,
                price: parseFloat(document.getElementById('edit-price').value) || null,
                price_date: document.getElementById('edit-price-date').value || null,
                remarks: document.getElementById('edit-remarks').value.trim() || null,
                image_1: finalImages[0] || null,
                image_2: finalImages[1] || null,
                image_3: finalImages[2] || null
            };

            await _supabase.from('parts').update(updatePayload).eq('id', id);
            await syncCrossReferences(partNum, crossRefText);
            await saveSuppliers(id, 'edit-suppliers-container', 'edit');

            const vehicleIds = await getOrCreateVehicleIds('edit-vehicles-container', 'edit');
            await _supabase.from('part_vehicles').delete().eq('part_id', id);
            if (vehicleIds.length) {
                await _supabase.from('part_vehicles').insert(vehicleIds.map(vId => ({ part_id: id, vehicle_id: vId })));
            }

            alert('✅ 更新成功！');
            closeEditModal();
            initHistoryDatalists();
            searchParts();
        }

        async function handleAddPart(e) {
            e.preventDefault();
            const partNum = document.getElementById('add-part-number').value.trim();
            const crossRefText = document.getElementById('add-cross-ref').value.trim();

            const partPayload = {
                part_name: document.getElementById('add-part-name').value.trim(),
                brand_name: document.getElementById('add-brand-name').value.trim(),
                origin: document.getElementById('add-origin').value.trim() || null,
                part_number: partNum,
                oem_number: document.getElementById('add-oem-number').value.trim() || null,
                length: document.getElementById('add-length').value.trim() || null,
                width: document.getElementById('add-width').value.trim() || null,
                height: document.getElementById('add-height').value.trim() || null,
                oil_capacity: document.getElementById('add-oil-capacity').value.trim() || null,
                refrigerant_capacity: document.getElementById('add-refrigerant-capacity').value.trim() || null,
                cross_reference: crossRefText || null,
                kit_parts: document.getElementById('add-kit-parts').value.trim() || null,
                price: parseFloat(document.getElementById('add-price').value) || null,
                price_date: document.getElementById('add-price-date').value || null,
                remarks: document.getElementById('add-remarks').value.trim() || null
            };

            const [img1, img2, img3] = await uploadImages('add-images');
            partPayload.image_1 = img1; partPayload.image_2 = img2; partPayload.image_3 = img3;

            const { data: partData, error } = await _supabase.from('parts').insert([partPayload]).select();
            if (error) { alert('❌ ' + error.message); return; }

            await syncCrossReferences(partNum, crossRefText);

            const newPartId = partData[0].id;
            await saveSuppliers(newPartId, 'add-suppliers-container', 'add');

            const vehicleIds = await getOrCreateVehicleIds('add-vehicles-container', 'add');
            if (vehicleIds.length) {
                await _supabase.from('part_vehicles').insert(vehicleIds.map(vId => ({ part_id: newPartId, vehicle_id: vId })));
            }

            alert('✅ 新增成功！');
            document.getElementById('add-part-form').reset();
            document.getElementById('add-preview-container').innerHTML = '';
            document.getElementById('add-suppliers-container').innerHTML = '';
            addSupplierRow('add-suppliers-container', 'add');
            document.getElementById('add-vehicles-container').innerHTML = '';
            addVehicleRow('add-vehicles-container', 'add');

            initHistoryDatalists();
            switchTab('search');
            searchParts();
        }
    </script>
</body>
</html>
