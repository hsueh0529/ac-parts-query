<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>汽車冷氣零件管理系統 - 凱堤耐特</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Supabase JS Client -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-slate-100 min-h-screen font-sans text-slate-800">

    <!-- 頂部導覽列 -->
    <header class="bg-indigo-900 text-white shadow-md">
        <div class="max-w-7xl mx-auto px-4 py-4 flex justify-between items-center">
            <h1 class="text-xl font-bold flex items-center gap-2">
                ❄️ 凱堤耐特 汽車冷氣零件管理系統
            </h1>
            <button onclick="openAddModal()" class="bg-indigo-600 hover:bg-indigo-500 text-white px-4 py-2 rounded-lg text-sm font-medium transition shadow">
                ＋ 新增零件資料
            </button>
        </div>
    </header>

    <!-- 主內容區塊 -->
    <main class="max-w-7xl mx-auto px-4 py-6">

        <!-- 搜尋與篩選條件區 -->
        <div class="bg-white p-5 rounded-xl shadow-sm border border-slate-200 mb-6">
            <h2 class="text-base font-bold text-slate-700 mb-3 flex items-center gap-1">
                🔍 零件與車型交叉查詢
            </h2>
            <div class="grid grid-cols-1 md:grid-cols-5 gap-3">
                <input type="text" id="search-keyword" placeholder="關鍵字 / 料號 (如: DCP05001)..." class="p-2 border rounded-md text-sm border-slate-300 focus:outline-indigo-500">
                <input type="text" id="search-brand" placeholder="品牌 (如: BMW)..." class="p-2 border rounded-md text-sm border-slate-300 focus:outline-indigo-500">
                <input type="text" id="search-model" placeholder="車型 (如: E36)..." class="p-2 border rounded-md text-sm border-slate-300 focus:outline-indigo-500">
                <input type="text" id="search-year" placeholder="年份..." class="p-2 border rounded-md text-sm border-slate-300 focus:outline-indigo-500">
                <input type="hidden" id="search-vehicle-type" value="">
                
                <div class="flex gap-2">
                    <button onclick="searchParts()" class="flex-1 bg-indigo-600 hover:bg-indigo-700 text-white font-medium py-2 rounded-md text-sm transition">
                        查詢
                    </button>
                    <button onclick="clearSearch()" class="bg-slate-200 hover:bg-slate-300 text-slate-700 px-3 py-2 rounded-md text-sm transition">
                        重設
                    </button>
                </div>
            </div>
        </div>

        <!-- 搜尋結果展示區 -->
        <div id="results-container" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
            <!-- 查詢結果會由 JavaScript 動態生成於此 -->
        </div>

    </main>

    <!-- 新增 / 編輯零件 Modal 彈窗 -->
    <div id="part-modal" class="fixed inset-0 bg-black/50 hidden items-center justify-center p-4 z-50">
        <div class="bg-white rounded-xl shadow-xl max-w-lg w-full max-h-[90vh] overflow-y-auto p-6">
            <div class="flex justify-between items-center mb-4 border-b pb-2">
                <h3 id="modal-title" class="text-lg font-bold text-slate-800">新增零件資料</h3>
                <button onclick="closeModal()" class="text-slate-400 hover:text-slate-600 text-xl font-bold">&times;</button>
            </div>
            
            <form id="part-form" onsubmit="handleFormSubmit(event)" class="space-y-4">
                <input type="hidden" id="edit-id">
                
                <div>
                    <label class="block text-xs font-bold text-slate-600 mb-1">零件料號 (Part Number) *</label>
                    <input type="text" id="form-part-number" required class="w-full p-2 border rounded-md text-sm font-mono border-slate-300 focus:outline-indigo-500">
                </div>

                <div>
                    <label class="block text-xs font-bold text-slate-600 mb-1">零件名稱 *</label>
                    <input type="text" id="form-part-name" required placeholder="如: 汽車冷氣壓縮機" class="w-full p-2 border rounded-md text-sm border-slate-300 focus:outline-indigo-500">
                </div>

                <div>
                    <label class="block text-xs font-bold text-slate-600 mb-1">
                        🔗 搭配 / 關聯料號 (多筆請用逗號或換行分隔)
                    </label>
                    <textarea id="form-cross-reference" rows="2" placeholder="如: EXP-9921, DCN09002 (系統將自動寫入雙向連結)" class="w-full p-2 border rounded-md text-sm font-mono border-slate-300 focus:outline-indigo-500"></textarea>
                    <p class="text-[11px] text-indigo-600 mt-1">※ 輸入後，系統會在儲存時自動給對應零件帶入本料號。</p>
                </div>

                <div class="grid grid-cols-2 gap-3">
                    <div>
                        <label class="block text-xs font-bold text-slate-600 mb-1">價格 (TWD)</label>
                        <input type="number" id="form-price" placeholder="0" class="w-full p-2 border rounded-md text-sm border-slate-300 focus:outline-indigo-500">
                    </div>
                    <div>
                        <label class="block text-xs font-bold text-slate-600 mb-1">庫存數量</label>
                        <input type="number" id="form-stock" placeholder="0" class="w-full p-2 border rounded-md text-sm border-slate-300 focus:outline-indigo-500">
                    </div>
                </div>

                <div class="flex justify-end gap-2 pt-4 border-t">
                    <button type="button" onclick="closeModal()" class="px-4 py-2 border rounded-md text-sm text-slate-600 hover:bg-slate-50">取消</button>
                    <button type="submit" class="px-4 py-2 bg-indigo-600 hover:bg-indigo-700 text-white rounded-md text-sm font-medium">儲存並同步關聯</button>
                </div>
            </form>
        </div>
    </div>

    <!-- 邏輯腳本區塊 -->
    <script>
        /* ================= ⚙️ Supabase 初始化設定 ================= */
        const SUPABASE_URL = 'YOUR_SUPABASE_URL'; // 請替換為您的 Supabase 網址
        const SUPABASE_ANON_KEY = 'YOUR_SUPABASE_ANON_KEY'; // 請替換為您的 Supabase Anon Key
        const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        // 頁面載入後自動查詢
        document.addEventListener('DOMContentLoaded', () => {
            searchParts();
        });

        /* ================= 🔄 雙向自動連動更新核心邏輯 ================= */
        async function syncCrossReferences(currentPartNumber, crossRefText) {
            if (!currentPartNumber || !crossRefText) return;

            // 解析目前輸入的所有關聯料號（支援逗號或換行分隔）
            const targetPartNumbers = crossRefText.split(/[\n,]+/).map(s => s.trim()).filter(Boolean);

            for (const targetNo of targetPartNumbers) {
                if (targetNo.toLowerCase() === currentPartNumber.toLowerCase()) continue;

                try {
                    // 搜尋資料庫中是否存在該目標料號的零件
                    const { data: targetParts } = await _supabase
                        .from('parts')
                        .select('id, cross_reference')
                        .eq('part_number', targetNo);

                    if (targetParts && targetParts.length > 0) {
                        for (const targetPart of targetParts) {
                            let existingRefs = targetPart.cross_reference
                                ? targetPart.cross_reference.split(/[\n,]+/).map(s => s.trim()).filter(Boolean)
                                : [];

                            // 若目標零件的關聯清單中尚未包含目前零件，則自動補上 (實現雙向連動)
                            const isAlreadyLinked = existingRefs.some(ref => ref.toLowerCase() === currentPartNumber.toLowerCase());
                            
                            if (!isAlreadyLinked) {
                                existingRefs.push(currentPartNumber);
                                const updatedRefStr = existingRefs.join(', ');

                                await _supabase
                                    .from('parts')
                                    .update({ cross_reference: updatedRefStr })
                                    .eq('id', targetPart.id);
                            }
                        }
                    }
                } catch (err) {
                    console.warn(`自動雙向連動 ${targetNo} 時發生錯誤:`, err);
                }
            }
        }

        /* ================= ⚡ 一鍵跳轉至對應零件卡片 ================= */
        function quickSearchByNumber(partNo) {
            if (!partNo) return;
            
            // 清除其他篩選欄位，專注於精準比對該料號
            document.getElementById('search-brand').value = '';
            document.getElementById('search-model').value = '';
            document.getElementById('search-year').value = '';
            
            // 自動帶入關鍵字並發動查詢
            document.getElementById('search-keyword').value = partNo.trim();
            searchParts();
        }

        /* ================= 🔎 搜尋零件資料 ================= */
        async function searchParts() {
            const keyword = document.getElementById('search-keyword').value.trim();
            const container = document.getElementById('results-container');
            container.innerHTML = `<div class="col-span-full text-center py-10 text-slate-400">載入中...</div>`;

            try {
                let query = _supabase.from('parts').select('*');

                if (keyword) {
                    query = query.or(`part_number.ilike.%${keyword}%,name.ilike.%${keyword}%,cross_reference.ilike.%${keyword}%`);
                }

                const { data, error } = await query;
                if (error) throw error;

                renderResults(data);
            } catch (err) {
                console.error(err);
                container.innerHTML = `<div class="col-span-full text-center py-10 text-red-500">查詢發生錯誤: ${err.message}</div>`;
            }
        }

        /* ================= 🎨 渲染查詢結果卡片 ================= */
        function renderResults(items) {
            const container = document.getElementById('results-container');
            
            if (!items || items.length === 0) {
                container.innerHTML = `<div class="col-span-full text-center py-10 text-slate-400">查無對應的零件資料</div>`;
                return;
            }

            container.innerHTML = items.map(item => `
                <div class="bg-white p-5 rounded-xl border border-slate-200 shadow-sm hover:shadow-md transition flex flex-col justify-between">
                    <div>
                        <div class="flex justify-between items-start mb-2">
                            <span class="text-xs font-mono bg-slate-100 text-slate-700 font-bold px-2 py-0.5 rounded border border-slate-200">
                                ${item.part_number}
                            </span>
                            <span class="text-sm font-bold text-emerald-600">
                                $${item.price ? item.price.toLocaleString() : '未定價'}
                            </span>
                        </div>
                        <h3 class="text-base font-bold text-slate-800 mb-1">${item.name || '未命名零件'}</h3>
                        
                        <!-- 🔗 雙向對照 / 關聯料號區域 (可點擊跳轉) -->
                        ${item.cross_reference ? `
                            <div class="mt-3 pt-2 border-t border-slate-100 flex items-center flex-wrap gap-1.5">
                                <span class="text-indigo-900 font-bold text-xs flex items-center gap-1 w-full mb-0.5">
                                    🔗 雙向搭配 / 關聯料號 (點擊跳轉)：
                                </span>
                                ${item.cross_reference.split(/[\n,]+/).map(ref => {
                                    const cleanRef = ref.trim();
                                    if (!cleanRef) return '';
                                    return `
                                        <button type="button" onclick="quickSearchByNumber('${cleanRef}')" 
                                                title="點擊直接查詢 ${cleanRef} 的詳細資料"
                                                class="text-xs font-mono bg-indigo-100 hover:bg-indigo-600 hover:text-white text-indigo-900 px-2 py-0.5 rounded-md border border-indigo-200 font-bold transition flex items-center gap-1 shadow-sm active:scale-95">
                                            <span>${cleanRef}</span>
                                            <span class="text-[10px] opacity-70">↗</span>
                                        </button>
                                    `;
                                }).join('')}
                            </div>
                        ` : ''}
                    </div>

                    <div class="mt-4 pt-3 border-t border-slate-100 flex justify-between items-center text-xs text-slate-500">
                        <span>庫存: <strong class="text-slate-700">${item.stock ?? 0}</strong></span>
                        <button onclick="openEditModal(${JSON.stringify(item).replace(/"/g, '&quot;')})" class="text-indigo-600 hover:underline font-medium">
                            編輯
                        </button>
                    </div>
                </div>
            `).join('');
        }

        /* ================= 💾 表單提交 (新增 / 編輯) ================= */
        async function handleFormSubmit(e) {
            e.preventDefault();
            const id = document.getElementById('edit-id').value;
            const partNumber = document.getElementById('form-part-number').value.trim();
            const name = document.getElementById('form-part-name').value.trim();
            const crossReference = document.getElementById('form-cross-reference').value.trim();
            const price = parseFloat(document.getElementById('form-price').value) || 0;
            const stock = parseInt(document.getElementById('form-stock').value) || 0;

            const payload = {
                part_number: partNumber,
                name: name,
                cross_reference: crossReference,
                price: price,
                stock: stock
            };

            try {
                if (id) {
                    // 編輯邏輯
                    await _supabase.from('parts').update(payload).eq('id', id);
                } else {
                    // 新增邏輯
                    await _supabase.from('parts').insert([payload]);
                }

                // 發動雙向同步關聯寫入
                if (partNumber && crossReference) {
                    await syncCrossReferences(partNumber, crossReference);
                }

                alert('✅ 資料儲存與雙向同步成功！');
                closeModal();
                searchParts();
            } catch (err) {
                alert('❌ 儲存失敗：' + err.message);
            }
        }

        /* ================= 🪟 Modal 彈窗控制 ================= */
        function openAddModal() {
            document.getElementById('edit-id').value = '';
            document.getElementById('modal-title').innerText = '新增零件資料';
            document.getElementById('part-form').reset();
            document.getElementById('part-modal').classList.remove('hidden');
            document.getElementById('part-modal').classList.add('flex');
        }

        function openEditModal(item) {
            document.getElementById('edit-id').value = item.id;
            document.getElementById('modal-title').innerText = '編輯零件資料';
            document.getElementById('form-part-number').value = item.part_number || '';
            document.getElementById('form-part-name').value = item.name || '';
            document.getElementById('form-cross-reference').value = item.cross_reference || '';
            document.getElementById('form-price').value = item.price || '';
            document.getElementById('form-stock').value = item.stock || '';
            document.getElementById('part-modal').classList.remove('hidden');
            document.getElementById('part-modal').classList.add('flex');
        }

        function closeModal() {
            document.getElementById('part-modal').classList.add('hidden');
            document.getElementById('part-modal').classList.remove('flex');
        }

        function clearSearch() {
            document.getElementById('search-keyword').value = '';
            document.getElementById('search-brand').value = '';
            document.getElementById('search-model').value = '';
            document.getElementById('search-year').value = '';
            searchParts();
        }
    </script>
</body>
</html>
