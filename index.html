<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HW汽車冷氣零件查詢系統</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f6f9;
            color: #333;
            margin: 0;
            padding: 20px;
        }
        .container {
            max-width: 1000px;
            margin: 0 auto;
        }
        .header {
            background-color: #1e3a8a;
            color: white;
            padding: 15px 20px;
            border-radius: 8px;
            margin-bottom: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .header h1 {
            margin: 0;
            font-size: 24px;
        }
        .search-panel {
            background: white;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
            margin-bottom: 20px;
        }
        .form-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 15px;
            margin-bottom: 15px;
        }
        .form-group {
            display: flex;
            flex-direction: column;
        }
        label {
            font-size: 14px;
            font-weight: bold;
            margin-bottom: 5px;
            color: #555;
        }
        input, select {
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 4px;
            font-size: 14px;
        }
        .chips-container {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }
        .chip {
            padding: 6px 12px;
            background-color: #e2e8f0;
            border-radius: 16px;
            font-size: 14px;
            cursor: pointer;
            transition: all 0.2s;
            user-select: none;
        }
        .chip.active {
            background-color: #1e3a8a;
            color: white;
        }
        .btn-search {
            background-color: #059669;
            color: white;
            border: none;
            padding: 10px 25px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 16px;
            font-weight: bold;
            width: 100%;
        }
        .btn-search:hover {
            background-color: #047857;
        }
        .results-area {
            display: grid;
            gap: 15px;
        }
        .part-card {
            background: white;
            padding: 15px;
            border-radius: 8px;
            border-left: 5px solid #1e3a8a;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }
        .part-header {
            display: flex;
            justify-content: space-between;
            border-bottom: 1px solid #eee;
            padding-bottom: 10px;
            margin-bottom: 10px;
        }
        .part-no {
            font-size: 18px;
            font-weight: bold;
            color: #b91c1c;
        }
        .part-info p {
            margin: 5px 0;
            font-size: 14px;
        }
        .action-buttons {
            margin-top: 10px;
            display: flex;
            gap: 10px;
        }
        .btn-link {
            background-color: #f3f4f6;
            border: 1px solid #d1d5db;
            padding: 5px 10px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 13px;
        }
        .btn-link:hover {
            background-color: #e5e7eb;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <h1>凱堤耐特 - 汽車冷氣零件系統</h1>
        <small>專業汽車空調供應商</small>
    </div>

    <div class="search-panel">
        <!-- 零件名稱標籤區 -->
        <label>快速篩選零件名稱：</label>
        <div class="chips-container" id="chips-area">
            <!-- 標籤由 JS 動態生成 -->
        </div>

        <div class="form-grid">
            <div class="form-group">
                <label for="search-keyword">料號關鍵字</label>
                <input type="text" id="search-keyword" placeholder="輸入料號(如: COMP-001)">
            </div>
            <div class="form-group">
                <label for="search-brand">車廠 (Brand)</label>
                <select id="search-brand" onchange="handleBrandChange()">
                    <option value="">全部車廠</option>
                    <option value="TOYOTA">TOYOTA</option>
                    <option value="HONDA">HONDA</option>
                    <option value="BMW">BMW</option>
                </select>
            </div>
            <div class="form-group">
                <label for="search-model">車型 (Model)</label>
                <input type="text" id="search-model" placeholder="如: Altis, E36">
            </div>
            <div class="form-group">
                <label for="search-vehicle-type">車種 (Type)</label>
                <select id="search-vehicle-type">
                    <option value="">全部車種</option>
                    <option value="轎車">轎車</option>
                    <option value="休旅車">休旅車</option>
                    <option value="商用車">商用車</option>
                </select>
            </div>
            <div class="form-group">
                <label for="search-year">年份 (Year)</label>
                <input type="text" id="search-year" placeholder="如: 2018">
            </div>
        </div>
        <button class="btn-search" onclick="searchParts()">搜尋零件</button>
    </div>

    <!-- 搜尋結果顯示區 -->
    <div class="results-area" id="results-container">
        <!-- 結果由 JS 動態生成 -->
    </div>
</div>

<script>
    // --- 1. 模擬資料庫 (Mock Data) ---
    const database = [
        { partNo: 'COMP-TY-001', name: '壓縮機', brand: 'TOYOTA', model: 'Altis', type: '轎車', year: '2015-2018', related: 'OR-UN-999' },
        { partNo: 'OR-UN-999', name: 'O環', brand: '通用', model: '通用', type: '通用', year: '通用', related: '' },
        { partNo: 'COND-HO-002', name: '冷凝器', brand: 'HONDA', model: 'CR-V', type: '休旅車', year: '2019-2022', related: 'FAN-HO-002' },
        { partNo: 'FAN-HO-002', name: '散熱風扇', brand: 'HONDA', model: 'CR-V', type: '休旅車', year: '2019-2022', related: 'COND-HO-002' },
        { partNo: 'EVAP-BM-003', name: '蒸發器', brand: 'BMW', model: '3系列 (E36)', type: '轎車', year: '1990-2000', related: 'EXP-BM-003' },
        { partNo: 'EXP-BM-003', name: '膨脹閥', brand: 'BMW', model: '3系列 (E36)', type: '轎車', year: '1990-2000', related: '' }
    ];

    // --- 2. 全域變數與初始化 ---
    let selectedPartNamesSet = new Set();
    const availableParts = ['壓縮機', '冷凝器', '蒸發器', '散熱風扇', '膨脹閥', 'O環'];

    // 頁面載入時初始化
    window.onload = function() {
        renderPartChipsUI();
        searchParts(); // 初始載入顯示全部
    };

    // --- 3. UI 渲染功能 ---
    function renderPartChipsUI() {
        const chipsArea = document.getElementById('chips-area');
        chipsArea.innerHTML = '';
        
        availableParts.forEach(part => {
            const chip = document.createElement('div');
            chip.className = `chip ${selectedPartNamesSet.has(part) ? 'active' : ''}`;
            chip.textContent = part;
            chip.onclick = () => toggleChip(part);
            chipsArea.appendChild(chip);
        });
    }

    function toggleChip(partName) {
        if (selectedPartNamesSet.has(partName)) {
            selectedPartNamesSet.delete(partName);
        } else {
            selectedPartNamesSet.add(partName);
        }
        renderPartChipsUI();
        searchParts(); // 點擊標籤後自動搜尋
    }

    function handleBrandChange() {
        // 這裡可以根據車廠連動修改車型下拉選單（範例省略複雜連動）
        console.log("車廠變更為: " + document.getElementById('search-brand').value);
    }

    // --- 4. 核心搜尋功能 ---
    function searchParts() {
        const keyword = document.getElementById('search-keyword').value.trim().toUpperCase();
        const brand = document.getElementById('search-brand').value.toUpperCase();
        const model = document.getElementById('search-model').value.trim().toUpperCase();
        const type = document.getElementById('search-vehicle-type').value;
        const year = document.getElementById('search-year').value.trim();

        const resultsContainer = document.getElementById('results-container');
        resultsContainer.innerHTML = ''; // 清空目前結果

        // 過濾邏輯
        const filteredData = database.filter(item => {
            // 條件1：關鍵字 (料號) 比對
            const matchKeyword = keyword === '' || item.partNo.toUpperCase().includes(keyword);
            // 條件2：車輛條件比對 (若為'通用'則無視該條件，以符合零件特性)
            const matchBrand = brand === '' || item.brand === '通用' || item.brand.toUpperCase() === brand;
            const matchModel = model === '' || item.model === '通用' || item.model.toUpperCase().includes(model);
            const matchType = type === '' || item.type === '通用' || item.type === type;
            const matchYear = year === '' || item.year === '通用' || item.year.includes(year);
            // 條件3：零件名稱標籤比對
            const matchChips = selectedPartNamesSet.size === 0 || selectedPartNamesSet.has(item.name);

            return matchKeyword && matchBrand && matchModel && matchType && matchYear && matchChips;
        });

        // 渲染結果卡片
        if (filteredData.length === 0) {
            resultsContainer.innerHTML = '<p style="color:red; text-align:center;">查無符合條件的零件，請嘗試放寬搜尋條件。</p>';
            return;
        }

        filteredData.forEach(item => {
            const card = document.createElement('div');
            card.className = 'part-card';
            
            // 處理配套按鈕的 HTML
            let relatedButtonHtml = '';
            if (item.related) {
                relatedButtonHtml = `<button class="btn-link" onclick="jumpToKeywordSearch('${item.related}')">查看配套料號: ${item.related}</button>`;
            }

            // 處理車型快捷搜尋按鈕
            let vehicleButtonHtml = '';
            if (item.brand !== '通用') {
                vehicleButtonHtml = `<button class="btn-link" onclick="jumpToVehicleFilter('${item.brand}', '${item.model}', '${item.type}')">搜尋此車型所有零件</button>`;
            }

            card.innerHTML = `
                <div class="part-header">
                    <span class="part-no">${item.partNo} (${item.name})</span>
                    <span style="color:#666;">適用: ${item.brand} ${item.model}</span>
                </div>
                <div class="part-info">
                    <p><strong>車種：</strong>${item.type} | <strong>年份：</strong>${item.year}</p>
                </div>
                <div class="action-buttons">
                    ${relatedButtonHtml}
                    ${vehicleButtonHtml}
                </div>
            `;
            resultsContainer.appendChild(card);
        });
    }

    // --- 5. 修正後的跳轉功能 (雙向防呆與清空干擾條件) ---

    // 點擊「查看配套料號」時觸發
    function jumpToKeywordSearch(targetKeyword) {
        // 1. 清空其他車輛與年份篩選條件，避免「通用件」被車廠條件濾除
        document.getElementById('search-vehicle-type').value = '';
        document.getElementById('search-brand').value = '';
        document.getElementById('search-model').value = '';
        document.getElementById('search-year').value = '';
        
        // 2. 清空已選取的「零件名稱」標籤 (Chips)，避免因名稱不同被濾除
        selectedPartNamesSet.clear();
        renderPartChipsUI();

        // 3. 將點擊的料號填入關鍵字欄位
        document.getElementById('search-keyword').value = targetKeyword;
        
        // 4. 執行搜尋並將畫面平滑滾動至頂部
        window.scrollTo({ top: 0, behavior: 'smooth' });
        searchParts();
    }

    // 點擊「搜尋此車型所有零件」時觸發
    function jumpToVehicleFilter(targetBrand, targetModel, targetVehicleType) {
        // 1. 清空料號關鍵字與零件名稱標籤，確保列出該車所有部位零件
        document.getElementById('search-keyword').value = '';
        document.getElementById('search-year').value = ''; // 視需求決定是否保留年份
        selectedPartNamesSet.clear();
        renderPartChipsUI();

        // 2. 帶入專屬的車輛條件
        document.getElementById('search-brand').value = targetBrand || '';
        document.getElementById('search-model').value = targetModel || '';
        document.getElementById('search-vehicle-type').value = targetVehicleType || '';
        
        // 觸發可能有的連動事件
        handleBrandChange();
        
        // 3. 執行搜尋並滾動至頂部
        window.scrollTo({ top: 0, behavior: 'smooth' });
        searchParts();
    }
</script>

</body>
</html>
